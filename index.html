<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Lista de Compras</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Lista de Compras" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#383772" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#383772;
    --yellow:#FBAD09;
    --lightblue:#A6C0E4;
    --gray:#7E7A68;
    --bg:#F4F5F9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",'Segoe UI',Roboto,Arial,sans-serif;color:var(--navy);line-height:1.4;}
  #app{max-width:420px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;}
  .header{background:var(--navy);padding:32px 20px 24px;border-radius:0 0 24px 24px;color:#fff;position:relative;}
  .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--lightblue);margin:0;}
  .h1{font-size:27px;font-weight:700;margin:2px 0 0;}
  .sub{font-size:13px;color:var(--lightblue);margin:4px 0 0;}
  .header-row{display:flex;align-items:center;gap:10px;}
  .back-btn{color:#fff;font-size:24px;padding:4px;margin-left:-4px;}
  .sync-badge{position:absolute;top:14px;right:16px;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600;display:flex;align-items:center;gap:4px;}
  .sync-badge.ok{background:rgba(255,255,255,.15);color:#B9F0C4;}
  .sync-badge.syncing{background:rgba(255,255,255,.15);color:var(--yellow);}
  .sync-badge.off{background:rgba(255,255,255,.15);color:#F0B9B9;}
  .cta{width:100%;border-radius:16px;padding:17px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;background:var(--yellow);color:var(--navy);box-shadow:0 6px 16px rgba(251,173,9,.35);}
  .cta:active{transform:scale(.98);}
  .section{padding:0 20px;margin-top:20px;}
  .section-title{font-size:16px;font-weight:700;margin:0 0 10px;}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .list-card{width:100%;text-align:left;margin-bottom:12px;position:relative;}
  .list-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .list-date{font-size:12px;color:var(--gray);margin:0;}
  .list-total{font-size:21px;font-weight:700;margin:2px 0 0;}
  .badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;}
  .badge.ok{background:#E9F2E9;color:#2E7D32;}
  .badge.over{background:#FDE8E8;color:#C0392B;}
  .list-meta{font-size:12px;color:var(--gray);margin-top:8px;}
  .del-btn{position:absolute;top:12px;right:12px;font-size:16px;color:var(--gray);padding:6px;}
  .empty{text-align:center;padding:40px 16px;border-radius:16px;background:#fff;border:1.5px dashed var(--lightblue);color:var(--gray);font-size:14px;}
  .bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:10;}
  .bottomnav-inner{max-width:420px;width:100%;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.06);border-radius:20px 20px 0 0;display:flex;padding:10px 32px;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--gray);}
  .nav-btn.active{color:var(--navy);}
  .nav-icon{font-size:19px;}
  .field-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .field-label{font-size:12px;font-weight:600;color:var(--gray);}
  .field-input{border:none;background:transparent;text-align:right;font-weight:700;font-size:17px;color:var(--navy);width:110px;}
  .bar-track{height:9px;border-radius:99px;background:#eee;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .3s;}
  .meta-info{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--gray);}
  .form-label{font-size:12px;font-weight:600;color:var(--gray);margin-bottom:8px;display:block;}
  .text-input{width:100%;font-size:16px;border-radius:10px;padding:11px 12px;margin-bottom:8px;background:var(--bg);border:none;color:var(--navy);}
  .form-row{display:flex;gap:8px;margin-bottom:12px;}
  .form-row .text-input{margin-bottom:0;}
  .qty-input{width:33%;}
  .add-btn{width:100%;border-radius:12px;padding:13px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .receipt{border-top:3px dashed var(--lightblue);}
  .cat-group{margin-bottom:14px;}
  .cat-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin:0 0 6px;}
  .item-row{display:flex;align-items:center;gap:8px;padding:8px 0;font-family:'Courier New',monospace;font-size:14px;}
  .item-row.bought{opacity:.45;}
  .chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--lightblue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:var(--navy);}
  .chk.on{background:var(--yellow);border-color:var(--yellow);}
  .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-name.bought{text-decoration:line-through;}
  .item-calc{color:var(--gray);font-size:12px;white-space:nowrap;}
  .item-sub{font-weight:700;width:72px;text-align:right;}
  .item-del{color:var(--gray);padding:6px;flex-shrink:0;font-size:14px;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed var(--lightblue);padding-top:10px;margin-top:6px;font-family:'Courier New',monospace;}
  .receipt-total span:first-child{font-weight:700;font-size:13px;}
  .receipt-total span:last-child{font-weight:700;font-size:18px;}
  .save-btn{width:100%;border-radius:16px;padding:17px;font-weight:700;font-size:16px;background:var(--yellow);color:var(--navy);box-shadow:0 6px 16px rgba(251,173,9,.35);margin-top:6px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .stat-card.wide{grid-column:span 2;}
  .stat-label{font-size:11px;color:var(--gray);margin:0;}
  .stat-value{font-size:19px;font-weight:700;margin:2px 0 0;}
  .chart-wrap{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--yellow);min-height:3px;}
  .chart-lbl{font-size:10px;color:var(--gray);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .rank-num{width:24px;height:24px;border-radius:50%;background:var(--lightblue);color:var(--navy);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-count{font-size:14px;font-weight:700;color:var(--gray);}

  .yoy-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .yoy-col{flex:1;text-align:center;}
  .yoy-arrow{font-size:18px;color:var(--lightblue);font-weight:700;}
  .yoy-badge{margin-top:14px;text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:12px;}
  .yoy-badge.up{background:#FDE8E8;color:#C0392B;}
  .yoy-badge.down{background:#E9F2E9;color:#2E7D32;}
  .yoy-badge.flat{background:var(--bg);color:var(--gray);}

  /* Floating calculator button */
  .calc-fab{position:fixed;bottom:96px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(56,55,114,.4);z-index:20;}
  .calc-fab:active{transform:scale(.94);}

  /* Overlays (calculator + new-list modal) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .overlay-box{background:#fff;width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:20px;padding-bottom:34px;}
  .overlay-title{font-size:16px;font-weight:700;margin:0 0 4px;}
  .overlay-sub{font-size:13px;color:var(--gray);margin:0 0 16px;}

  .calc-display{background:var(--bg);border-radius:14px;padding:18px 16px;text-align:right;font-family:'Courier New',monospace;font-size:32px;font-weight:700;color:var(--navy);margin-bottom:14px;overflow-x:auto;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .calc-btn{background:var(--bg);border-radius:14px;padding:18px 0;font-size:19px;font-weight:700;color:var(--navy);text-align:center;}
  .calc-btn.op{background:var(--lightblue);color:var(--navy);}
  .calc-btn.eq{background:var(--yellow);color:var(--navy);}
  .calc-btn.clear{background:#FDE8E8;color:#C0392B;}
  .calc-close{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);color:var(--gray);font-weight:700;font-size:15px;text-align:center;}

  .modal-btn{width:100%;border-radius:14px;padding:15px;font-weight:700;font-size:14px;margin-bottom:10px;background:var(--bg);color:var(--navy);text-align:left;}
  .modal-btn:last-child{margin-bottom:0;}
  .modal-btn b{display:block;font-size:14px;}
  .modal-btn span{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-top:2px;}

  .market-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--navy);background:var(--lightblue);padding:3px 9px;border-radius:999px;margin-top:6px;}
  .list-name{font-size:15px;font-weight:700;margin:0 0 2px;color:var(--navy);}
  .photo-btn{width:100%;border-radius:12px;padding:13px;background:var(--lightblue);color:var(--navy);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
  .photo-status{text-align:center;font-size:12px;color:var(--gray);margin:-2px 0 8px;}
  .prio-row{display:flex;gap:6px;margin-bottom:12px;}
  .prio-btn{flex:1;border-radius:10px;padding:9px 0;font-size:12px;font-weight:700;text-align:center;background:var(--bg);color:var(--gray);border:1.5px solid transparent;}
  .prio-btn.selected{border-color:currentColor;}
  .prio-btn.p-alta{color:#C0392B;}
  .prio-btn.p-alta.selected{background:#FDE8E8;}
  .prio-btn.p-normal{color:#B8860B;}
  .prio-btn.p-normal.selected{background:#FDF3D9;}
  .prio-btn.p-baixa{color:#2E7D32;}
  .prio-btn.p-baixa.selected{background:#E9F2E9;}
  .prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .prio-dot.alta{background:#E74C3C;}
  .prio-dot.normal{background:#FBAD09;}
  .prio-dot.baixa{background:#2E7D32;}
</style>
</head>
<body>
<div id="app"></div>

<button id="calc-fab" class="calc-fab" title="Calculadora">🧮</button>

<div id="calc-overlay" class="overlay">
  <div class="overlay-box">
    <p class="overlay-title">Calculadora</p>
    <p class="overlay-sub">Só pra conferir contas — não mexe na sua lista.</p>
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-grid" id="calc-grid"></div>
    <button class="calc-close" id="calc-close">Fechar</button>
  </div>
</div>

<div id="newlist-overlay" class="overlay">
  <div class="overlay-box">
    <p class="overlay-title">Nova lista</p>
    <p class="overlay-sub">Quer repetir os itens da última lista?</p>
    <button class="modal-btn" data-newlist="all"><b>Repetir todos os itens</b><span>Copia tudo, desmarcado, pra você comprar de novo</span></button>
    <button class="modal-btn" data-newlist="pending"><b>Repetir só o que faltou</b><span>Copia apenas os itens que não foram comprados</span></button>
    <button class="modal-btn" data-newlist="empty"><b>Começar do zero</b><span>Lista em branco</span></button>
  </div>
</div>

<script>
/* ---------- Supabase ---------- */
const SUPABASE_URL = "https://okoxgwkevxzxegqcsgwc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rb3hnd2tldnh6eGVncWNzZ3djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NjQwNjMsImV4cCI6MjEwMDE0MDA2M30.g50BQ4i1t61Q2uOWVMb-k5NNcwGGyZRvv0BO9EaPQI4";
const STORAGE_KEY = "shopping_lists";
let sb = null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }catch(e){ sb = null; }

/* ---------- local cache ---------- */
const CACHE_KEY = "carol_shopping_lists_v1";
function loadLocal(){
  try{ return JSON.parse(localStorage.getItem(CACHE_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveLocal(lists){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(lists)); }catch(e){}
}

let syncStatus = "syncing";

async function pullFromCloud(){
  if(!sb) { syncStatus = "off"; render(); return; }
  try{
    const { data, error } = await sb.from('lista_compras_storage').select('dados').eq('chave', STORAGE_KEY).maybeSingle();
    if(error) throw error;
    if(data && data.dados){
      state.lists = data.dados;
      saveLocal(state.lists);
    }
    syncStatus = "ok";
  }catch(e){
    syncStatus = "off";
  }
  render();
}

async function pushToCloud(lists){
  if(!sb) { syncStatus = "off"; render(); return; }
  syncStatus = "syncing";
  render();
  try{
    const { error } = await sb.from('lista_compras_storage').upsert({ chave: STORAGE_KEY, dados: lists, updated_at: new Date().toISOString() });
    if(error) throw error;
    syncStatus = "ok";
  }catch(e){
    syncStatus = "off";
  }
  render();
}

function persist(){
  saveLocal(state.lists);
  pushToCloud(state.lists);
}

/* ---------- constants ---------- */
const CATEGORIES = [
  {id:"hortifruti", label:"Hortifruti", emoji:"🥬"},
  {id:"acougue", label:"Açougue", emoji:"🥩"},
  {id:"padaria", label:"Padaria", emoji:"🍞"},
  {id:"laticinios", label:"Laticínios", emoji:"🧀"},
  {id:"limpeza", label:"Limpeza", emoji:"🧽"},
  {id:"higiene", label:"Higiene", emoji:"🧴"},
  {id:"bebidas", label:"Bebidas", emoji:"🥤"},
  {id:"mercearia", label:"Mercearia", emoji:"🛒"},
  {id:"outros", label:"Outros", emoji:"📦"},
];

/* ---------- helpers ---------- */
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtDate(d){
  const date = new Date(d+"T00:00:00");
  return date.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
}
function monthKey(d){ return d.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split("-");
  const d = new Date(Number(y), Number(m)-1, 1);
  return d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
}
function listTotal(l){ return l.items.reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.unitPrice)||0), 0); }
function uid(p){ return p+"_"+Date.now()+"_"+Math.floor(Math.random()*1000); }
function esc(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
function prioLabel(p){ return p==='alta' ? 'Essencial' : (p==='baixa' ? 'Se sobrar' : 'Normal'); }

/* ---------- state ---------- */
let state = {
  screen: "home",
  lists: loadLocal(),
  activeList: null,
  form: { name:"", category:"mercearia", qty:"1", unitPrice:"", priority:"normal" },
  ocrStatus: null,
};

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'list') app.innerHTML = renderListEditor();
  else app.innerHTML = renderSummary();
  bindEvents();
}

function syncBadge(){
  if(syncStatus === 'ok') return `<div class="sync-badge ok">☁️ Sincronizado</div>`;
  if(syncStatus === 'syncing') return `<div class="sync-badge syncing">🔄 Sincronizando...</div>`;
  return `<div class="sync-badge off">📴 Offline</div>`;
}

function renderHome(){
  const sorted = [...state.lists].sort((a,b)=> a.date < b.date ? 1 : -1);
  const cards = sorted.map(l=>{
    const total = listTotal(l);
    const meta = Number(l.meta)||0;
    const over = meta>0 && total>meta;
    const bought = l.items.filter(i=>i.bought).length;
    return `
      <button class="card list-card" data-open="${l.id}">
        <div class="top">
          <div>
            ${l.name ? `<p class="list-name">${esc(l.name)}</p>` : ''}
            <p class="list-date">${fmtDate(l.date)}</p>
            <p class="list-total">${brl(total)}</p>
          </div>
          <div class="badge ${over?'over':'ok'}">${over?'Acima da meta':'Dentro da meta'}</div>
        </div>
        <p class="list-meta">${l.items.length} ${l.items.length===1?'item':'itens'} · ${bought} comprado${bought!==1?'s':''}</p>
        ${l.market ? `<span class="market-tag">🏪 ${esc(l.market)}</span>` : ''}
        <span class="del-btn" data-del="${l.id}">✕</span>
      </button>`;
  }).join('');

  return `
    <div class="header">
      ${syncBadge()}
      <p class="eyebrow">Olá,</p>
      <h1 class="h1">Carol</h1>
      <p class="sub">Suas compras, sempre no controle</p>
    </div>
    <div class="section" style="margin-top:-16px;">
      <button class="cta" id="btn-new">+ Nova lista de compras</button>
    </div>
    <div class="section"><h2 class="section-title">Listas salvas</h2></div>
    <div class="section" style="margin-top:-8px;">
      ${sorted.length===0 ? `<div class="empty">🛍️<br/><br/>Nenhuma lista ainda.<br/>Toque em "Nova lista" para começar.</div>` : cards}
    </div>
    ${bottomNav('home')}
  `;
}

function renderListEditor(){
  const l = state.activeList;
  const total = listTotal(l);
  const meta = Number(l.meta)||0;
  const pct = meta>0 ? Math.min(100, (total/meta)*100) : 0;
  const over = meta>0 && total>meta;
  const f = state.form;

  const grouped = CATEGORIES.map(c=>({...c, items: l.items.filter(it=>it.category===c.id)})).filter(g=>g.items.length>0);
  const groupsHtml = grouped.map(g=>`
    <div class="cat-group">
      <p class="cat-title">${g.emoji} ${g.label}</p>
      ${g.items.map(it=>{
        const sub = it.qty*it.unitPrice;
        const prio = it.priority || 'normal';
        return `
        <div class="item-row ${it.bought?'bought':''}">
          <span class="prio-dot ${prio}" title="${prioLabel(prio)}"></span>
          <span class="chk ${it.bought?'on':''}" data-toggle="${it.id}">${it.bought?'✓':''}</span>
          <span class="item-name ${it.bought?'bought':''}">${esc(it.name)}</span>
          <span class="item-calc">${it.qty}×${brl(it.unitPrice)}</span>
          <span class="item-sub">${brl(sub)}</span>
          <span class="item-del" data-remove="${it.id}">✕</span>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  const catOptions = CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===f.category?'selected':''}>${c.emoji} ${c.label}</option>`).join('');
  const prio = f.priority || 'normal';

  return `
    <div class="header header-row">
      <button class="back-btn" id="btn-back">‹</button>
      <input type="date" id="date-input" value="${l.date}" style="background:transparent;border:none;color:#fff;font-size:15px;font-weight:600;" />
    </div>
    <div class="section" style="margin-top:-12px;">
      <div class="card">
        <input class="text-input" id="list-name-input" placeholder="Nome da lista (opcional, ex: Compra do mês)" value="${esc(l.name||'')}" />
        <input class="text-input" id="list-market-input" style="margin-bottom:0;" placeholder="🏪 Mercado (opcional, ex: Atacadão)" value="${esc(l.market||'')}" />
      </div>
    </div>
    <div class="section">
      <div class="card">
        <div class="field-row">
          <label class="field-label">Meta de gasto</label>
          <input class="field-input" type="number" inputmode="decimal" id="meta-input" placeholder="0,00" value="${l.meta}" />
        </div>
        <div class="bar-track"><div class="bar-fill" id="bar-fill" style="width:${pct}%;background:${over?'#E74C3C':'var(--yellow)'};"></div></div>
        <div class="meta-info">
          <span>Gasto: <b id="gasto-val" style="color:${over?'#E74C3C':'var(--navy)'}">${brl(total)}</b></span>
          <span id="meta-extra">${meta>0 ? (over ? `Excedeu ${brl(total-meta)}` : `Falta ${brl(meta-total)}`) : ''}</span>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="card">
        <span class="form-label">Adicionar produto</span>
        <input type="file" id="label-photo-input" accept="image/*" capture="environment" style="display:none" />
        <button class="photo-btn" id="btn-photo">📷 Ler etiqueta (beta)</button>
        ${state.ocrStatus ? `<p class="photo-status">${state.ocrStatus}</p>` : ''}
        <input class="text-input" id="f-name" placeholder="Nome do produto" value="${esc(f.name)}" />
        <select class="text-input" id="f-cat">${catOptions}</select>
        <div class="form-row" style="margin-bottom:10px;">
          <input class="text-input qty-input" id="f-qty" type="number" inputmode="decimal" placeholder="Qtd" value="${f.qty}" />
          <input class="text-input" id="f-price" type="number" inputmode="decimal" placeholder="Valor unit. (R$)" value="${f.unitPrice}" />
        </div>
        <span class="form-label">Prioridade</span>
        <div class="prio-row">
          <button class="prio-btn p-alta ${prio==='alta'?'selected':''}" data-prio="alta">🔴 Essencial</button>
          <button class="prio-btn p-normal ${prio==='normal'?'selected':''}" data-prio="normal">🟡 Normal</button>
          <button class="prio-btn p-baixa ${prio==='baixa'?'selected':''}" data-prio="baixa">🟢 Se sobrar</button>
        </div>
        <button class="add-btn" id="btn-add">+ Adicionar</button>
      </div>
    </div>
    <div class="section">
      <div class="card receipt">
        ${l.items.length===0 ? `<p style="text-align:center;font-size:13px;color:var(--gray);padding:20px 0;">Nenhum produto na lista ainda.</p>` : groupsHtml}
        ${l.items.length>0 ? `<div class="receipt-total"><span>TOTAL</span><span>${brl(total)}</span></div>` : ''}
      </div>
    </div>
    <div class="section">
      <button class="save-btn" id="btn-save">Salvar lista</button>
    </div>
  `;
}

function renderSummary(){
  const lists = state.lists;
  const now = new Date();
  const curKey = now.toISOString().slice(0,7);
  const lastD = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastKey = lastD.toISOString().slice(0,7);
  const curYear = String(now.getFullYear());

  const curMonthTotal = lists.filter(l=>monthKey(l.date)===curKey).reduce((s,l)=>s+listTotal(l),0);
  const lastMonthTotal = lists.filter(l=>monthKey(l.date)===lastKey).reduce((s,l)=>s+listTotal(l),0);
  const yearTotal = lists.filter(l=>l.date.slice(0,4)===curYear).reduce((s,l)=>s+listTotal(l),0);

  const sameMonthLastYearKey = `${now.getFullYear()-1}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const sameMonthLastYearTotal = lists.filter(l=>monthKey(l.date)===sameMonthLastYearKey).reduce((s,l)=>s+listTotal(l),0);
  const monthNamePt = now.toLocaleDateString('pt-BR', {month:'long'});
  const hasLastYearData = lists.some(l=>monthKey(l.date)===sameMonthLastYearKey);
  let yoyPct = null;
  if(hasLastYearData && sameMonthLastYearTotal > 0){
    yoyPct = ((curMonthTotal - sameMonthLastYearTotal) / sameMonthLastYearTotal) * 100;
  }

  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.toISOString().slice(0,7);
    const total = lists.filter(l=>monthKey(l.date)===key).reduce((s,l)=>s+listTotal(l),0);
    months.push({key, label:monthLabel(key), total});
  }
  const maxVal = Math.max(1, ...months.map(m=>m.total));
  const chartHtml = months.map(m=>`
    <div class="chart-col">
      <div class="chart-bar" style="height:${Math.max(3,(m.total/maxVal)*110)}px;"></div>
      <span class="chart-lbl">${m.label}</span>
    </div>
  `).join('');

  const map = {};
  lists.forEach(l=> l.items.forEach(it=>{
    const key = it.name.trim().toLowerCase();
    if(!map[key]) map[key] = {name:it.name, count:0};
    map[key].count += Number(it.qty)||0;
  }));
  const topItems = Object.values(map).sort((a,b)=>b.count-a.count).slice(0,5);
  const rankHtml = topItems.map((it,idx)=>`
    <div class="rank-row">
      <div class="rank-num">${idx+1}</div>
      <span class="rank-name">${esc(it.name)}</span>
      <span class="rank-count">${it.count}x</span>
    </div>
  `).join('');

  return `
    <div class="header header-row">
      <button class="back-btn" id="btn-back">‹</button>
      <h1 style="font-size:18px;font-weight:700;margin:0;">Resumo</h1>
    </div>
    <div class="section">
      <div class="stat-grid">
        <div class="stat-card"><p class="stat-label">Este mês</p><p class="stat-value">${brl(curMonthTotal)}</p></div>
        <div class="stat-card"><p class="stat-label">Mês passado</p><p class="stat-value">${brl(lastMonthTotal)}</p></div>
        <div class="stat-card wide"><p class="stat-label">Total em ${curYear}</p><p class="stat-value">${brl(yearTotal)}</p></div>
      </div>
    </div>
    <div class="section">
      <h2 class="section-title">Comparado ao ano passado</h2>
      <div class="card">
        ${!hasLastYearData ? `
          <p style="text-align:center;font-size:13px;color:var(--gray);">Ainda não tenho compras registradas em ${monthNamePt} do ano passado pra comparar.</p>
        ` : `
          <div class="yoy-row">
            <div class="yoy-col">
              <p class="stat-label">${monthNamePt}/${curYear}</p>
              <p class="stat-value">${brl(curMonthTotal)}</p>
            </div>
            <div class="yoy-arrow">→</div>
            <div class="yoy-col">
              <p class="stat-label">${monthNamePt}/${curYear-1}</p>
              <p class="stat-value">${brl(sameMonthLastYearTotal)}</p>
            </div>
          </div>
          ${yoyPct !== null ? `
            <div class="yoy-badge ${yoyPct > 0 ? 'up' : (yoyPct < 0 ? 'down' : 'flat')}">
              ${yoyPct > 0 ? '▲' : (yoyPct < 0 ? '▼' : '—')} ${Math.abs(yoyPct).toFixed(0)}% ${yoyPct > 0 ? 'a mais' : (yoyPct < 0 ? 'a menos' : 'igual')} que ano passado
            </div>
          ` : ''}
        `}
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Últimos 6 meses</h2>
      <div class="card">
        ${lists.length===0 ? `<p style="text-align:center;font-size:13px;color:var(--gray);">Sem dados suficientes ainda.</p>` : `<div class="chart-wrap">${chartHtml}</div>`}
      </div>
    </div>
    <div class="section">
      <h2 class="section-title">Itens mais comprados</h2>
      <div class="card">
        ${topItems.length===0 ? `<p style="text-align:center;font-size:13px;color:var(--gray);">Nenhum produto registrado ainda.</p>` : rankHtml}
      </div>
    </div>
    ${bottomNav('summary')}
  `;
}

function bottomNav(active){
  return `
    <div class="bottomnav">
      <div class="bottomnav-inner">
        <button class="nav-btn ${active==='home'?'active':''}" id="nav-home"><span class="nav-icon">🏠</span>Início</button>
        <button class="nav-btn ${active==='summary'?'active':''}" id="nav-summary"><span class="nav-icon">📊</span>Resumo</button>
      </div>
    </div>
  `;
}

/* ---------- meta bar: targeted update (no full re-render, avoids losing focus) ---------- */
function updateMetaBarUI(){
  const l = state.activeList;
  const total = listTotal(l);
  const meta = Number(l.meta)||0;
  const pct = meta>0 ? Math.min(100,(total/meta)*100) : 0;
  const over = meta>0 && total>meta;
  const bar = document.getElementById('bar-fill');
  if(bar){ bar.style.width = pct+'%'; bar.style.background = over ? '#E74C3C' : 'var(--yellow)'; }
  const gastoEl = document.getElementById('gasto-val');
  if(gastoEl){ gastoEl.textContent = brl(total); gastoEl.style.color = over ? '#E74C3C' : 'var(--navy)'; }
  const extraEl = document.getElementById('meta-extra');
  if(extraEl){ extraEl.textContent = meta>0 ? (over ? `Excedeu ${brl(total-meta)}` : `Falta ${brl(meta-total)}`) : ''; }
}

/* ---------- events ---------- */
function bindEvents(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  if(state.screen === 'home'){
    $('#btn-new').onclick = () => {
      if(state.lists.length > 0){
        document.getElementById('newlist-overlay').classList.add('show');
      } else {
        createNewList([]);
      }
    };
    $$('[data-open]').forEach(b=> b.onclick = () => {
      const id = b.getAttribute('data-open');
      state.activeList = JSON.parse(JSON.stringify(state.lists.find(l=>l.id===id)));
      state.screen = 'list';
      render();
    });
    $$('[data-del]').forEach(b=> b.onclick = (e) => {
      e.stopPropagation();
      const id = b.getAttribute('data-del');
      state.lists = state.lists.filter(l=>l.id!==id);
      persist();
      render();
    });
    $('#nav-summary') && ($('#nav-summary').onclick = () => { state.screen='summary'; render(); });
  }

  if(state.screen === 'list'){
    $('#btn-back').onclick = () => { state.screen='home'; state.activeList=null; render(); };
    $('#date-input').onchange = (e) => { state.activeList.date = e.target.value; };
    $('#list-name-input').oninput = (e) => { state.activeList.name = e.target.value; };
    $('#list-market-input').oninput = (e) => { state.activeList.market = e.target.value; };
    $('#meta-input').oninput = (e) => { state.activeList.meta = e.target.value; updateMetaBarUI(); };
    $('#f-name').oninput = (e)=> state.form.name = e.target.value;
    $('#f-cat').onchange = (e)=> state.form.category = e.target.value;
    $('#f-qty').oninput = (e)=> state.form.qty = e.target.value;
    $('#f-price').oninput = (e)=> state.form.unitPrice = e.target.value;
    $$('[data-prio]').forEach(b=> b.onclick = () => {
      state.form.priority = b.getAttribute('data-prio');
      render();
    });
    $('#btn-photo').onclick = () => $('#label-photo-input').click();
    $('#label-photo-input').onchange = (e) => {
      const file = e.target.files[0];
      if(file) handleLabelPhoto(file);
      e.target.value = '';
    };
    $('#btn-add').onclick = () => {
      const f = state.form;
      if(!f.name.trim() || !f.unitPrice) return;
      state.activeList.items.push({
        id: uid('i'), name: f.name.trim(), category: f.category,
        qty: Number(f.qty)||1, unitPrice: Number(f.unitPrice)||0, bought:false,
        priority: f.priority || 'normal'
      });
      state.form = { name:'', category:f.category, qty:'1', unitPrice:'', priority:f.priority||'normal' };
      render();
    };
    $$('[data-toggle]').forEach(b=> b.onclick = () => {
      const id = b.getAttribute('data-toggle');
      const it = state.activeList.items.find(i=>i.id===id);
      it.bought = !it.bought;
      render();
    });
    $$('[data-remove]').forEach(b=> b.onclick = () => {
      const id = b.getAttribute('data-remove');
      state.activeList.items = state.activeList.items.filter(i=>i.id!==id);
      render();
    });
    $('#btn-save').onclick = () => {
      const exists = state.lists.some(l=>l.id===state.activeList.id);
      state.lists = exists ? state.lists.map(l=> l.id===state.activeList.id ? state.activeList : l) : [...state.lists, state.activeList];
      persist();
      state.screen='home';
      state.activeList=null;
      render();
    };
  }

  if(state.screen === 'summary'){
    $('#btn-back').onclick = () => { state.screen='home'; render(); };
    $('#nav-home') && ($('#nav-home').onclick = () => { state.screen='home'; render(); });
  }
}

function createNewList(items){
  state.activeList = {
    id: uid('l'),
    date: new Date().toISOString().slice(0,10),
    name: '',
    market: '',
    meta: '',
    items: items,
  };
  state.form = { name:'', category:'mercearia', qty:'1', unitPrice:'', priority:'normal' };
  state.screen = 'list';
  render();
}

/* ---------- leitura de etiqueta (OCR no navegador, via Tesseract.js) ---------- */
function ensureTesseract(cb){
  if(window.Tesseract){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload = cb;
  s.onerror = () => {
    state.ocrStatus = null;
    render();
    alert('Não consegui carregar o leitor de etiqueta agora. Ele precisa de internet na primeira vez que é usado. Tente digitar manualmente.');
  };
  document.head.appendChild(s);
}

function parseLabelText(text){
  const priceMatches = text.match(/\d{1,4}[.,]\d{2}/g) || [];
  let priceValue = '';
  if(priceMatches.length){
    const nums = priceMatches.map(p => parseFloat(p.replace(',', '.')));
    priceValue = String(Math.max(...nums));
  }
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let nameLine = lines.find(l => /[a-zA-ZÀ-ÿ]{3,}/.test(l)) || '';
  nameLine = nameLine.replace(/R\$\s*[\d.,]+/g, '').replace(/[\d.,]{4,}/g,'').trim();
  state.form.name = nameLine.slice(0, 40);
  if(priceValue) state.form.unitPrice = priceValue;
}

function handleLabelPhoto(file){
  state.ocrStatus = 'Lendo etiqueta... (precisa de internet)';
  render();
  ensureTesseract(async () => {
    try{
      const result = await Tesseract.recognize(file, 'por');
      parseLabelText(result.data.text || '');
    }catch(e){
      alert('Não consegui ler essa etiqueta. Tenta digitar manualmente.');
    }
    state.ocrStatus = null;
    render();
  });
}

/* ---------- new-list modal ---------- */
document.getElementById('newlist-overlay').addEventListener('click', (e)=>{
  const mode = e.target.closest('[data-newlist]');
  if(!mode) return;
  const value = mode.getAttribute('data-newlist');
  document.getElementById('newlist-overlay').classList.remove('show');
  const sorted = [...state.lists].sort((a,b)=> a.date < b.date ? 1 : -1);
  const last = sorted[0];
  if(value === 'empty' || !last){
    createNewList([]);
  } else if(value === 'all'){
    const copied = last.items.map(it => ({...it, id: uid('i'), bought:false}));
    createNewList(copied);
  } else if(value === 'pending'){
    const copied = last.items.filter(it=>!it.bought).map(it => ({...it, id: uid('i'), bought:false}));
    createNewList(copied);
  }
});

/* ---------- calculator (independent of list state) ---------- */
const calcKeys = ['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','='];
const calcGrid = document.getElementById('calc-grid');
calcGrid.innerHTML = calcKeys.map(k=>{
  let cls = 'calc-btn';
  if(['÷','×','-','+'].includes(k)) cls += ' op';
  if(k==='=') cls += ' eq';
  if(k==='C') cls += ' clear';
  const style = k==='0' ? 'grid-column: span 2;' : '';
  return `<button class="${cls}" style="${style}" data-key="${k}">${k}</button>`;
}).join('');

let calcExpr = '';
const calcDisplay = document.getElementById('calc-display');
function calcRefresh(){ calcDisplay.textContent = calcExpr === '' ? '0' : calcExpr; }
function calcPress(k){
  if(k === 'C'){ calcExpr = ''; calcRefresh(); return; }
  if(k === '⌫'){ calcExpr = calcExpr.slice(0,-1); calcRefresh(); return; }
  if(k === '='){
    try{
      const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100');
      if(!/^[0-9+\-*/.() ]+$/.test(safe)) return;
      const result = Function('"use strict"; return (' + safe + ')')();
      calcExpr = String(Math.round((result + Number.EPSILON) * 100) / 100);
    }catch(e){ calcExpr = 'Erro'; }
    calcRefresh();
    return;
  }
  calcExpr += k;
  calcRefresh();
}
calcGrid.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-key]');
  if(!btn) return;
  calcPress(btn.getAttribute('data-key'));
});
document.getElementById('calc-fab').onclick = () => {
  document.getElementById('calc-overlay').classList.add('show');
};
document.getElementById('calc-close').onclick = () => {
  document.getElementById('calc-overlay').classList.remove('show');
};

render();
pullFromCloud();
</script>
