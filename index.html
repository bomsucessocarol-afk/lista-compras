<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Lista de Compras</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Lista de Compras" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#383772" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#383772;
    --navy-2:#4A4990;
    --yellow:#FBAD09;
    --lightblue:#A6C0E4;
    --gray:#7E7A68;
    --bg:#F4F5F9;
    --ink:#1B1A33;
    --red:#C0392B;
    --red-bg:#FDE8E8;
    --green:#2E7D32;
    --green-bg:#E9F2E9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",'Segoe UI',Roboto,Arial,sans-serif;color:var(--navy);line-height:1.4;}
  #app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
  input,select,textarea{font-family:inherit;}

  /* header */
  .header{background:var(--navy);padding:calc(env(safe-area-inset-top) + 26px) 20px 34px;border-radius:0 0 26px 26px;color:#fff;position:relative;}
  .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--lightblue);margin:0;}
  .h1{font-size:27px;font-weight:800;margin:2px 0 0;}
  .sub{font-size:13px;color:var(--lightblue);margin:4px 0 0;}
  .sync-badge{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600;background:rgba(255,255,255,.14);}
  .sync-badge.ok{color:#B9F0C4;}
  .sync-badge.syncing{color:var(--yellow);}
  .sync-badge.off{color:#F0B9B9;}
  .lh-row{display:flex;align-items:center;gap:8px;}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(255,255,255,.12);flex-shrink:0;}
  .icon-btn.back{font-size:28px;line-height:1;}
  .lh-title{flex:1;min-width:0;cursor:pointer;}
  .lh-name{margin:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lh-name .pen{font-size:13px;opacity:.8;}
  .lh-sub{margin:1px 0 0;font-size:12px;color:var(--lightblue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* layout */
  .section{padding:0 16px;margin-top:14px;}
  .section.overlap{margin-top:-22px;position:relative;z-index:2;}
  .section-title{font-size:15px;font-weight:800;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .section-title small{font-size:12px;font-weight:600;color:var(--gray);}
  .card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(27,26,51,.06);}
  .cta{width:100%;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;background:var(--yellow);color:var(--navy);box-shadow:0 6px 16px rgba(251,173,9,.35);}
  .cta:active,.chip:active,.chk:active{transform:scale(.97);}
  .ghost-btn{width:100%;padding:13px;border-radius:14px;background:var(--bg);color:var(--gray);font-weight:700;font-size:15px;margin-top:10px;}
  .danger-btn{width:100%;padding:13px;border-radius:14px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:15px;margin-top:10px;}
  .link-btn{font-size:13px;font-weight:700;color:var(--navy-2);text-decoration:underline;margin-top:10px;}
  .empty{text-align:center;padding:34px 16px;border-radius:18px;background:#fff;border:1.5px dashed var(--lightblue);color:var(--gray);font-size:14px;}
  .bar-track{height:8px;border-radius:99px;background:#ECEDF3;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:99px;background:var(--yellow);transition:width .3s;}

  /* home */
  .open-card{display:block;margin-bottom:12px;cursor:pointer;border:2px solid var(--yellow);}
  .oc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .oc-title{margin:0;font-size:16px;font-weight:800;}
  .oc-sub{margin:2px 0 0;font-size:12px;color:var(--gray);}
  .pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#FFF3D6;color:#9A6A00;white-space:nowrap;}
  .oc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--gray);}
  .oc-foot b{font-size:17px;color:var(--navy);}
  .hist-card{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px 14px;cursor:pointer;}
  .hist-main{flex:1;min-width:0;}
  .hist-title{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-sub{margin:1px 0 0;font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-total{font-weight:800;font-size:15px;white-space:nowrap;}
  .hist-del{width:32px;height:32px;border-radius:10px;color:var(--gray);font-size:14px;flex-shrink:0;}
  .more-btn{width:100%;padding:12px;font-size:13px;font-weight:700;color:var(--navy-2);}

  /* list screen */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-label{font-size:11px;font-weight:600;color:var(--gray);margin:0;}
  .stat-big{font-size:21px;font-weight:800;margin:1px 0 0;}
  .progress-line{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;font-weight:700;color:var(--gray);}
  .meta-line{margin-top:10px;font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;background:var(--green-bg);color:var(--green);}
  .meta-line.over{background:var(--red-bg);color:var(--red);}
  .hint{margin-top:8px;font-size:12px;color:#9A6A00;font-weight:600;}
  .done-banner{background:var(--green-bg);color:var(--green);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .done-banner button{font-weight:800;text-decoration:underline;}

  .quick-row{display:flex;gap:8px;}
  .quick-input{flex:1;min-width:0;font-size:16px;border-radius:12px;padding:13px 14px;background:var(--bg);border:2px solid transparent;color:var(--ink);outline:none;}
  .quick-input:focus{border-color:var(--lightblue);background:#fff;}
  .quick-add{width:50px;border-radius:12px;background:var(--navy);color:#fff;font-size:26px;font-weight:700;flex-shrink:0;}
  .quick-tools{display:flex;gap:8px;margin-top:8px;}
  .quick-tools button{flex:1;padding:10px 6px;border-radius:12px;background:#EEF3FB;font-size:13px;font-weight:700;color:var(--navy);}
  .sugg-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .sugg-title + .chips{margin-top:0;}
  .chip{padding:8px 11px;border-radius:999px;background:#fff;border:1.5px solid #DCE4F2;font-size:13px;font-weight:600;color:var(--navy);}
  .chip small{color:var(--gray);font-weight:600;}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip.sel small{color:var(--lightblue);}

  .group{padding:10px 14px 4px;margin-bottom:10px;}
  .cat-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin:2px 0 2px;display:flex;align-items:center;gap:6px;width:100%;text-align:left;}
  .cat-title span{font-size:11px;background:var(--bg);color:var(--gray);padding:1px 7px;border-radius:99px;}
  .cat-title em{margin-left:auto;font-style:normal;color:var(--gray);font-size:14px;}
  .item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F1F6;}
  .cat-title + .item-row{border-top:none;}
  .item-row.bought{opacity:.5;}
  .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--lightblue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:800;color:var(--navy);}
  .chk.on{background:var(--yellow);border-color:var(--yellow);}
  .item-main{flex:1;min-width:0;cursor:pointer;}
  .item-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
  .item-row.bought .item-name{text-decoration:line-through;}
  .item-detail{font-size:12px;color:var(--gray);margin-top:1px;}
  .item-sub{font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;cursor:pointer;}
  .price-add{font-size:12px;font-weight:800;color:#9A6A00;background:#FFF3D6;padding:6px 9px;border-radius:9px;white-space:nowrap;}
  .prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .prio-dot.alta{background:#E74C3C;}
  .prio-dot.baixa{background:#43A047;}
  .all-done{text-align:center;padding:16px;font-weight:800;color:var(--green);}
  .cart-toggle{padding:4px 0 8px;}
  .bottom-actions{margin-top:18px;}

  /* summary */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .stat-card.wide{grid-column:span 2;}
  .stat-value{font-size:19px;font-weight:800;margin:2px 0 0;}
  .chart-wrap{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .chart-val{font-size:9px;color:var(--gray);font-weight:700;}
  .chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--yellow);min-height:3px;}
  .chart-bar.cur{background:var(--navy);}
  .chart-lbl{font-size:10px;color:var(--gray);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .rank-num{width:24px;height:24px;border-radius:50%;background:var(--lightblue);color:var(--navy);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-count{font-size:12px;font-weight:700;color:var(--gray);}
  .yoy-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .yoy-col{flex:1;text-align:center;}
  .yoy-arrow{font-size:18px;color:var(--lightblue);font-weight:700;}
  .yoy-badge{margin-top:14px;text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:12px;}
  .yoy-badge.up{background:var(--red-bg);color:var(--red);}
  .yoy-badge.down{background:var(--green-bg);color:var(--green);}
  .yoy-badge.flat{background:var(--bg);color:var(--gray);}

  /* bottom nav */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:10;}
  .bottomnav-inner{max-width:440px;width:100%;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.07);border-radius:20px 20px 0 0;display:flex;padding:10px 24px calc(env(safe-area-inset-bottom) + 10px);}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--gray);}
  .nav-btn.active{color:var(--navy);}
  .nav-icon{font-size:20px;}

  /* overlays / sheets */
  .overlay{position:fixed;inset:0;background:rgba(20,20,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .overlay-box{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:92vh;overflow-y:auto;animation:up .2s ease-out;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-handle{width:40px;height:5px;border-radius:99px;background:#DADCE6;margin:0 auto 12px;}
  .overlay-title{font-size:18px;font-weight:800;margin:0 0 4px;}
  .overlay-sub{font-size:13px;color:var(--gray);margin:0 0 14px;}
  .form-label{font-size:12px;font-weight:700;color:var(--gray);margin:14px 0 6px;display:block;}
  .text-input{width:100%;font-size:16px;border-radius:12px;padding:12px 13px;background:var(--bg);border:2px solid transparent;color:var(--ink);outline:none;}
  .text-input:focus{border-color:var(--lightblue);background:#fff;}
  .big-price{font-size:26px;font-weight:800;text-align:center;padding:16px;}
  .qty-row{display:flex;gap:8px;align-items:center;}
  .qty-row .text-input{text-align:center;font-weight:800;font-size:18px;}
  .step{width:52px;height:50px;border-radius:12px;background:#EEF3FB;font-size:24px;font-weight:800;color:var(--navy);flex-shrink:0;}
  .sub-preview{font-size:13px;font-weight:700;color:var(--navy-2);margin:6px 0 0;min-height:18px;}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .cat-grid .chip{border-radius:12px;padding:9px 4px;font-size:12px;text-align:center;}
  .prio-row{display:flex;gap:6px;}
  .prio-row .chip{flex:1;border-radius:12px;text-align:center;}
  .ocr-box{background:#EEF3FB;border-radius:14px;padding:10px 12px 12px;margin-bottom:6px;}
  .ocr-box .form-label{margin-top:4px;}
  .ocr-box p{margin:0;font-size:12px;color:var(--navy-2);}
  .sheet-actions{margin-top:18px;}
  .modal-btn{width:100%;border-radius:14px;padding:14px 15px;font-weight:700;margin-bottom:10px;background:var(--bg);color:var(--navy);text-align:left;display:block;}
  .modal-btn b{display:block;font-size:14px;}
  .modal-btn span{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-top:2px;}

  .calc-display{background:var(--bg);border-radius:14px;padding:18px 16px;text-align:right;font-family:'Courier New',monospace;font-size:32px;font-weight:700;color:var(--navy);margin-bottom:14px;overflow-x:auto;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .calc-btn{background:var(--bg);border-radius:14px;padding:17px 0;font-size:19px;font-weight:700;color:var(--navy);text-align:center;}
  .calc-btn.op{background:var(--lightblue);}
  .calc-btn.eq{background:var(--yellow);}
  .calc-btn.clear{background:var(--red-bg);color:var(--red);}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;z-index:60;transition:all .2s;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast button{color:var(--yellow);font-weight:800;white-space:nowrap;}
</style>
</head>
<body>
<div id="app"></div>

<div id="sheet" class="overlay"><div class="overlay-box" id="sheet-box"></div></div>

<div id="newlist-overlay" class="overlay">
  <div class="overlay-box">
    <div class="sheet-handle"></div>
    <p class="overlay-title">Nova lista</p>
    <p class="overlay-sub">Quer aproveitar os itens da última lista?</p>
    <button class="modal-btn" data-act="newlist" data-mode="all"><b>🔁 Repetir todos os itens</b><span>Copia tudo, desmarcado, pra comprar de novo</span></button>
    <button class="modal-btn" data-act="newlist" data-mode="pending"><b>📝 Repetir só o que faltou</b><span>Só os itens que ficaram sem comprar</span></button>
    <button class="modal-btn" data-act="newlist" data-mode="empty"><b>✨ Começar do zero</b><span>Lista em branco</span></button>
    <button class="ghost-btn" data-act="close-overlays">Cancelar</button>
  </div>
</div>

<div id="calc-overlay" class="overlay">
  <div class="overlay-box">
    <div class="sheet-handle"></div>
    <p class="overlay-title">Calculadora</p>
    <p class="overlay-sub">Só pra conferir contas — não mexe na sua lista.</p>
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-grid" id="calc-grid"></div>
    <button class="ghost-btn" data-act="close-overlays">Fechar</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<input type="file" id="photo-input" accept="image/*" capture="environment" hidden />

  limpeza:['sabao','detergente','amaciante','agua sanitaria','desinfetante','esponja','vassoura','rodo','saco de lixo','lixo','multiuso','alcool','limpador','cloro','lustra','pano de chao','pano','inseticida','lava roupa','tira manchas','palha de aco','bombril'],
  higiene:['shampoo','xampu','condicionador','sabonete','pasta de dente','creme dental','escova de dente','escova','desodorante','papel higienico','absorvente','fralda','lenco','cotonete','fio dental','hidratante','protetor solar','barbeador','aparelho de barbear','enxaguante'],
};
const CAT_LOOKUP = Object.entries(CAT_WORDS)
  .flatMap(([cat, words]) => words.map(w => [w, cat]))
  .sort((a,b) => b[0].length - a[0].length);

/* =========================================================
   AJUDANTES
   ========================================================= */
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ymKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtQty(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function parseDate(d){ return new Date((d||todayStr())+"T12:00:00"); }
function fmtDate(d){ return parseDate(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace(/\./g,''); }
function fmtDateShort(d){ const x = parseDate(d); return `${pad(x.getDate())}/${pad(x.getMonth()+1)}`; }
function monthLabel(key){ const [y,m] = key.split("-"); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); }
function uid(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function cap(s){ s = String(s||'').trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
function parseNum(s){
  if(s === null || s === undefined) return null;
  if(typeof s === 'number') return isNaN(s) ? null : s;
  s = String(s).replace(/R\$/i,'').replace(/\s/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function numToInput(n){ return (n === null || n === undefined || n === '') ? '' : String(n).replace('.',','); }
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const round3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
function catById(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }
function guessCategory(name){
  const n = ' ' + norm(name) + ' ';
  for(const [w, cat] of CAT_LOOKUP){ if(n.includes(' '+w)) return cat; }
  return 'mercearia';
}
function unitStep(u){ return (u==='kg'||u==='L') ? 0.5 : (u==='g'||u==='ml') ? 100 : 1; }

/* "2 kg frango", "frango 2kg", "3x leite", "leite 3" */
const UNIT_RE = '(kg|g|gr|l|lt|litros?|ml|un|und|unid|unidades?|pct|pcte|pacotes?|cx|caixas?|dz|duzias?|x)';
function mapUnit(u){
  if(!u) return null;
  u = norm(u);
  if(u==='x') return null;
  if(u==='kg') return 'kg';
  if(u==='g'||u==='gr') return 'g';
  if(u==='l'||u==='lt'||u.startsWith('litro')) return 'L';
  if(u==='ml') return 'ml';
  if(u.startsWith('pc')||u.startsWith('pacote')) return 'pct';
  if(u==='cx'||u.startsWith('caixa')) return 'cx';
  if(u==='dz'||u.startsWith('duzia')) return 'dz';
  return 'un';
}
function parseQuick(text){
  const t = String(text||'').trim();
  let m = t.match(new RegExp('^(\\d+(?:[.,]\\d+)?)\\s*'+UNIT_RE+'?\\s+(.+)$','i'));
  if(m) return { qty: parseNum(m[1]), unit: mapUnit(m[2]), name: m[3].replace(/^de\s+/i,'').trim() };
  m = t.match(new RegExp('^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*'+UNIT_RE+'?$','i'));
  if(m) return { qty: parseNum(m[2]), unit: mapUnit(m[3]), name: m[1].trim() };
  m = t.match(/^(.+?)\s+x\s*(\d+(?:[.,]\d+)?)$/i);
  if(m) return { qty: parseNum(m[2]), unit: null, name: m[1].trim() };
  m = t.match(/^x\s*(\d+)\s+(.+)$/i);
  if(m) return { qty: Number(m[1]), unit: null, name: m[2].trim() };
  return { qty: null, unit: null, name: t };
}

/* =========================================================
   DADOS: normalização, armazenamento local
   ========================================================= */
function byRecent(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.updatedAt||0) - (a.updatedAt||0); }

function normalizeLists(raw){
  const arr = Array.isArray(raw) ? raw : [];
  const lists = arr.filter(l => l && l.id).map(l => ({
    id: String(l.id),
    date: /^\d{4}-\d{2}-\d{2}$/.test(l.date||'') ? l.date : todayStr(),
    name: l.name || '',
    market: l.market || '',
    meta: (l.meta === undefined || l.meta === null) ? '' : l.meta,
    status: l.status === 'open' || l.status === 'done' ? l.status : null,
    updatedAt: Number(l.updatedAt) || 0,
    deleted: !!l.deleted,
    items: (Array.isArray(l.items) ? l.items : []).filter(Boolean).map(it => {
      const price = (it.unitPrice === null || it.unitPrice === undefined || it.unitPrice === '') ? null : parseNum(it.unitPrice);
      return {
        id: String(it.id || uid('i')),
        name: String(it.name || '').trim() || 'Item',
        category: CATEGORIES.some(c=>c.id===it.category) ? it.category : 'outros',
        qty: Number(it.qty) > 0 ? Number(it.qty) : 1,
        unit: UNITS.includes(it.unit) ? it.unit : 'un',
        unitPrice: price,
        bought: !!it.bought,
        priority: PRIO_ORDER[it.priority] !== undefined ? it.priority : 'normal',
      };
    }),
  }));
  // Listas antigas (sem status): só a mais recente com itens pendentes fica "em andamento"
  const noStatus = lists.filter(l => !l.status).sort(byRecent);
  noStatus.forEach((l, i) => { l.status = (i === 0 && !l.deleted && l.items.some(it => !it.bought)) ? 'open' : 'done'; });
  return lists;
}

function loadLocal(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_LISTS); }catch(e){}
  try{
    if(raw && !localStorage.getItem(LS_LOCAL_BACKUP)) localStorage.setItem(LS_LOCAL_BACKUP, raw);
  }catch(e){}
  try{ return JSON.parse(raw || '[]'); }catch(e){ return []; }
}
function saveLocal(){ try{ localStorage.setItem(LS_LISTS, JSON.stringify(state.lists)); }catch(e){} }
function isDirty(){ try{ return localStorage.getItem(LS_DIRTY) === '1'; }catch(e){ return false; } }
function setDirty(v){ try{ localStorage.setItem(LS_DIRTY, v ? '1' : '0'); }catch(e){} }

const active = () => getList(state.activeId);
const itemSub = it => it.unitPrice === null ? null : (Number(it.qty)||0) * it.unitPrice;
const listEstimated = l => l.items.reduce((s,it) => s + (itemSub(it)||0), 0);
const listCart = l => l.items.filter(i=>i.bought).reduce((s,it) => s + (itemSub(it)||0), 0);
const listSpent = l => l.items.some(i=>i.bought) ? listCart(l) : listEstimated(l);
const listTitle = l => l.name || ('Lista de ' + fmtDateShort(l.date));

/* toda alteração passa por aqui: salva no celular e agenda envio pra nuvem */
let pushTimer = null;
function touch(list){
  if(list) list.updatedAt = Date.now();
  editCount++;
  setDirty(true);
  saveLocal();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncNow, 1200);
}

/* =========================================================
   SINCRONIZAÇÃO (mescla por lista — um celular não apaga o outro)
   ========================================================= */
function mergeLists(local, cloud){
  const m = new Map();
  cloud.forEach(l => m.set(l.id, l));
  local.forEach(l => {
    const c = m.get(l.id);
    if(!c || (l.updatedAt||0) > (c.updatedAt||0)) m.set(l.id, l);
  });
  const cutoff = Date.now() - 30*864e5; // lixeira some depois de 30 dias
  return [...m.values()].filter(l => !(l.deleted && (l.updatedAt||0) < cutoff));
}
const sig = lists => JSON.stringify(lists.slice().sort((a,b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0));

async function ensureCloudBackup(client, cloudRaw){
  try{ if(localStorage.getItem(LS_CLOUD_BACKUP_DONE)) return; }catch(e){ return; }
  try{
    if(Array.isArray(cloudRaw) && cloudRaw.length){
      const { data, error } = await client.from(TABLE).select('chave').eq('chave', CLOUD_BACKUP_KEY).maybeSingle();
      if(error) throw error;
      if(!data){
        const r = await client.from(TABLE).insert({ chave: CLOUD_BACKUP_KEY, dados: cloudRaw, updated_at: new Date().toISOString() });
        if(r.error) throw r.error;
      }
    }
    localStorage.setItem(LS_CLOUD_BACKUP_DONE, '1');
  }catch(e){ console.warn('Backup na nuvem não foi feito:', e); }
}

let syncing = false, syncAgain = false;
async function syncNow(){
  const client = getSb();
  if(!client || !navigator.onLine && navigator.onLine !== undefined){ setSync('off'); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  setSync('syncing');
  const startEdits = editCount;
  try{
    const { data, error } = await client.from(TABLE).select('dados').eq('chave', CLOUD_KEY).maybeSingle();
    if(error) throw error;
    const cloudRaw = data ? data.dados : null;
    await ensureCloudBackup(client, cloudRaw);
    const cloud = normalizeLists(cloudRaw);
    const merged = mergeLists(state.lists, cloud);
    if(sig(merged) !== sig(Array.isArray(cloudRaw) ? cloudRaw : []) || isDirty()){
      const r = await client.from(TABLE).upsert({ chave: CLOUD_KEY, dados: merged, updated_at: new Date().toISOString() });
      if(r.error) throw r.error;
    }
    const before = sig(state.lists);
    state.lists = mergeLists(state.lists, merged); // não perde o que foi digitado durante o envio
    saveLocal();
    if(editCount === startEdits) setDirty(false); else syncAgain = true;
    setSync('ok');
    if(sig(state.lists) !== before) safeRender();
  }catch(e){
    console.warn('Sync falhou:', e);
    setSync('off');
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; setTimeout(syncNow, 300); }
  }
}

function syncBadgeHtml(){
  const s = state.sync;
  const txt = s === 'ok' ? '☁️ Sincronizado' : s === 'syncing' ? '🔄 Sincronizando…' : (isDirty() ? '📴 Offline · salvo no celular' : '📴 Offline');
  return `<div class="sync-badge ${s}" id="sync-badge">${txt}</div>`;
}
function setSync(s){
  state.sync = s;
  const el = document.getElementById('sync-badge');
  if(el) el.outerHTML = syncBadgeHtml();
}

/* =========================================================
   HISTÓRICO DE PRODUTOS (para sugestões)
   ========================================================= */
function buildHistory(){
  const map = new Map();
  const lists = liveLists().slice().sort((a,b) => -byRecent(a,b)); // da mais antiga pra mais nova
  for(const l of lists){
    const seen = new Set();
    for(const it of l.items){
      const k = norm(it.name); if(!k) continue;
      let h = map.get(k);
      if(!h){ h = { key:k, count:0, unitPrice:null }; map.set(k, h); }
      h.name = it.name; h.category = it.category; h.unit = it.unit; h.priority = it.priority;
      if(it.unitPrice !== null) h.unitPrice = it.unitPrice;
      if(!seen.has(k)){ h.count++; seen.add(k); }
    }
  }
  return map;
}

let pendingRender = false;
function isTyping(){
  const a = document.activeElement;
  return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
function safeRender(){
  if(isTyping() || state.sheet){ pendingRender = true; return; }
  pendingRender = false;
  render();
}
document.addEventListener('focusout', () => setTimeout(() => { if(pendingRender && !isTyping() && !state.sheet) safeRender(); }, 250));

function render(){
  if(state.screen === 'list' && (!active() || active().deleted)){ state.screen = 'home'; state.activeId = null; }
  const app = document.getElementById('app');
  if(state.screen === 'home') app.innerHTML = renderHome();
  else if(state.screen === 'list'){ app.innerHTML = renderList(); renderStats(); renderSugg(); renderItems(); }
  else app.innerHTML = renderSummary();
}

function renderSugg(){
  const box = document.getElementById('sugg-box'); const l = active();
  if(!box || !l) return;
  const hist = buildHistory();
  const inList = new Set(l.items.filter(i=>!i.bought).map(i => norm(i.name)));
  const q = norm(parseQuick(state.quick).name);
  let items, title = '';
  if(q){
    items = [...hist.values()].filter(h => h.key.includes(q) && !inList.has(h.key))
      .sort((a,b) => (b.key.startsWith(q) - a.key.startsWith(q)) || b.count - a.count).slice(0, 6);
  }else{
    items = [...hist.values()].filter(h => !inList.has(h.key)).sort((a,b) => b.count - a.count).slice(0, 10);
    title = 'Toque pra adicionar · você costuma comprar';
  }
  if(!items.length){ box.innerHTML = ''; return; }
  box.innerHTML = `${title ? `<p class="sugg-title">${title}</p>` : ''}<div class="chips">${items.map(h =>
    `<button class="chip keep-focus" data-act="sugg" data-key="${esc(h.key)}">+ ${esc(h.name)}${h.unitPrice !== null ? ` <small>${brl(h.unitPrice)}</small>` : ''}</button>`).join('')}</div>`;
}

function sortPrio(a,b){ return (PRIO_ORDER[a.priority]??1) - (PRIO_ORDER[b.priority]??1) || a.name.localeCompare(b.name,'pt-BR'); }

function rowHtml(it){
  const sub = itemSub(it);

function renderItems(){

    return;
  }
  const pend = l.items.filter(i=>!i.bought), cart = l.items.filter(i=>i.bought);
  let html = CATEGORIES.map(c => ({...c, items: pend.filter(i => catById(i.category).id === c.id).sort(sortPrio)}))
    .filter(g => g.items.length)
    .map(g => `<div class="card group"><p class="cat-title">${g.emoji} ${g.label} <span>${g.items.length}</span></p>${g.items.map(rowHtml).join('')}</div>`).join('');
  if(!pend.length) html += `<div class="all-done">🎉 Tudo no carrinho!</div>`;
  if(cart.length){
    html += `<div class="card group">
      <button class="cat-title cart-toggle" data-act="toggle-cart">🛒 No carrinho <span>${cart.length}</span><em>${state.cartOpen ? '▾' : '▸'}</em></button>
      ${state.cartOpen ? cart.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(rowHtml).join('') : ''}
    </div>`;
  }
  if(l.status === 'open') html += `<div class="bottom-actions"><button class="cta" data-act="finish">✅ Concluir compra</button></div>`;
  box.innerHTML = html;
}
function refreshListParts(){ renderStats(); renderSugg(); renderItems(); }

/* ---------- Resumo ---------- */
function renderSummary(){
  const lists = liveLists();
  const now = new Date();
  const curKey = ymKey(now);
  const lastKey = ymKey(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const curYear = String(now.getFullYear());
  const sumMonth = key => lists.filter(l => l.date.slice(0,7) === key).reduce((s,l) => s + listSpent(l), 0);

  const curMonthTotal = sumMonth(curKey);
  const lastMonthTotal = sumMonth(lastKey);
  const yearTotal = lists.filter(l => l.date.slice(0,4) === curYear).reduce((s,l) => s + listSpent(l), 0);

  const lyKey = `${now.getFullYear()-1}-${pad(now.getMonth()+1)}`;
  const hasLastYear = lists.some(l => l.date.slice(0,7) === lyKey);
  const lyTotal = sumMonth(lyKey);
  const monthNamePt = now.toLocaleDateString('pt-BR', {month:'long'});
  const yoyPct = hasLastYear && lyTotal > 0 ? ((curMonthTotal - lyTotal) / lyTotal) * 100 : null;

  const months = [];
  for(let i=5; i>=0; i--){
    const key = ymKey(new Date(now.getFullYear(), now.getMonth()-i, 1));
    months.push({ key, label: monthLabel(key), total: sumMonth(key) });
  }
  const maxVal = Math.max(1, ...months.map(m => m.total));
  const chartHtml = months.map(m => `
    <div class="chart-col">
      ${m.total > 0 ? `<span class="chart-val">${Math.round(m.total)}</span>` : ''}
      <div class="chart-bar ${m.key===curKey?'cur':''}" style="height:${Math.max(3, (m.total/maxVal)*100)}px;"></div>
      <span class="chart-lbl">${m.label}</span>
    </div>`).join('');

  const topItems = [...buildHistory().values()].sort((a,b) => b.count - a.count).slice(0, 5);
  const rankHtml = topItems.map((it, idx) => `
    <div class="rank-row">
      <div class="rank-num">${idx+1}</div>
      <span class="rank-name">${esc(it.name)}</span>
      <span class="rank-count">em ${it.count} ${it.count===1?'lista':'listas'}</span>
    </div>`).join('');

  return `
    <div class="header">
      ${syncBadgeHtml()}
      <p class="eyebrow">Seus gastos</p>
      <h1 class="h1">Resumo</h1>
    </div>
    <div class="section overlap">
      <div class="stat-grid">
        <div class="stat-card"><p class="stat-label">Este mês</p><p class="stat-value">${brl(curMonthTotal)}</p></div>
        <div class="stat-card"><p class="stat-label">Mês passado</p><p class="stat-value">${brl(lastMonthTotal)}</p></div>
        <div class="stat-card wide"><p class="stat-label">Total em ${curYear}</p><p class="stat-value">${brl(yearTotal)}</p></div>
      </div>
    </div>
    <div class="section">
      <h2 class="section-title">Últimos 6 meses</h2>
      <div class="card">${lists.length === 0 ? `<p style="text-align:center;font-size:13px;color:var(--gray);">Sem dados suficientes ainda.</p>` : `<div class="chart-wrap">${chartHtml}</div>`}</div>
    </div>
    <div class="section">
      <h2 class="section-title">Comparado ao ano passado</h2>
      <div class="card">
        ${!hasLastYear ? `<p style="text-align:center;font-size:13px;color:var(--gray);margin:0">Ainda não há compras de ${monthNamePt} do ano passado pra comparar.</p>` : `
          <div class="yoy-row">
            <div class="yoy-col"><p class="stat-label">${monthNamePt}/${curYear}</p><p class="stat-value">${brl(curMonthTotal)}</p></div>
            <div class="yoy-arrow">→</div>
            <div class="yoy-col"><p class="stat-label">${monthNamePt}/${Number(curYear)-1}</p><p class="stat-value">${brl(lyTotal)}</p></div>
          </div>
          ${yoyPct !== null ? `<div class="yoy-badge ${yoyPct > 0 ? 'up' : (yoyPct < 0 ? 'down' : 'flat')}">${yoyPct > 0 ? '▲' : (yoyPct < 0 ? '▼' : '—')} ${Math.abs(yoyPct).toFixed(0)}% ${yoyPct > 0 ? 'a mais' : (yoyPct < 0 ? 'a menos' : 'igual')} que no ano passado</div>` : ''}`}
      </div>
    </div>
    <div class="section">
      <h2 class="section-title">Itens mais comprados</h2>
      <div class="card">${topItems.length === 0 ? `<p style="text-align:center;font-size:13px;color:var(--gray);margin:0">Nenhum produto registrado ainda.</p>` : rankHtml}</div>
    </div>
    ${bottomNav('summary')}`;
}

function buildItemFromName(name, qty, unit){
  const h = buildHistory().get(norm(name));
  return {
    id: uid('i'),
    name: h ? h.name : cap(name),
    category: h ? h.category : guessCategory(name),
    qty: qty > 0 ? qty : 1,
    unit: unit || (h ? h.unit : 'un'),
    unitPrice: h ? h.unitPrice : null,
    bought: false,
    priority: h ? (h.priority || 'normal') : 'normal',
  };
}
function addItemToActive(item, quiet){
  const l = active(); if(!l) return;
  const ex = l.items.find(i => !i.bought && norm(i.name) === norm(item.name) && i.unit === item.unit);
  if(ex){
    ex.qty = round3((Number(ex.qty)||0) + (Number(item.qty)||1));
    touch(l); refreshListParts();
    toast(`Somei ao "${ex.name}" (agora ${fmtQty(ex.qty)} ${ex.unit})`);
    return;
  }
  l.items.push(item);
  if(l.status !== 'open') l.status = 'open';
  touch(l); refreshListParts();
  if(!quiet) toast(`"${item.name}" adicionado`, 'Desfazer', () => removeItem(item.id, true), 3000);
}
function addQuick(){
  const raw = state.quick.trim(); if(!raw) return;
  const p = parseQuick(raw); if(!p.name) return;
  addItemToActive(buildItemFromName(p.name, p.qty, p.unit));
  state.quick = '';
  const inp = document.getElementById('quick-input');
  if(inp){ inp.value = ''; inp.focus(); }
  renderSugg();
}
function addFromHistory(key){
  const h = buildHistory().get(key); if(!h) return;
  const p = parseQuick(state.quick);
  const item = buildItemFromName(h.name, p.qty, p.unit);
  addItemToActive(item);
  if(state.quick){
    state.quick = '';
    const inp = document.getElementById('quick-input'); if(inp){ inp.value = ''; inp.focus(); }
    renderSugg();
  }
}
function removeItem(id, silent){
  const l = active(); if(!l) return;
  const idx = l.items.findIndex(i => i.id === id); if(idx < 0) return;
  const [it] = l.items.splice(idx, 1);
  touch(l); refreshListParts();
  if(!silent) toast(`"${it.name}" removido`, 'Desfazer', () => { l.items.splice(idx, 0, it); touch(l); refreshListParts(); });
}
function toggleItem(id){
  const l = active(); const it = l && l.items.find(i => i.id === id); if(!it) return;
  it.bought = !it.bought;
  touch(l); refreshListParts();
  if(it.bought && it.unitPrice === null) openPriceSheet(id, true);
}
function finishList(){
  const l = active(); if(!l) return;
  const left = l.items.filter(i=>!i.bought).length;
  l.status = 'done'; touch(l);
  state.screen = 'home'; state.activeId = null; render(); window.scrollTo(0,0);
  toast(left ? `Compra concluída 🎉 ${left} ${left>1?'itens ficaram':'item ficou'} de fora` : 'Compra concluída 🎉', null, null, 4000);
}

/* --- importar lista do papel (texto copiado da foto ou digitado) --- */
function parseImport(text){
  let lines = String(text||'').split(/\r?\n/);
  if(lines.filter(l => l.trim()).length === 1) lines = lines[0].split(/[,;]/);
  const out = [];
  lines.forEach(line => {
    let t = line.replace(/^\s*(?:[-–—•*·>+]|\[\s*[xX]?\s*\]|[☐☑✓✔□■●○]|\d{1,2}\s*[.)-](?=\s))\s*/, '').replace(/\s+/g,' ').trim();
    if((t.match(/[A-Za-zÀ-ÿ]/g) || []).length < 2) return;
    if(/^(lista( de compras)?|compras|mercado|feira|supermercado)\s*:?$/.test(norm(t))) return;
    const p = parseQuick(t);
    if(!p.name || (p.name.match(/[A-Za-zÀ-ÿ]/g) || []).length < 2) return;
    out.push(buildItemFromName(p.name, p.qty, p.unit));
  });
  return out;
}

/* =========================================================
   LEITURA DE ETIQUETA (foto → texto, no próprio celular)
   ========================================================= */
function loadTesseract(){
  return new Promise((res, rej) => {
    if(window.Tesseract) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function prepImage(file){
  let src;
  try{ src = await createImageBitmap(file); }
  catch(e){
    src = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
  }
  const w0 = src.width, h0 = src.height, big = Math.max(w0, h0);
  const s = big < 1000 ? 1000/big : Math.min(1, 1600/big);
  const w = Math.round(w0*s), h = Math.round(h0*s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data, hist = new Uint32Array(256);
  for(let i=0; i<d.length; i+=4){ const y = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0; d[i] = y; hist[y]++; }
  const total = w*h; let acc = 0, lo = 0, hi = 255;
  for(let v=0; v<256; v++){ acc += hist[v]; if(acc > total*0.02){ lo = v; break; } }
  acc = 0; for(let v=255; v>=0; v--){ acc += hist[v]; if(acc > total*0.02){ hi = v; break; } }
  const range = Math.max(1, hi - lo);
  for(let i=0; i<d.length; i+=4){ let y = (d[i]-lo)*255/range; y = y<0 ? 0 : y>255 ? 255 : y; d[i] = d[i+1] = d[i+2] = y; }
  ctx.putImageData(img, 0, 0);
  return c;
}
function extractPrices(text){
  const found = [];
  const t = text.replace(/[Oo](?=\d)/g,'0');
  let m;
  const re = /(R\s?\$\s*)?(\d{1,4})\s?[.,]\s?(\d{2})(?!\d)/g;
  while((m = re.exec(t))){ const v = parseFloat(m[2]+'.'+m[3]); if(v > 0 && v < 10000) found.push({ v, rs: !!m[1] }); }
  const re2 = /R\s?\$\s*(\d{1,3})\s+(\d{2})(?!\d)/g;   // "R$ 9 99" (centavos pequenos)
  while((m = re2.exec(t))){ found.push({ v: parseFloat(m[1]+'.'+m[2]), rs: true }); }
  const uniq = [];
  found.sort((a,b) => (b.rs - a.rs) || b.v - a.v).forEach(f => { if(!uniq.includes(f.v)) uniq.push(f.v); });
  return uniq.slice(0, 4);
}
function extractNames(text){
  const STOP = /\b(preco|precos|oferta|promocao|promo|codigo|cod|validade|ean|unitario|total|valido|ate|de:|por:|cada|leve|pague|r\$)\b/;
  const out = [];
  text.split('\n').forEach(line => {
    let l = line.replace(/R\s?\$\s*[\d.,\s]+/g,' ').replace(/\d{4,}/g,' ').replace(/[^A-Za-zÀ-ÿ0-9\s.,/-]/g,' ').replace(/\s+/g,' ').trim();
    const letters = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if(letters < 3 || letters / Math.max(1, l.length) < 0.55) return;
    if(STOP.test(norm(l)) && letters < 12) return;
    l = cap(l.toLowerCase()).slice(0, 40);
    if(!out.some(o => norm(o) === norm(l))) out.push(l);
  });
  return out.sort((a,b) => b.length - a.length).slice(0, 4);
}
async function handlePhoto(file){
  toast('📷 Lendo etiqueta… (precisa de internet)', null, null, 60000);
  try{
    await loadTesseract();
    const canvas = await prepImage(file);
    const res = await Tesseract.recognize(canvas, 'por');
    const text = (res && res.data && res.data.text) || '';
    const prices = extractPrices(text), names = extractNames(text);
    hideToast();
    const preset = { name: names[0] || '', qty: 1, unit: 'un', unitPrice: prices.length ? prices[0] : null, category: names[0] ? guessCategory(names[0]) : 'mercearia', priority: 'normal' };
    const h = names[0] && buildHistory().get(norm(names[0]));
    if(h){ preset.category = h.category; preset.unit = h.unit; preset.name = h.name; }
    openItemSheet(null, preset, { names, prices });
  }catch(e){
    console.warn(e);
    hideToast();
    toast('Não consegui ler a etiqueta agora. Tente com mais luz ou digite.', null, null, 4000);
  }
}

/* =========================================================
   AVISO (toast) com "Desfazer"
   ========================================================= */
let toastTimer = null, toastFn = null;
function toast(msg, label, fn, ms){
  const t = document.getElementById('toast');
  toastFn = fn || null;
  t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button data-act="toast-action">${esc(label)}</button>` : ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, ms || (label ? 5000 : 2500));
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); toastFn = null; }

/* =========================================================
   EVENTOS (um único ouvinte para a tela toda)
   ========================================================= */
document.addEventListener('mousedown', e => { if(e.target.closest('.keep-focus')) e.preventDefault(); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el){
    if(e.target.classList && e.target.classList.contains('overlay')) closeOverlays();
    return;
  }
  const act = el.dataset.act, id = el.dataset.id, val = el.dataset.val;
  const pick = () => el.parentElement.querySelectorAll(`[data-act="${act}"]`).forEach(x => x.classList.toggle('sel', x === el));
  const d = state.sheet && state.sheet.draft;

  switch(act){
    case 'nav-home': state.screen = 'home'; render(); window.scrollTo(0,0); break;
    case 'nav-summary': state.screen = 'summary'; render(); window.scrollTo(0,0); break;
    case 'open': openList(id); break;
    case 'back': goHome(); break;
    case 'new-list':
      if(liveLists().length) document.getElementById('newlist-overlay').classList.add('show');
      else createNewList([]);
      break;
    case 'newlist': {
      document.getElementById('newlist-overlay').classList.remove('show');
      const last = liveLists().sort(byRecent)[0];
      const mode = el.dataset.mode;
      if(mode === 'empty' || !last) createNewList([]);
      else createNewList(last.items.filter(it => mode === 'all' || !it.bought).map(it => ({ ...it, id: uid('i'), bought: false })));
      break;
    }
    case 'del-list': e.stopPropagation(); deleteList(id); break;
    case 'show-all-history': state.showAllHistory = true; render(); break;
    case 'list-settings': openListSheet(); break;
    case 'calc': document.getElementById('calc-overlay').classList.add('show'); break;
    case 'close-overlays': closeOverlays(); break;
    case 'quick-add': addQuick(); break;
    case 'sugg': addFromHistory(el.dataset.key); break;
    case 'photo': document.getElementById('photo-input').click(); break;
    case 'import': openImportSheet(); break;
    case 'imp-paste': {
      const ta = document.getElementById('d-imp');
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(t => {
          if(!t) { toast('Nada copiado ainda — copie o texto da foto primeiro.', null, null, 3500); return; }
          state.sheet.draft.text = (ta.value ? ta.value + '\n' : '') + t; ta.value = state.sheet.draft.text; updateImportPreview();
        }).catch(() => { ta.focus(); toast('Toque e segure na caixa abaixo e escolha "Colar".', null, null, 3500); });
      } else { ta.focus(); toast('Toque e segure na caixa abaixo e escolha "Colar".', null, null, 3500); }
      break;
    }
    case 'imp-toggle': {
      const i = Number(el.dataset.idx), off = state.sheet.off;
      off.has(i) ? off.delete(i) : off.add(i);
      updateImportPreview();
      break;
    }
    case 'imp-add': addImported(); break;
    case 'new-detailed': {
      const p = parseQuick(state.quick);
      const preset = p.name ? buildItemFromName(p.name, p.qty, p.unit) : null;
      state.quick = ''; const inp = document.getElementById('quick-input'); if(inp) inp.value = '';
      openItemSheet(null, preset);
      break;
    }
    case 'toggle': toggleItem(id); break;
    case 'edit': openItemSheet(id); break;
    case 'price': openPriceSheet(id, false); break;
    case 'toggle-cart': state.cartOpen = !state.cartOpen; renderItems(); break;
    case 'finish': finishList(); break;
    case 'reopen': { const l = active(); if(l){ l.status = 'open'; touch(l); render(); } break; }

    /* dentro das janelas */
    case 'sheet-close': closeSheet(); break;
    case 'unit-pick': {
      pick(); d.unit = val;
      const lbl = document.getElementById('unit-lbl'); if(lbl) lbl.textContent = val === 'un' ? 'de cada' : 'por '+val;
      break;
    }
    case 'cat-pick': pick(); d.category = val; break;
    case 'prio-pick': pick(); d.priority = val; break;
    case 'qty-inc': case 'qty-dec': {
      const step = unitStep(d.unit); let q = parseNum(d.qty) || 0;
      q = act === 'qty-inc' ? q + step : Math.max(step, q - step);
      d.qty = numToInput(round3(q)); document.getElementById('d-qty').value = d.qty; updatePreview();
      break;
    }
    case 'ocr-name': {
      pick(); d.name = val; document.getElementById('d-name').value = val;
      const h = buildHistory().get(norm(val));
      const cat = h ? h.category : guessCategory(val);
      d.category = cat;
      document.querySelectorAll('[data-act="cat-pick"]').forEach(x => x.classList.toggle('sel', x.dataset.val === cat));
      break;
    }
    case 'ocr-price': pick(); d.price = numToInput(Number(val)); document.getElementById('d-price').value = d.price; updatePreview(); break;
    case 'item-save': saveItemSheet(); break;
    case 'item-del': { const sid = state.sheet.id; closeSheet(); removeItem(sid); break; }
    case 'price-save': savePriceSheet(); break;
    case 'list-save': saveListSheet(); break;
    case 'list-delete': { const lid = state.activeId; closeSheet(); deleteList(lid); break; }
    case 'toast-action': { const fn = toastFn; hideToast(); if(fn) fn(); break; }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'quick-input'){ state.quick = t.value; renderSugg(); return; }
  if(t.dataset && t.dataset.draft && state.sheet){
    state.sheet.draft[t.dataset.draft] = t.value;
    t.style.borderColor = '';
    if(state.sheet.type === 'import'){ state.sheet.off.clear(); updateImportPreview(); }
    else updatePreview();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeOverlays(); return; }
  if(e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  if(e.target.id === 'quick-input'){ e.preventDefault(); addQuick(); return; }
  if(e.target.dataset && e.target.dataset.draft && state.sheet){
    e.preventDefault();
    if(state.sheet.type === 'price') savePriceSheet();
    else if(state.sheet.type === 'item') saveItemSheet();
    else if(state.sheet.type === 'list') saveListSheet();
  }
});
document.getElementById('photo-input').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file) handlePhoto(file);
});

/* =========================================================
   CALCULADORA (não mexe na lista)
   ========================================================= */
const calcKeys = ['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0',',','='];
const calcGrid = document.getElementById('calc-grid');
calcGrid.innerHTML = calcKeys.map(k => {
  let cls = 'calc-btn';
  if(['÷','×','-','+'].includes(k)) cls += ' op';
  if(k === '=') cls += ' eq';
  if(k === 'C') cls += ' clear';
  return `<button class="${cls}" style="${k==='0' ? 'grid-column:span 2;' : ''}" data-key="${k}">${k}</button>`;
}).join('');
let calcExpr = '';
const calcDisplay = document.getElementById('calc-display');
function calcRefresh(){ calcDisplay.textContent = calcExpr === '' ? '0' : calcExpr; }
calcGrid.addEventListener('click', e => {
  const btn = e.target.closest('[data-key]'); if(!btn) return;
  const k = btn.dataset.key;
  if(k === 'C'){ calcExpr = ''; }
  else if(k === '⌫'){ calcExpr = calcExpr.slice(0, -1); }
  else if(k === '='){
    try{
      const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100').replace(/,/g,'.');
      if(!/^[0-9+\-*/.() ]+$/.test(safe)) return;
      const result = Function('"use strict"; return (' + safe + ')')();
      calcExpr = String(round2(result)).replace('.', ',');
    }catch(err){ calcExpr = 'Erro'; }
  }
  else { if(calcExpr === 'Erro') calcExpr = ''; calcExpr += k; }
  calcRefresh();
});

window.addEventListener('offline', () => setSync('off'));

syncNow();

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
