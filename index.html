<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<script>
/* Celular abrindo como "versão para computador" (página larga e letra miúda):
   aumenta tudo pra caber certinho na largura real da tela. */
(function(){
  function fit(){
    var de = document.documentElement;
    de.style.zoom = '';
    var sw = window.screen ? window.screen.width : 0, sh = window.screen ? window.screen.height : 0;
    var touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    var real = Math.min(sw, sh) <= 600 ? (window.innerWidth > window.innerHeight ? Math.max(sw, sh) : Math.min(sw, sh)) : 0;
    var iw = window.innerWidth;
    if(touch && real && iw > real * 1.2){
      de.style.zoom = (iw / real).toFixed(3);
      de.classList.add('zoom-fix');
    } else de.classList.remove('zoom-fix');
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
})();
</script>
<title>Lista de Compras</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Lista de Compras" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#383772" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#383772;
    --navy-2:#4A4990;
    --yellow:#FBAD09;
    --lightblue:#A6C0E4;
    --gray:#7E7A68;
    --bg:#F4F5F9;
    --ink:#1B1A33;
    --red:#C0392B;
    --red-bg:#FDE8E8;
    --green:#2E7D32;
    --green-bg:#E9F2E9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",'Segoe UI',Roboto,Arial,sans-serif;color:var(--navy);line-height:1.4;}
  #app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
  input,select,textarea{font-family:inherit;}

  /* header */
  .header{background:var(--navy);padding:calc(env(safe-area-inset-top) + 26px) 20px 34px;border-radius:0 0 26px 26px;color:#fff;position:relative;}
  .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--lightblue);margin:0;}
  .h1{font-size:27px;font-weight:800;margin:2px 0 0;}
  .sub{font-size:13px;color:var(--lightblue);margin:4px 0 0;}
  .sync-badge{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600;background:rgba(255,255,255,.14);}
  .sync-badge.ok{color:#B9F0C4;}
  .sync-badge.syncing{color:var(--yellow);}
  .sync-badge.off{color:#F0B9B9;}
  .lh-row{display:flex;align-items:center;gap:8px;}
  .icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(255,255,255,.12);flex-shrink:0;}
  .icon-btn.back{font-size:28px;line-height:1;}
  .lh-title{flex:1;min-width:0;cursor:pointer;}
  .lh-name{margin:0;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lh-name .pen{font-size:13px;opacity:.8;}
  .lh-sub{margin:1px 0 0;font-size:12px;color:var(--lightblue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* layout */
  .section{padding:0 16px;margin-top:14px;}
  .section.overlap{margin-top:-22px;position:relative;z-index:2;}
  .section-title{font-size:15px;font-weight:800;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .section-title small{font-size:12px;font-weight:600;color:var(--gray);}
  .card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(27,26,51,.06);}
  .cta{width:100%;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px;background:var(--yellow);color:var(--navy);box-shadow:0 6px 16px rgba(251,173,9,.35);}
  .cta:active,.chip:active,.chk:active{transform:scale(.97);}
  .ghost-btn{width:100%;padding:13px;border-radius:14px;background:var(--bg);color:var(--gray);font-weight:700;font-size:15px;margin-top:10px;}
  .danger-btn{width:100%;padding:13px;border-radius:14px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:15px;margin-top:10px;}
  .link-btn{font-size:13px;font-weight:700;color:var(--navy-2);text-decoration:underline;margin-top:10px;}
  .empty{text-align:center;padding:34px 16px;border-radius:18px;background:#fff;border:1.5px dashed var(--lightblue);color:var(--gray);font-size:14px;}
  .bar-track{height:8px;border-radius:99px;background:#ECEDF3;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:99px;background:var(--yellow);transition:width .3s;}

  /* home */
  .open-card{display:block;margin-bottom:12px;cursor:pointer;border:2px solid var(--yellow);}
  .swipe-wrap.open-wrap{margin-bottom:12px;}
  .swipe-wrap.open-wrap .open-card{margin-bottom:0;}
  .oc-right{display:flex;align-items:center;gap:2px;margin-right:-8px;margin-top:-4px;}
  .oc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .oc-title{margin:0;font-size:16px;font-weight:800;}
  .oc-sub{margin:2px 0 0;font-size:12px;color:var(--gray);}
  .pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#FFF3D6;color:#9A6A00;white-space:nowrap;}
  .oc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--gray);}
  .oc-foot b{font-size:17px;color:var(--navy);}
  .hist-card{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px 14px;cursor:pointer;}
  .hist-main{flex:1;min-width:0;}
  .hist-title{margin:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-sub{margin:1px 0 0;font-size:12px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-total{font-weight:800;font-size:15px;white-space:nowrap;}
  .hist-del{width:32px;height:32px;border-radius:10px;color:var(--gray);font-size:14px;flex-shrink:0;}
  .more-btn{width:100%;padding:12px;font-size:13px;font-weight:700;color:var(--navy-2);}

  /* list screen */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-label{font-size:11px;font-weight:600;color:var(--gray);margin:0;}
  .stat-big{font-size:21px;font-weight:800;margin:1px 0 0;}
  .progress-line{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;font-weight:700;color:var(--gray);}
  .meta-line{margin-top:10px;font-size:13px;font-weight:700;padding:8px 10px;border-radius:10px;background:var(--green-bg);color:var(--green);}
  .meta-line.over{background:var(--red-bg);color:var(--red);}
  .hint{margin-top:8px;font-size:12px;color:#9A6A00;font-weight:600;}
  .done-banner{background:var(--green-bg);color:var(--green);border-radius:14px;padding:11px 14px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .done-banner button{font-weight:800;text-decoration:underline;}

  .quick-row{display:flex;gap:8px;}
  .quick-input{flex:1;min-width:0;font-size:16px;border-radius:12px;padding:13px 14px;background:var(--bg);border:2px solid transparent;color:var(--ink);outline:none;}
  .quick-input:focus{border-color:var(--lightblue);background:#fff;}
  .quick-add{width:50px;border-radius:12px;background:var(--navy);color:#fff;font-size:26px;font-weight:700;flex-shrink:0;}
  .quick-tools{display:flex;gap:8px;margin-top:8px;}
  .quick-tools button{flex:1;padding:10px 6px;border-radius:12px;background:#EEF3FB;font-size:13px;font-weight:700;color:var(--navy);}
  .sugg-title{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .sugg-title + .chips{margin-top:0;}
  .chip{padding:8px 11px;border-radius:999px;background:#fff;border:1.5px solid #DCE4F2;font-size:13px;font-weight:600;color:var(--navy);}
  .chip small{color:var(--gray);font-weight:600;}
  .chip.sel{background:var(--navy);border-color:var(--navy);color:#fff;}
  .chip.sel small{color:var(--lightblue);}

  .group{padding:10px 14px 4px;margin-bottom:10px;}
  .cat-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy);margin:2px 0 2px;display:flex;align-items:center;gap:6px;width:100%;text-align:left;}
  .cat-title span{font-size:11px;background:var(--bg);color:var(--gray);padding:1px 7px;border-radius:99px;}
  .cat-title em{margin-left:auto;font-style:normal;color:var(--gray);font-size:14px;}
  .item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F1F6;}
  .cat-title + .item-row,.group > .item-row:first-child{border-top:none;}
  .item-row.bought{opacity:.5;}
  .chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--lightblue);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:800;color:var(--navy);}
  .chk.on{background:var(--yellow);border-color:var(--yellow);}
  .item-main{flex:1;min-width:0;cursor:pointer;}
  .item-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
  .item-row.bought .item-name{text-decoration:line-through;}
  .item-detail{font-size:12px;color:var(--gray);margin-top:1px;}
  .item-sub{font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;cursor:pointer;}
  .price-add{font-size:12px;font-weight:800;color:#9A6A00;background:#FFF3D6;padding:6px 9px;border-radius:9px;white-space:nowrap;}
  .prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .prio-dot.alta{background:#E74C3C;}
  .prio-dot.baixa{background:#43A047;}
  .all-done{text-align:center;padding:16px;font-weight:800;color:var(--green);}
  .cart-toggle{padding:4px 0 8px;}
  .bottom-actions{margin-top:18px;}

  /* summary */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .stat-card.wide{grid-column:span 2;}
  .stat-value{font-size:19px;font-weight:800;margin:2px 0 0;}
  .chart-wrap{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .chart-val{font-size:9px;color:var(--gray);font-weight:700;}
  .chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--yellow);min-height:3px;}
  .chart-bar.cur{background:var(--navy);}
  .chart-lbl{font-size:10px;color:var(--gray);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .rank-num{width:24px;height:24px;border-radius:50%;background:var(--lightblue);color:var(--navy);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rank-name{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-count{font-size:12px;font-weight:700;color:var(--gray);}
  .yoy-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .yoy-col{flex:1;text-align:center;}
  .yoy-arrow{font-size:18px;color:var(--lightblue);font-weight:700;}
  .yoy-badge{margin-top:14px;text-align:center;font-size:13px;font-weight:700;padding:9px;border-radius:12px;}
  .yoy-badge.up{background:var(--red-bg);color:var(--red);}
  .yoy-badge.down{background:var(--green-bg);color:var(--green);}
  .yoy-badge.flat{background:var(--bg);color:var(--gray);}

  /* bottom nav */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:10;}
  .bottomnav-inner{max-width:440px;width:100%;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.07);border-radius:20px 20px 0 0;display:flex;padding:10px 8px calc(env(safe-area-inset-bottom) + 10px);}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--gray);}
  .nav-btn.active{color:var(--navy);}
  .nav-icon{font-size:20px;}

  /* overlays / sheets */
  .overlay{position:fixed;inset:0;background:rgba(20,20,40,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .overlay-box{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:92vh;overflow-y:auto;animation:up .2s ease-out;}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-handle{width:40px;height:5px;border-radius:99px;background:#DADCE6;margin:0 auto 12px;}
  .overlay-title{font-size:18px;font-weight:800;margin:0 0 4px;}
  .overlay-sub{font-size:13px;color:var(--gray);margin:0 0 14px;}
  .form-label{font-size:12px;font-weight:700;color:var(--gray);margin:14px 0 6px;display:block;}
  .text-input{width:100%;font-size:16px;border-radius:12px;padding:12px 13px;background:var(--bg);border:2px solid transparent;color:var(--ink);outline:none;}
  .text-input:focus{border-color:var(--lightblue);background:#fff;}
  .big-price{font-size:26px;font-weight:800;text-align:center;padding:16px;}
  .qty-row{display:flex;gap:8px;align-items:center;}
  .qty-row .text-input{text-align:center;font-weight:800;font-size:18px;}
  .step{width:52px;height:50px;border-radius:12px;background:#EEF3FB;font-size:24px;font-weight:800;color:var(--navy);flex-shrink:0;}
  .sub-preview{font-size:13px;font-weight:700;color:var(--navy-2);margin:6px 0 0;min-height:18px;}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .cat-grid .chip{border-radius:12px;padding:9px 4px;font-size:12px;text-align:center;}
  .prio-row{display:flex;gap:6px;}
  .prio-row .chip{flex:1;border-radius:12px;text-align:center;}
  .ocr-box{background:#EEF3FB;border-radius:14px;padding:10px 12px 12px;margin-bottom:6px;}
  .ocr-box .form-label{margin-top:4px;}
  .ocr-box p{margin:0;font-size:12px;color:var(--navy-2);}
  .sheet-actions{margin-top:18px;}
  .modal-btn{width:100%;border-radius:14px;padding:14px 15px;font-weight:700;margin-bottom:10px;background:var(--bg);color:var(--navy);text-align:left;display:block;}
  .modal-btn b{display:block;font-size:14px;}
  .modal-btn span{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-top:2px;}

  .calc-display{background:var(--bg);border-radius:14px;padding:18px 16px;text-align:right;font-family:'Courier New',monospace;font-size:32px;font-weight:700;color:var(--navy);margin-bottom:14px;overflow-x:auto;white-space:nowrap;}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .calc-btn{background:var(--bg);border-radius:14px;padding:17px 0;font-size:19px;font-weight:700;color:var(--navy);text-align:center;}
  .calc-btn.op{background:var(--lightblue);}
  .calc-btn.eq{background:var(--yellow);}
  .calc-btn.clear{background:var(--red-bg);color:var(--red);}

  /* receitas */
  .mac-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px;}
  .mac{background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .mac b{font-size:14px;color:var(--ink);}
  .mac small{font-size:10px;color:var(--gray);font-weight:600;}
  .mac-dot{width:8px;height:8px;border-radius:50%;}
  .por-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;font-weight:700;color:var(--gray);}
  .por-row b{font-size:17px;color:var(--navy);min-width:20px;text-align:center;}
  .step.sm{width:36px;height:34px;font-size:20px;border-radius:10px;}
  .res-wrap{display:flex;align-items:stretch;border-top:1px solid #F0F1F6;}
  .res-wrap .res-row{border-top:none;flex:1;min-width:0;}
  .res-edit{width:44px;flex-shrink:0;font-size:16px;border-left:1px solid #F0F1F6;}
  .fp-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .res-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid #F0F1F6;text-align:left;}
  .res-row span{font-size:14px;font-weight:600;color:var(--ink);}
  .res-row small{font-size:11px;color:var(--gray);text-align:right;white-space:nowrap;font-weight:700;line-height:1.2;}
  .res-row.new span{color:var(--navy-2);}
  .food-pick{display:flex;align-items:center;gap:10px;background:#EEF3FB;border-radius:14px;padding:12px;}
  .food-pick div{flex:1;}
  .food-pick b{display:block;font-size:14px;color:var(--ink);}
  .food-pick small{font-size:12px;color:var(--gray);font-weight:600;}
  .food-pick button{font-size:13px;font-weight:800;color:var(--navy-2);text-decoration:underline;}
  .ing-preview{margin-top:14px;background:#FFF3D6;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;}
  .ing-preview b{font-size:20px;color:var(--navy);}
  .ing-preview span{font-size:12px;color:#7A5800;font-weight:600;}
  .prep-preview{margin:0;font-size:13px;color:var(--ink);background:var(--bg);border-radius:12px;padding:10px 12px;max-height:160px;overflow:auto;}
  .food-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;}

  /* cardápio */
  .seg{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;margin-top:14px;}
  .seg button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--lightblue);}
  .seg button.on{background:#fff;color:var(--navy);}
  .period{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .period button{width:40px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;font-weight:700;}
  .period span{font-weight:800;font-size:15px;cursor:pointer;}
  .prof-cta{border:2px dashed var(--yellow);cursor:pointer;display:flex;flex-direction:column;gap:4px;}
  .prof-cta b{font-size:15px;}
  .prof-cta span{font-size:13px;color:var(--gray);}
  .prof-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;cursor:pointer;}
  .wk-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .wk-note{grid-column:span 2;margin:0;font-size:12px;font-weight:700;color:var(--green);background:var(--green-bg);padding:8px 10px;border-radius:10px;}
  .stat-value.neg,.stat-big.neg{color:var(--red);}
  .stat-big.pos{color:var(--green);}
  .day-card{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px 14px;cursor:pointer;}
  .day-card.today{border:2px solid var(--yellow);}
  .dc-date{width:44px;text-align:center;flex-shrink:0;}
  .dc-date b{display:block;font-size:15px;}
  .dc-date small{font-size:11px;color:var(--gray);font-weight:600;}
  .dc-main{flex:1;min-width:0;}
  .dc-meals{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink);font-weight:600;}
  .dc-empty{font-size:13px;color:var(--gray);}
  .dc-st{font-size:11px;font-weight:700;margin-top:3px;color:var(--gray);}
  .dc-st.ok{color:var(--green);} .dc-st.near{color:#9A6A00;} .dc-st.over,.dc-st.low{color:var(--red);}
  .dc-kcal{text-align:right;min-width:50px;}
  .dc-kcal b{display:block;font-size:16px;}
  .dc-kcal small{font-size:10px;color:var(--gray);font-weight:700;}
  .wk-actions{margin-top:14px;}
  .cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}

<script>

/* =========================================================

const CATEGORIES = [

  {id:"higiene", label:"Higiene", emoji:"🧴"},
  {id:"outros", label:"Outros", emoji:"📦"},
];
const UNITS = ['un','kg','g','L','ml','pct','cx','dz'];
const PRIO_ORDER = {alta:0, normal:1, baixa:2};

/* palavras-chave para adivinhar a categoria (sem acento) */
const CAT_WORDS = {
  hortifruti:['banana','maca','tomate','alface','cebola','alho','batata','cenoura','limao','laranja','mamao','abacate','couve','pepino','abobrinha','abobora','brocolis','mandioca','macaxeira','uva','melancia','melao','morango','pimentao','cheiro verde','cebolinha','coentro','salsa','repolho','beterraba','chuchu','inhame','fruta','verdura','legume','tangerina','manga','abacaxi','acai','kiwi','pera','rucula','espinafre','gengibre','quiabo','jilo','maxixe','vagem'],
  acougue:['carne','frango','peito de frango','coxa','sobrecoxa','asa','patinho','acem','alcatra','picanha','costela','linguica','salsicha','bacon','peixe','tilapia','tambaqui','pirarucu','file','moida','porco','lombo','calabresa','musculo','fraldinha','maminha','cupim','bisteca','pernil','figado','camarao','sardinha fresca','hamburguer'],
  padaria:['pao','bolo','torrada','rosca','bisnaguinha','pao de queijo','sonho','broa','croissant','baguete'],
  laticinios:['leite','queijo','iogurte','manteiga','requeijao','margarina','nata','creme de leite','mucarela','mussarela','presunto','peito de peru','mortadela','salame','ricota','coalhada','leite condensado'],
  mercearia:['arroz','feijao','macarrao','acucar','sal','oleo','azeite','farinha','cafe','achocolatado','biscoito','bolacha','molho','extrato','ovo','ovos','aveia','granola','tapioca','fuba','milho','ervilha','sardinha','atum','tempero','vinagre','maionese','ketchup','mostarda','cereal','chocolate','gelatina','fermento','lentilha','grao de bico','castanha','amendoim','pipoca','cha'],
  bebidas:['refrigerante','refri','suco','agua','cerveja','vinho','guarana','coca','energetico','agua de coco','isotonico'],
  limpeza:['sabao','detergente','amaciante','agua sanitaria','desinfetante','esponja','vassoura','rodo','saco de lixo','lixo','multiuso','alcool','limpador','cloro','lustra','pano de chao','pano','inseticida','lava roupa','tira manchas','palha de aco','bombril'],
  higiene:['shampoo','xampu','condicionador','sabonete','pasta de dente','creme dental','escova de dente','escova','desodorante','papel higienico','absorvente','fralda','lenco','cotonete','fio dental','hidratante','protetor solar','barbeador','aparelho de barbear','enxaguante'],
};
const CAT_LOOKUP = Object.entries(CAT_WORDS)
  .flatMap(([cat, words]) => words.map(w => [w, cat]))
  .sort((a,b) => b[0].length - a[0].length);

/* =========================================================
   AJUDANTES
   ========================================================= */
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2,'0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ymKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function brl(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtQty(n){ return (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function parseDate(d){ return new Date((d||todayStr())+"T12:00:00"); }
function fmtDate(d){ return parseDate(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).replace(/\./g,''); }
function fmtDateShort(d){ const x = parseDate(d); return `${pad(x.getDate())}/${pad(x.getMonth()+1)}`; }
function monthLabel(key){ const [y,m] = key.split("-"); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); }
function uid(p){ return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function cap(s){ s = String(s||'').trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
function parseNum(s){
  if(s === null || s === undefined) return null;
  if(typeof s === 'number') return isNaN(s) ? null : s;
  s = String(s).replace(/R\$/i,'').replace(/\s/g,'');
  if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function numToInput(n){ return (n === null || n === undefined || n === '') ? '' : String(n).replace('.',','); }
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const round3 = n => Math.round((n + Number.EPSILON) * 1000) / 1000;
function catById(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }
function guessCategory(name){
  const n = ' ' + norm(name) + ' ';
  for(const [w, cat] of CAT_LOOKUP){ if(n.includes(' '+w)) return cat; }
  return 'mercearia';
}
function unitStep(u){ return (u==='kg'||u==='L') ? 0.5 : (u==='g'||u==='ml') ? 100 : 1; }

/* "2 kg frango", "frango 2kg", "3x leite", "leite 3" */
const UNIT_RE = '(kg|g|gr|l|lt|litros?|ml|un|und|unid|unidades?|pct|pcte|pacotes?|cx|caixas?|dz|duzias?|x)';
function mapUnit(u){
  if(!u) return null;
  u = norm(u);
  if(u==='x') return null;
  if(u==='kg') return 'kg';
  if(u==='g'||u==='gr') return 'g';
  if(u==='l'||u==='lt'||u.startsWith('litro')) return 'L';
  if(u==='ml') return 'ml';
  if(u.startsWith('pc')||u.startsWith('pacote')) return 'pct';
  if(u==='cx'||u.startsWith('caixa')) return 'cx';
  if(u==='dz'||u.startsWith('duzia')) return 'dz';
  return 'un';
}
function parseQuick(text){
  const t = String(text||'').trim();
  let m = t.match(new RegExp('^(\\d+(?:[.,]\\d+)?)\\s*'+UNIT_RE+'?\\s+(.+)$','i'));
  if(m) return { qty: parseNum(m[1]), unit: mapUnit(m[2]), name: m[3].replace(/^de\s+/i,'').trim() };
  m = t.match(new RegExp('^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*'+UNIT_RE+'?$','i'));
  if(m) return { qty: parseNum(m[2]), unit: mapUnit(m[3]), name: m[1].trim() };
  m = t.match(/^(.+?)\s+x\s*(\d+(?:[.,]\d+)?)$/i);
  if(m) return { qty: parseNum(m[2]), unit: null, name: m[1].trim() };
  m = t.match(/^x\s*(\d+)\s+(.+)$/i);
  if(m) return { qty: Number(m[1]), unit: null, name: m[2].trim() };
  return { qty: null, unit: null, name: t };
}

/* =========================================================
   DADOS: normalização, armazenamento local
   ========================================================= */
function byRecent(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.updatedAt||0) - (a.updatedAt||0); }

function normalizeLists(raw){
  const arr = Array.isArray(raw) ? raw : [];
  const lists = arr.filter(l => l && l.id).map(l => ({
    id: String(l.id),
    date: /^\d{4}-\d{2}-\d{2}$/.test(l.date||'') ? l.date : todayStr(),
    name: l.name || '',
    market: l.market || '',
    meta: (l.meta === undefined || l.meta === null) ? '' : l.meta,
    status: l.status === 'open' || l.status === 'done' ? l.status : null,
    updatedAt: Number(l.updatedAt) || 0,
    deleted: !!l.deleted,
    items: (Array.isArray(l.items) ? l.items : []).filter(Boolean).map(it => {
      const price = (it.unitPrice === null || it.unitPrice === undefined || it.unitPrice === '') ? null : parseNum(it.unitPrice);
      return {
        id: String(it.id || uid('i')),
        name: String(it.name || '').trim() || 'Item',
        category: CATEGORIES.some(c=>c.id===it.category) ? it.category : 'outros',
        qty: Number(it.qty) > 0 ? Number(it.qty) : 1,
        unit: UNITS.includes(it.unit) ? it.unit : 'un',
        unitPrice: price,
        bought: !!it.bought,
        priority: PRIO_ORDER[it.priority] !== undefined ? it.priority : 'normal',
        brand: String(it.brand || '').trim(),
        pack: String(it.pack || '').trim(),
      };
    }),
  }));
  // Listas antigas (sem status): só a mais recente com itens pendentes fica "em andamento"
  const noStatus = lists.filter(l => !l.status).sort(byRecent);
  noStatus.forEach((l, i) => { l.status = (i === 0 && !l.deleted && l.items.some(it => !it.bought)) ? 'open' : 'done'; });
  return lists;
}

function loadLocal(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_LISTS); }catch(e){}
  try{
    if(raw && !localStorage.getItem(LS_LOCAL_BACKUP)) localStorage.setItem(LS_LOCAL_BACKUP, raw);
  }catch(e){}
  try{ return JSON.parse(raw || '[]'); }catch(e){ return []; }
}
const COLLS = [
  { key: CLOUD_KEY,   field: 'lists',   ls: LS_LISTS,            normalize: x => normalizeLists(x) },
  { key: 'receitas',  field: 'recipes', ls: 'carol_recipes_v1',  normalize: x => normalizeRecipes(x) },
  { key: 'alimentos', field: 'foods',   ls: 'carol_foods_v1',    normalize: x => normalizeFoods(x) },
  { key: 'cardapio',  field: 'plans',   ls: 'carol_plans_v1',    normalize: x => normalizePlans(x) },
  { key: 'perfil',    field: 'profile', ls: 'carol_profile_v1',  normalize: x => normalizeProfile(x) },
];
function loadColl(ls){ try{ return JSON.parse(localStorage.getItem(ls) || '[]'); }catch(e){ return []; } }
function saveLocal(){ COLLS.forEach(c => { try{ localStorage.setItem(c.ls, JSON.stringify(state[c.field])); }catch(e){} }); }
function isDirty(){ try{ return localStorage.getItem(LS_DIRTY) === '1'; }catch(e){ return false; } }
function setDirty(v){ try{ localStorage.setItem(LS_DIRTY, v ? '1' : '0'); }catch(e){} }

/* =========================================================
   RECEITAS — ingredientes, quantidades e calorias
   Tabela de calorias: TACO (Tabela Brasileira de Composição de Alimentos – NEPA/UNICAMP), valores por 100 g
   ========================================================= */
const ING_UNITS = {
  g:   { label: 'g',            g: 1 },
  kg:  { label: 'kg',           g: 1000 },
  ml:  { label: 'ml',           g: 1 },
  L:   { label: 'L',            g: 1000 },
  un:  { label: 'unidade',      g: null },
  cs:  { label: 'colher sopa',  g: 15 },
  cc:  { label: 'colher chá',   g: 5 },
  xic: { label: 'xícara',       g: 240 },
};
const UNIT_WEIGHTS = [ // peso aproximado de 1 unidade (g)
  ['ovo de codorna',10],['ovo',50],['banana',90],['pao frances',50],['pao de forma',25],['pao de queijo',30],['maca',130],['laranja',180],['tangerina',150],
  ['limao',70],['tomate',100],['cebola',100],['batata doce',150],['batata',150],['cenoura',100],['alho',5],['abobrinha',250],['pepino',150],
  ['pimentao',150],['mamao',400],['manga',300],['pera',150],['kiwi',75],['tapioca',30],['queijo',20],['presunto',15],['peito de frango',150],
  ['file',120],['coxa',100],['sobrecoxa',120],['bife',120],['torrada',8],['biscoito',7],['bolacha',7],['iogurte',170],
];
function defaultUnitWeight(name){
  const words = norm(name).replace(/[,()/]/g, ' ').split(/\s+/).filter(x => x && x !== 'de' && x !== 'da' && x !== 'do');
  for(const [w, g] of UNIT_WEIGHTS){ if(w.split(' ').filter(x => x !== 'de').every(k => words.some(x => x.startsWith(k)))) return g; }
  return 100;
}
const per100Of = p => ({ kcal: Number(p && p.kcal) || 0, p: Number(p && p.p) || 0, c: Number(p && p.c) || 0, f: Number(p && p.f) || 0, fib: Number(p && p.fib) || 0 });

function normalizeRecipes(raw){
  return (Array.isArray(raw) ? raw : []).filter(r => r && r.id).map(r => ({
    id: String(r.id), name: String(r.name || 'Receita').trim(), portions: Number(r.portions) > 0 ? Number(r.portions) : 1,
    notes: String(r.notes || ''), updatedAt: Number(r.updatedAt) || 0, deleted: !!r.deleted,
    ingredients: (Array.isArray(r.ingredients) ? r.ingredients : []).filter(Boolean).map(i => ({
      id: String(i.id || uid('g')), foodId: String(i.foodId || ''), name: String(i.name || 'Ingrediente'), srcName: String(i.srcName || ''),
      qty: Number(i.qty) > 0 ? Number(i.qty) : 0, unit: ING_UNITS[i.unit] ? i.unit : 'g',
      gPerUnit: Number(i.gPerUnit) > 0 ? Number(i.gPerUnit) : null, per100: per100Of(i.per100),
    })),
  }));
}
function normalizeFoods(raw){
  return (Array.isArray(raw) ? raw : []).filter(f => f && f.id).map(f => ({
    id: String(f.id), name: String(f.name || 'Alimento').trim(), per100: per100Of(f.per100),
    updatedAt: Number(f.updatedAt) || 0, deleted: !!f.deleted,
  }));
}

const liveRecipes = () => state.recipes.filter(r => !r.deleted);
const liveFoods = () => state.foods.filter(f => !f.deleted);
const activeRecipe = () => state.recipes.find(r => r.id === state.recipeId && !r.deleted);

function ingGrams(i){
  const u = ING_UNITS[i.unit] || ING_UNITS.g;
  const per = (i.unit === 'un' || ['xic','cs','cc'].includes(i.unit)) && i.gPerUnit ? i.gPerUnit : (i.unit === 'un' ? 0 : u.g);
  return (Number(i.qty) || 0) * per;
}
function ingNutri(i){
  const k = ingGrams(i) / 100, p = i.per100 || {};
  return { g: ingGrams(i), kcal: k*(p.kcal||0), p: k*(p.p||0), c: k*(p.c||0), f: k*(p.f||0), fib: k*(p.fib||0) };
}
function recipeTotals(r){
  const t = { g:0, kcal:0, p:0, c:0, f:0, fib:0 };
  r.ingredients.forEach(i => { const n = ingNutri(i); for(const k in t) t[k] += n[k]; });
  const por = {}; for(const k in t) por[k] = t[k] / (r.portions || 1);
  return { total: t, por };
}
const kcalTxt = v => Math.round(v).toLocaleString('pt-BR') + ' kcal';
const gTxt = v => (v >= 10 ? Math.round(v) : Math.round(v*10)/10).toLocaleString('pt-BR') + ' g';
function ingQtyTxt(i){
  if(i.unit === 'un') return `${fmtQty(i.qty)} ${i.qty == 1 ? 'unidade' : 'unidades'}`;
  if(['g','kg','ml','L'].includes(i.unit)) return `${fmtQty(i.qty)} ${i.unit}`;
  const lbl = ING_UNITS[i.unit].label;
  return `${fmtQty(i.qty)} ${i.qty > 1 ? lbl.replace('colher','colheres').replace('xícara','xícaras') : lbl}`;
}

/* --- tabela TACO (carrega uma vez, fica guardada pelo modo offline) --- */
let TACO = null, tacoLoading = null;
function ensureTaco(){
  if(TACO) return Promise.resolve(TACO);
  if(!tacoLoading){
    tacoLoading = fetch('taco.json').then(r => r.json()).then(rows => {
      TACO = rows.map(([id, name, kcal, p, c, f, fib]) => ({ id: 't' + id, name, n: norm(name), per100: { kcal, p, c, f, fib } }));
      [['x1','Canela, em pó',247,4,81,1.2,53],['x2','Óleo, de coco',884,0,0,100,0],['x3','Sal, refinado',0,0,0,0,0],['x4','Pimenta-do-reino, em pó',251,10,64,3.3,25],
       ['x5','Água',0,0,0,0,0],['x6','Vinagre',19,0,0.9,0,0],['x7','Chia, semente',486,17,42,31,34],['x8','Linhaça, semente',534,18,29,42,27],
       ['x9','Whey protein (média)',400,80,8,6,0],['x10','Pasta de amendoim, integral',588,25,20,50,6],['x11','Cacau, em pó, 100%',228,20,58,14,37],
       ['x12','Orégano, seco',265,9,69,4.3,42],['x13','Psyllium',200,2,85,0.6,71],['x14','Adoçante, culinário (sucralose)',0,0,0,0,0]]
        .forEach(([id, name, kcal, p, c, f, fib]) => TACO.push({ id, name, n: norm(name), per100: { kcal, p, c, f, fib } }));
      if(state.sheet && state.sheet.type === 'ing') renderIngResults();
      return TACO;
    }).catch(e => { tacoLoading = null; throw e; });
  }
  return tacoLoading;
}
function findFood(id){
  if(!id) return null;
  if(/^[tx]\d/.test(id)) return TACO ? TACO.find(f => f.id === id) : null;
  return liveFoods().find(f => f.id === id) || null;
}
function searchFoods(q){
  const words = norm(q).split(' ').filter(Boolean);
  const mine = liveFoods().map(f => ({ ...f, n: norm(f.name), mine: true }));
  const all = [...mine, ...(TACO || [])];
  if(!words.length) return mine.slice(0, 20);
  return all.filter(f => words.every(w => f.n.includes(w)))
    .sort((a,b) => (b.mine - a.mine) || (b.n.startsWith(words[0]) - a.n.startsWith(words[0])) || (popRank(a.n) - popRank(b.n)) || /cru/.test(a.n) - /cru/.test(b.n) || a.n.length - b.n.length)
    .slice(0, 40);
}
const POPULAR = ['azeite, de oliva','leite, de vaca, integral','acucar, refinado','feijao, carioca, cozido','arroz, tipo 1, cozido','frango, peito, sem pele, grelhado','ovo, de galinha, inteiro, cozido','banana, prata','pao, trigo, frances','batata, inglesa, cozida','carne, bovina, patinho, sem gordura, grelhado','oleo, de soja','manteiga, com sal','queijo, minas, frescal','aveia, flocos, crua','tapioca'];
const popRank = n => { const i = POPULAR.findIndex(p => n.startsWith(p)); return i < 0 ? 99 : i; };
function shopName(foodName){ return cap(String(foodName).split(',')[0].trim()); }

function foodDraftPer100(d){
  const base = d.mode === 'por' ? parseNum(d.porG) : 100;
  const kcal = parseNum(d.kcal);
  if(!(base > 0) || kcal === null) return null;
  const k = 100 / base;
  return { kcal: round2(kcal*k), p: round2((parseNum(d.p)||0)*k), c: round2((parseNum(d.c)||0)*k), f: round2((parseNum(d.f)||0)*k), fib: round2((parseNum(d.fib)||0)*k) };
}
function updateFoodPreview(){
  const el = document.getElementById('food-preview'), s = state.sheet; if(!el || !s || s.type !== 'food') return;
  const d = s.draft, p = foodDraftPer100(d);
  if(!p){ el.style.display = 'none'; return; }
  el.style.display = '';
  const use = parseNum(d.use);
  const k = use > 0 ? use / 100 : 0;
  const per100Line = d.mode === 'por' ? `Em 100 g: ${kcalTxt(p.kcal)}` : '';
  // conferência: calorias batem com proteína/carbo/gordura?
  let warn = '';
  if(p.p || p.c || p.f){
    const calc = 4*p.p + 4*p.c + 9*p.f + 2*p.fib;
    if(p.kcal > 30 && Math.abs(calc - p.kcal) / p.kcal > 0.25) warn = `<span style="color:var(--red)">⚠️ Os números não fecham com as calorias — confira com a embalagem.</span>`;
    if(p.p + p.c + p.f + p.fib > 101) warn = `<span style="color:var(--red)">⚠️ A soma passa de 100 g em 100 g — algum número está errado (vírgula?).</span>`;
  }
  el.innerHTML = use > 0
    ? `<b>${fmtQty(use)} g = ${kcalTxt(p.kcal * k)}</b>${p.p || p.c || p.f || p.fib ? `<span>proteína ${gTxt(p.p*k)} · carbo ${gTxt(p.c*k)} · gordura ${gTxt(p.f*k)} · fibra ${gTxt(p.fib*k)}</span>` : ''}${per100Line ? `<span>${per100Line}</span>` : ''}${warn}`
    : `<b>${kcalTxt(p.kcal)} em 100 g</b>${s.adding ? '<span>Diga quantos gramas vai usar pra eu calcular 👆</span>' : ''}${warn}`;
}
function countFoodUses(id){
  let n = 0;
  state.recipes.forEach(r => { if(!r.deleted && r.ingredients.some(i => i.foodId === id)) n++; });
  state.plans.forEach(pl => { if(!pl.deleted && MEALS.some(m => (pl.meals[m.id] || []).some(e => e.foodId === id))) n++; });
  return n;
}
function propagateFood(food){
  state.recipes.forEach(r => {
    let ch = false;
    r.ingredients.forEach(i => { if(i.foodId === food.id){ i.name = food.name; i.per100 = per100Of(food.per100); ch = true; } });
    if(ch) touch(r);
  });
  state.plans.forEach(pl => {
    let ch = false;
    MEALS.forEach(m => (pl.meals[m.id] || []).forEach(e => { if(e.type === 'food' && e.foodId === food.id){ e.name = food.name; e.per100 = per100Of(food.per100); ch = true; } }));

}

/* --- ler a tabela nutricional por foto (grátis, no celular) --- */
function labelNumbers(line){
  const clean = line.replace(/\([^)]*\)/g, ' ').replace(/(\d)\s*[.,]\s*(\d)/g, '$1,$2');
  return (clean.match(/\d+(?:,\d+)?/g) || []).map(x => parseNum(x)).filter(x => x !== null);
}
function parseNutritionText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const n = l => norm(l);
  const has100 = lines.some(l => /\b100\s*[g9o6]\b|\b1006\b|100\s*ml|100g/.test(n(l)));
  const porM = n(text).match(/porcao\D{0,12}(\d+(?:[.,]\d+)?)\s*(g|9|ml|gr)\b/);
  const porG = porM ? parseNum(porM[1]) : null;
  const pick = re => { const l = lines.find(x => re.test(n(x)) && !/saturad|trans|acucar|adicionad/.test(n(x))); if(!l) return null; const nums = labelNumbers(l.replace(/^[^\d]*?(kcal\s*)?/i, m => m)); return nums.length ? nums[0] : null; };
  const out = {
    kcal: pick(/valor energ|energia|caloria/),
    c: pick(/carbo/),
    p: pick(/prote/),
    f: pick(/gorduras? tota|gordura total|lipid/),
    fib: pick(/fibra/),
  };
  return { ...out, mode: has100 || !porG ? '100' : 'por', porG };
}
async function ocrNutritionTable(src){
  await loadTesseract();
  // 1ª leitura: imagem inteira (bom quando a foto já é de perto)
  const big = document.createElement('canvas');
  const s1 = Math.min(2200 / src.width, 4200 / src.height, 3);
  big.width = Math.round(src.width * s1); big.height = Math.round(src.height * s1);
  { const bx = big.getContext('2d'); bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = 'high'; bx.drawImage(src, 0, 0, big.width, big.height); }
  const r1 = await Tesseract.recognize(await prepImage(big, false, false, true), 'por');
  let best = parseNutritionText(r1.data.text);
  const score = x => ['kcal','c','p','f','fib'].filter(k => x[k] !== null).length;
  // 2ª leitura: recorta a área da tabela (perto do título "INFORMAÇÃO NUTRICIONAL")
  if(score(best) < 4){
    const ws = (r1.data.words || []).filter(w => /nutricion|informa/i.test(norm(w.text)));
    if(ws.length){
      const sc = src.width / big.width; // a leitura foi feita na imagem ampliada
      const x0 = Math.min(...ws.map(w => w.bbox.x0)), x1 = Math.max(...ws.map(w => w.bbox.x1)), y0 = Math.min(...ws.map(w => w.bbox.y0));
      const W = (x1 - x0) * sc, cx = (x0 + x1) / 2 * sc, top = y0 * sc;
      const cw = Math.min(src.width, W * 1.7), chh = Math.min(src.height - top, W * 1.7);
      const crop = document.createElement('canvas');
      const s2 = 1600 / cw;
      crop.width = 1600; crop.height = Math.round(chh * s2);
      { const cx2 = crop.getContext('2d'); cx2.imageSmoothingEnabled = true; cx2.imageSmoothingQuality = 'high'; cx2.drawImage(src, Math.max(0, cx - cw / 2), Math.max(0, top - W * 0.05), cw, chh, 0, 0, crop.width, crop.height); }
      const r2 = await Tesseract.recognize(await prepImage(crop, false, false, true), 'por');
      const p2 = parseNutritionText(r2.data.text);
      if(score(p2) >= score(best)) best = p2;
    }
  }
  return { ...best, found: score(best) };
}

  const say = t => { const el = document.getElementById('fl-status'); if(el) el.textContent = t; };

/* --- mandar ingredientes para uma lista de compras --- */
// cada fonte vira uma lista de {name, amount, unit:'un'|'g'|'ml'}
function shopLinesFromIngs(ings, factor, acc){
  acc = acc || new Map();
  ings.forEach(i => {
    let amount, unit;
    if(i.unit === 'un'){ amount = (Number(i.qty) || 0) * factor; unit = 'un'; }
    else { amount = ingGrams(i) * factor; unit = (i.unit === 'ml' || i.unit === 'L') ? 'ml' : 'g'; }
    if(!(amount > 0)) return;
    const name = shopName(i.name), k = norm(name) + '|' + unit;
    const cur = acc.get(k); if(cur) cur.amount += amount; else acc.set(k, { name, amount, unit });
  });
  return acc;
}
function shopLinesFor(source, times){
  if(source.kind === 'recipe'){
    const r = state.recipes.find(x => x.id === source.id); if(!r) return [];
    return [...shopLinesFromIngs(r.ingredients, times).values()];
  }
  const acc = new Map();
  weekDates(source.start).forEach(d => {
    const pl = planOf(d); if(!pl) return;
    MEALS.forEach(m => (pl.meals[m.id] || []).forEach(e => {
      if(e.type === 'recipe'){
        const r = state.recipes.find(x => x.id === e.refId);
        if(r && r.portions) shopLinesFromIngs(r.ingredients, (Number(e.portions) || 1) / r.portions, acc);
      } else shopLinesFromIngs([e], 1, acc);
    }));
  });
  return [...acc.values()];
}
function openToListSheet(source){
  source = source || { kind: 'recipe', id: state.recipeId };
  const lines = shopLinesFor(source, 1);
  if(!lines.length){ toast(source.kind === 'recipe' ? 'Adicione ingredientes primeiro.' : 'Nenhuma refeição planejada nessa semana.'); return; }
  const r = source.kind === 'recipe' ? state.recipes.find(x => x.id === source.id) : null;
  const open = liveLists().filter(l => l.status === 'open').sort(byRecent);
  state.sheet = { type: 'tolist', source, draft: { times: '1' } };
  openSheetHtml(`
    <p class="overlay-title">🛒 Mandar pra lista</p>
    <p class="overlay-sub">${lines.length} ${lines.length > 1 ? 'itens' : 'item'} ${r ? `de "${esc(r.name)}"` : `das receitas da semana de ${fmtDateShort(source.start)}`}</p>
    ${r ? `<span class="form-label">Vai fazer a receita quantas vezes?</span>
    <div class="qty-row">
      <button class="step" data-act="times-dec">−</button>
      <input class="text-input" id="d-times" data-draft="times" inputmode="numeric" value="1" />
      <button class="step" data-act="times-inc">+</button>
    </div>` : `<div class="chips" style="margin-bottom:6px">${lines.slice(0, 18).map(x => `<span class="chip">${esc(x.name)}</span>`).join('')}${lines.length > 18 ? `<span class="chip">+${lines.length - 18}</span>` : ''}</div>`}
    <span class="form-label">Em qual lista?</span>
    ${open.map(l => `<button class="modal-btn" data-act="tolist-go" data-id="${esc(l.id)}"><b>${esc(listTitle(l))}</b><span>${l.items.length} itens · em andamento</span></button>`).join('')}
    <button class="modal-btn" data-act="tolist-go" data-id=""><b>✨ Nova lista</b><span>Cria uma lista só com esses itens</span></button>
    <p class="hint" style="color:var(--gray);font-weight:500">💡 Quantidades de alimentos cozidos (arroz, feijão…) vão como estão na receita — ajuste pro cru na lista se precisar.</p>
    <button class="ghost-btn" data-act="sheet-close">Cancelar</button>`);
}
function sendToList(listId){
  const s = state.sheet, source = s.source;
  const times = source.kind === 'recipe' ? Math.max(1, parseNum(s.draft.times) || 1) : 1;
  const lines = shopLinesFor(source, times);
  const title = source.kind === 'recipe' ? (state.recipes.find(x => x.id === source.id) || {}).name : `Cardápio ${fmtDateShort(source.start)}`;
  let l = listId ? getList(listId) : null;
  if(!l){
    l = { id: uid('l'), date: todayStr(), name: title || '', market: '', meta: '', status: 'open', updatedAt: 0, deleted: false, items: [] };
    state.lists.push(l);
  }
  lines.forEach(x => {
    let qty = x.amount, unit = x.unit;
    if(unit === 'un') qty = Math.ceil(qty * 100) / 100;
    else if(qty >= 1000){ qty = round3(qty / 1000); unit = unit === 'ml' ? 'L' : 'kg'; }
    else qty = Math.round(qty);
    const item = buildItemFromName(x.name, qty, unit);
    item.qty = round3(qty); item.unit = unit;
    addItemToList(l, item, true);
  });
  touch(l); closeSheet();
  toast(`${lines.length} ${lines.length > 1 ? 'itens' : 'item'} na lista "${listTitle(l)}"`, 'Ver lista', () => openList(l.id), 6000);
}

  { v: 1.55,  label: 'Moderada',       sub: 'Exercício 3 a 5x por semana' },
  { v: 1.725, label: 'Intensa',        sub: 'Exercício 6 a 7x por semana' },
  { v: 1.9,   label: 'Muito intensa',  sub: 'Treino pesado todo dia / trabalho físico' },
];
const DEFICITS = [250, 500, 750];
const WEEKDAYS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

/* --- datas --- */
function dStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(str, n){ const d = parseDate(str); d.setDate(d.getDate() + n); return dStr(d); }
function weekStartOf(str){ const d = parseDate(str); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dStr(d); }
function weekDates(start){ return Array.from({ length: 7 }, (_, i) => addDays(start, i)); }
function wdIdx(str){ return (parseDate(str).getDay() + 6) % 7; }
function dayTitle(str){
  const t = todayStr();
  if(str === t) return 'Hoje';
  if(str === addDays(t, 1)) return 'Amanhã';
  if(str === addDays(t, -1)) return 'Ontem';
  return parseDate(str).toLocaleDateString('pt-BR', { weekday: 'long' }).replace(/^./, c => c.toUpperCase());
}
function monthTitle(str){ return parseDate(str).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(/^./, c => c.toUpperCase()); }

/* --- dados --- */
function normalizePlans(raw){
  return (Array.isArray(raw) ? raw : []).filter(p => p && /^\d{4}-\d{2}-\d{2}$/.test(p.id || '')).map(p => {
    const meals = {};
    MEALS.forEach(m => {
      meals[m.id] = (Array.isArray(p.meals && p.meals[m.id]) ? p.meals[m.id] : []).filter(Boolean).map(e => e.type === 'recipe'
        ? { id: String(e.id || uid('e')), type: 'recipe', refId: String(e.refId || ''), name: String(e.name || 'Receita'), portions: Number(e.portions) > 0 ? Number(e.portions) : 1, kcal: Number(e.kcal) || 0 }
        : { id: String(e.id || uid('e')), type: 'food', foodId: String(e.foodId || ''), name: String(e.name || 'Alimento'), qty: Number(e.qty) > 0 ? Number(e.qty) : 0,
            unit: ING_UNITS[e.unit] ? e.unit : 'g', gPerUnit: Number(e.gPerUnit) > 0 ? Number(e.gPerUnit) : null, per100: per100Of(e.per100) });
    });
    return { id: p.id, meals, updatedAt: Number(p.updatedAt) || 0, deleted: !!p.deleted };
  });
}
function normalizeProfile(raw){
  return (Array.isArray(raw) ? raw : []).filter(p => p && p.id === 'me').map(p => ({
    id: 'me', sex: p.sex === 'm' ? 'm' : 'f', age: Number(p.age) || null, height: Number(p.height) || null, weight: Number(p.weight) || null,
    activity: Number(p.activity) || 1.375, deficit: Number(p.deficit) >= 0 ? Number(p.deficit) : 500, updatedAt: Number(p.updatedAt) || 0, deleted: false,
  })).slice(0, 1);
}
const myProfile = () => state.profile[0] || null;
const planOf = date => state.plans.find(p => p.id === date && !p.deleted) || null;
function ensurePlan(date){
  let p = state.plans.find(x => x.id === date);
  if(!p){ p = { id: date, meals: {}, updatedAt: 0, deleted: false }; MEALS.forEach(m => p.meals[m.id] = []); state.plans.push(p); }
  if(p.deleted){ p.deleted = false; MEALS.forEach(m => p.meals[m.id] = []); }
  return p;
}
function mealArr(date, meal){ return ensurePlan(date).meals[meal]; }
const planIsEmpty = p => !p || MEALS.every(m => !(p.meals[m.id] || []).length);

function entryNutri(e){
  if(e.type === 'recipe'){
    const r = state.recipes.find(x => x.id === e.refId);
    if(r){ const { por } = recipeTotals(r); const o = {}; for(const k in por) o[k] = por[k] * e.portions; return o; }
    return { g: 0, kcal: e.kcal || 0, p: 0, c: 0, f: 0, fib: 0 };
  }
  return ingNutri(e);
}
function dayTotals(date){
  const t = { kcal: 0, p: 0, c: 0, f: 0, fib: 0 }, pl = planOf(date);
  if(pl) MEALS.forEach(m => (pl.meals[m.id] || []).forEach(e => { const n = entryNutri(e); for(const k in t) t[k] += n[k] || 0; }));
  return t;
}
function mealKcal(pl, meal){ return (pl && pl.meals[meal] || []).reduce((s, e) => s + entryNutri(e).kcal, 0); }

/* --- gasto do corpo (Mifflin-St Jeor) --- */
function calcTDEE(pf){
  if(!pf || !pf.age || !pf.height || !pf.weight) return null;
  const bmr = 10*pf.weight + 6.25*pf.height - 5*pf.age + (pf.sex === 'm' ? 5 : -161);
  return { bmr, tdee: bmr * pf.activity };
}
const minKcal = pf => (pf && pf.sex === 'm') ? 1500 : 1200;
function dayStatus(date){
  const pf = myProfile(), e = calcTDEE(pf), kcal = dayTotals(date).kcal;
  if(!kcal) return { kcal, cls: 'none' };
  if(!e) return { kcal, cls: 'none' };
  const deficit = e.tdee - kcal, target = pf.deficit || 0;
  let cls = 'ok';
  if(deficit < 0) cls = 'over';
  else if(target && deficit < target * 0.8) cls = 'near';
  const pl = planOf(date), filled = MEALS.filter(m => (pl && pl.meals[m.id] || []).length).length;
  if(kcal < minKcal(pf) && filled >= 3) cls = 'low';
  return { kcal, deficit, tdee: e.tdee, meta: e.tdee - target, cls };
}
const STATUS_TXT = { ok: '🟢 No alvo', near: '🟡 Perto da meta', over: '🔴 Acima do gasto', low: '⚠️ Muito baixo', none: '' };

/* --- telas --- */
function menuHeader(){
  const isWeek = state.menuView === 'week';
  const anchor = state.menuDate;
  const start = weekStartOf(anchor);
  const label = isWeek ? `${fmtDateShort(start)} a ${fmtDateShort(addDays(start, 6))}` : monthTitle(anchor);
  return `
    <div class="header">

}
function profileCard(){

  return `

      <span class="pen">✏️</span>
    </div>`;
}
function renderMenu(){
  return menuHeader() + `<div class="section overlap">${profileCard()}</div>` + (state.menuView === 'week' ? renderWeekBody() : renderMonthBody()) + bottomNav('menu');
}
function renderWeekBody(){
  const start = weekStartOf(state.menuDate), dates = weekDates(start), t = todayStr();
  const pf = myProfile(), e = calcTDEE(pf);
  const planned = dates.filter(d => dayTotals(d).kcal > 0);
  const sumKcal = planned.reduce((s, d) => s + dayTotals(d).kcal, 0);
  const sumDef = e ? planned.reduce((s, d) => s + (e.tdee - dayTotals(d).kcal), 0) : 0;
  const cards = dates.map(d => {
    const st = dayStatus(d), pl = planOf(d);
    const meals = MEALS.map(m => { const k = mealKcal(pl, m.id); return k ? `<span>${m.emoji} ${Math.round(k)}</span>` : ''; }).join('');
    return `
      <div class="card day-card ${d === t ? 'today' : ''}" data-act="open-day" data-id="${d}">
        <div class="dc-date"><b>${WEEKDAYS[wdIdx(d)]}</b><small>${fmtDateShort(d)}</small></div>
        <div class="dc-main">
          ${st.kcal ? `<div class="dc-meals">${meals}</div>` : `<div class="dc-empty">Toque pra planejar</div>`}
          ${st.kcal && st.deficit !== undefined ? `<div class="dc-st ${st.cls}">${STATUS_TXT[st.cls]} · ${st.deficit >= 0 ? 'déficit ' + Math.round(st.deficit) : 'sobra ' + Math.round(-st.deficit)} kcal</div>` : ''}
        </div>
        <div class="dc-kcal">${st.kcal ? `<b>${Math.round(st.kcal).toLocaleString('pt-BR')}</b><small>kcal</small>` : ''}</div>
      </div>`;
  }).join('');
  return `
    <div class="section">
      ${planned.length ? `
      <div class="card wk-sum">
        <div><p class="stat-label">Média por dia</p><p class="stat-value">${kcalTxt(sumKcal / planned.length)}</p></div>
        ${e ? `<div><p class="stat-label">Déficit da semana</p><p class="stat-value ${sumDef < 0 ? 'neg' : ''}">${Math.round(sumDef).toLocaleString('pt-BR')} kcal</p></div>` : ''}
        ${e && sumDef > 0 ? `<p class="wk-note">≈ ${(sumDef / 7700).toLocaleString('pt-BR', { maximumFractionDigits: 2 })} kg de gordura em ${planned.length} ${planned.length > 1 ? 'dias planejados' : 'dia planejado'} (estimativa)</p>` : ''}
      </div>` : ''}
      <h2 class="section-title">Dias da semana <small>${planned.length}/7 planejados</small></h2>
      ${cards}
      <div class="wk-actions">
        <button class="cta" data-act="week-to-list">🛒 Lista de compras da semana</button>
        <button class="ghost-btn" data-act="copy-prev-week">📋 Copiar a semana passada</button>
        <button class="ghost-btn" data-act="repeat-month">🔁 Repetir esta semana até o fim do mês</button>
      </div>
    </div>`;
}
function renderMonthBody(){
  const a = parseDate(state.menuDate), y = a.getFullYear(), mo = a.getMonth();
  const first = dStr(new Date(y, mo, 1)), last = dStr(new Date(y, mo + 1, 0));
  const start = weekStartOf(first), t = todayStr();
  const cells = [];
  for(let d = start; d <= last || wdIdx(d) !== 0; d = addDays(d, 1)){
    const inMonth = d >= first && d <= last;
    if(!inMonth){ cells.push('<div class="cal-cell out"></div>'); continue; }
    const st = dayStatus(d);
    cells.push(`<button class="cal-cell ${d === t ? 'today' : ''} st-${st.cls}" data-act="open-day" data-id="${d}">
      <span class="cal-n">${parseDate(d).getDate()}</span>${st.kcal ? `<span class="cal-k">${Math.round(st.kcal)}</span>` : ''}</button>`);
  }
  const days = []; for(let d = first; d <= last; d = addDays(d, 1)) days.push(d);
  const planned = days.filter(d => dayTotals(d).kcal > 0);
  const e = calcTDEE(myProfile());
  const sumKcal = planned.reduce((s, d) => s + dayTotals(d).kcal, 0);
  const sumDef = e ? planned.reduce((s, d) => s + (e.tdee - dayTotals(d).kcal), 0) : 0;
  return `
    <div class="section">
      <div class="card">
        <div class="cal-head">${WEEKDAYS.map(w => `<span>${w}</span>`).join('')}</div>
        <div class="cal-grid">${cells.join('')}</div>
        <div class="cal-legend"><span><i class="st-ok"></i>No alvo</span><span><i class="st-near"></i>Perto</span><span><i class="st-over"></i>Acima</span><span><i class="st-low"></i>Muito baixo</span></div>
      </div>
      <div class="card wk-sum" style="margin-top:12px">
        <div><p class="stat-label">Dias planejados</p><p class="stat-value">${planned.length} de ${days.length}</p></div>
        <div><p class="stat-label">Média por dia</p><p class="stat-value">${planned.length ? kcalTxt(sumKcal / planned.length) : '—'}</p></div>
        ${e && planned.length ? `<p class="wk-note">Déficit no mês: ${Math.round(sumDef).toLocaleString('pt-BR')} kcal ${sumDef > 0 ? `· ≈ ${(sumDef / 7700).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} kg de gordura (estimativa)` : ''}</p>` : ''}
      </div>
      <p class="hint" style="color:var(--gray);font-weight:500;text-align:center">Toque num dia pra montar as refeições. Na aba Semana dá pra copiar uma semana pro mês todo.</p>
    </div>`;
}

function renderDayStats(){
  const box = document.getElementById('dstats-box'); if(!box) return;
  const d = state.dayDate, t = dayTotals(d), pf = myProfile(), e = calcTDEE(pf);
  if(!e){
    box.innerHTML = `<div class="card"><div class="stats-grid"><div><p class="stat-label">Planejado no dia</p><p class="stat-big">${kcalTxt(t.kcal)}</p></div></div>
      <button class="link-btn" data-act="profile">🎯 Configure seu perfil pra ver o déficit</button></div>`;
    return;
  }
  const meta = e.tdee - pf.deficit, def = e.tdee - t.kcal, st = dayStatus(d);
  const pct = Math.min(100, t.kcal / Math.max(1, meta) * 100);
  box.innerHTML = `
    <div class="card">
      <div class="stats-grid">
        <div><p class="stat-label">Planejado</p><p class="stat-big">${kcalTxt(t.kcal)}</p></div>

      </div>
      <div class="progress-line"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${t.kcal > meta ? '#E74C3C' : 'var(--yellow)'}"></div></div><span>meta ${Math.round(meta)}</span></div>
      <p class="def-explain">Seu corpo gasta ${kcalTxt(e.tdee)} · ${t.kcal ? (def >= 0 ? `sobram ${Math.round(Math.max(0, meta - t.kcal))} kcal até a meta` : `passou ${Math.round(-def)} kcal do gasto`) : 'nada planejado ainda'}</p>
      ${t.kcal ? `<div class="mac-row">
        <div class="mac"><span class="mac-dot" style="background:#E57373"></span><b>${gTxt(t.p)}</b><small>proteína</small></div>
        <div class="mac"><span class="mac-dot" style="background:#FBAD09"></span><b>${gTxt(t.c)}</b><small>carboidrato</small></div>
        <div class="mac"><span class="mac-dot" style="background:#64B5F6"></span><b>${gTxt(t.f)}</b><small>gordura</small></div>
        <div class="mac"><span class="mac-dot" style="background:#81C784"></span><b>${gTxt(t.fib)}</b><small>fibra</small></div>
      </div>` : ''}
      ${st.cls === 'low' ? `<div class="meta-line over" style="margin-top:10px">⚠️ Abaixo de ${minKcal(pf)} kcal — muito pouco pra um dia. Vale conversar com sua nutricionista.</div>` : ''}
    </div>`;
}

function updateMrPreview(){

/* --- copiar dias e semanas (só preenche dias vazios; tem "Desfazer") --- */
function cloneMeals(src){ const o = {}; MEALS.forEach(m => o[m.id] = (src.meals[m.id] || []).map(e => ({ ...JSON.parse(JSON.stringify(e)), id: uid('e') }))); return o; }
function copyDays(pairs, msg){ // pairs: [[from, to], ...]
  const snapshot = [];
  pairs.forEach(([from, to]) => {
    const src = planOf(from); if(planIsEmpty(src)) return;
    const dst = planOf(to); if(!planIsEmpty(dst)) return;
    const existed = state.plans.find(p => p.id === to);
    snapshot.push({ to, before: existed ? JSON.parse(JSON.stringify(existed)) : null });
    const p = ensurePlan(to); p.meals = cloneMeals(src); touch(p);
  });
  render();
  if(!snapshot.length){ toast('Nada pra copiar (os dias de destino já têm refeições ou a origem está vazia).', null, null, 4000); return; }
  toast(`${snapshot.length} ${snapshot.length > 1 ? 'dias preenchidos' : 'dia preenchido'} ${msg}`, 'Desfazer', () => {
    snapshot.forEach(sn => {
      const p = state.plans.find(x => x.id === sn.to);
      if(sn.before){ Object.assign(p, sn.before); touch(p); } else if(p){ p.deleted = true; MEALS.forEach(m => p.meals[m.id] = []); touch(p); }
    });
    render();
  }, 6000);
}
function copyPrevWeek(){
  const start = weekStartOf(state.menuDate);
  copyDays(weekDates(start).map(d => [addDays(d, -7), d]), 'com a semana passada');
}
function repeatWeekToMonthEnd(){
  const start = weekStartOf(state.menuDate), src = weekDates(start);
  const end = dStr(new Date(parseDate(addDays(start, 6)).getFullYear(), parseDate(addDays(start, 6)).getMonth() + 1, 0));
  const pairs = [];
  for(let d = addDays(start, 7); d <= end; d = addDays(d, 1)) pairs.push([src[wdIdx(d)], d]);
  if(!pairs.length){ toast('Essa já é a última semana do mês.'); return; }
  copyDays(pairs, 'até o fim do mês');
}

/* =========================================================
   IMPORTAR RECEITA (foto, print ou texto colado) — grátis
   ========================================================= */
/* peso de 1 xícara (g); colher de sopa = 1/16, colher de chá = 1/48 */
const CUP_GRAMS = [
  ['farinha de trigo',120],['farinha',120],['trigo',120],['fuba',120],['amido',150],['maisena',150],['maizena',150],['polvilho',150],['goma',150],
  ['acucar mascavo',150],['acucar',180],['arroz',185],['aveia',80],['cacau',90],['chocolate em po',90],['achocolatado',90],['leite em po',100],
  ['coco ralado',80],['queijo ralado',100],['parmesao',100],['feijao',170],['lentilha',190],['grao de bico',200],['manteiga',200],['margarina',200],
  ['mel',340],['oleo',220],['azeite',220],['granola',110],['castanha',140],['amendoim',145],['uva passa',150],['fermento',190],['sal',270],
];
function measureGrams(name, unit){
  if(unit === 'un') return defaultUnitWeight(name);
  if(!['xic','cs','cc'].includes(unit)) return null;
  const words = norm(name).replace(/[,()/]/g, ' ').split(/\s+/);
  let cup = 240;
  for(const [k, g] of CUP_GRAMS){ if(k.split(' ').filter(x => x !== 'de' && x !== 'em').every(w => words.some(x => x.startsWith(w)))){ cup = g; break; } }
  return round2(unit === 'xic' ? cup : unit === 'cs' ? cup / 16 : cup / 48);
}

const NUM_WORDS = { um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, meio: 0.5, meia: 0.5 };
const FRAC = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1/3, '⅔': 2/3, '⅛': 0.125 };
const UNIT_PATTERNS = [ // [regex sem acento, unidade, gramas por unidade (opcional)]
  [/^(kg|quilos?|kilos?)\b/, 'kg'], [/^(g|gr|grs|gramas?)\b/, 'g'], [/^(ml|mililitros?)\b/, 'ml'], [/^(l|lt|litros?)\b/, 'L'],
  [/^(xicaras?|xic\.?|xc\.?)( \(?cha\)?)?\b/, 'xic'], [/^(copos?( americanos?)?)\b/, 'xic', 200],
  [/^(colher(es)?|c\.?)( de)? (sopa|s\.?)\b/, 'cs'], [/^(cs|csp)\b/, 'cs'],
  [/^(colher(es)?|c\.?)( de)? (cha|c\.?|cafe)\b/, 'cc'], [/^(cc|cch)\b/, 'cc'], [/^colher(es)?\b/, 'cs'],
  [/^(latas?)\b/, 'un', 395], [/^(caixinhas?|caixas?)\b/, 'un', 200], [/^(pacotes?)\b/, 'un', 500], [/^(sache|saches|envelopes?)\b/, 'un', 10],
  [/^(fatias?)\b/, 'un', 20], [/^(dentes?)\b/, 'un', 5], [/^(pitadas?)\b/, 'g', null, 1], [/^(unidades?|un|und|unid)\b/, 'un'],
  [/^(ramos?|maços?|macos?)\b/, 'un', 30], [/^(filés?|files?)\b/, 'un', 120], [/^(postas?)\b/, 'un', 150], [/^(potes?)\b/, 'un', 170],
];
const ING_STOP = new Set(['de','da','do','das','dos','com','sem','em','a','o','e','picado','picada','picados','picadas','ralado','ralada','ralados','fatiado','fatiada',
  'cubos','cubinhos','pedacos','bem','maduro','madura','maduras','maduros','medio','media','medios','medias','grande','grandes','pequeno','pequena','pequenos','pequenas',
  'fresco','fresca','gosto','opcional','aproximadamente','aprox','cozido','cozida','cozidos','cozidas','cru','crua','temperado','temperada','moido','moida','morno','morna',
  'quente','frio','fria','gelado','gelada','derretido','derretida','peneirado','peneirada','lavado','lavada','sem pele','tipo','para','pra','untar','polvilhar','servir','decorar']);
const ING_ALIAS = { maizena: 'amido milho', maisena: 'amido milho', oleo: 'oleo soja', 'leite': 'leite vaca integral', acucar: 'acucar refinado', frango: 'frango peito cru',
  'peito de frango': 'frango peito cru', 'carne moida': 'carne bovina patinho cru', ovo: 'ovo galinha inteiro cru', ovos: 'ovo galinha inteiro cru', 'creme de leite': 'creme leite',
  'leite condensado': 'leite condensado', 'queijo mussarela': 'queijo mozarela', mussarela: 'queijo mozarela', mucarela: 'queijo mozarela', 'farinha de trigo': 'farinha trigo',
  tomate: 'tomate com semente', cebola: 'cebola crua', alho: 'alho cru', batata: 'batata inglesa crua', cenoura: 'cenoura crua', manteiga: 'manteiga com sal',
  'fermento em po': 'fermento po', fermento: 'fermento po', 'aveia': 'aveia flocos', banana: 'banana prata', 'arroz': 'arroz tipo 1 cru', feijao: 'feijao carioca cru',
  'oleo de coco': 'oleo coco', sal: 'sal refinado', 'sal e pimenta': 'sal refinado', agua: 'agua', canela: 'canela po', mel: 'mel abelha', 'peito de frango em cubos': 'frango peito sem pele cru' };

function parseQtyPrefix(t){
  let s = t.trim(), qty = null, m;
  s = s.replace(/^(\d+)\s*([½¼¾⅓⅔⅛])/, (_, a, b) => String(Number(a) + FRAC[b]));
  if((m = s.match(/^(\d+)\s+(\d+)\/(\d+)\b/))){ qty = Number(m[1]) + Number(m[2]) / Number(m[3]); s = s.slice(m[0].length); }
  else if((m = s.match(/^(\d+)\/(\d+)\b/))){ qty = Number(m[1]) / Number(m[2]); s = s.slice(m[0].length); }
  else if((m = s.match(/^(\d+(?:[.,]\d+)?)/))){ qty = parseNum(m[1]); s = s.slice(m[0].length); }
  else if(FRAC[s[0]]){ qty = FRAC[s[0]]; s = s.slice(1); }
  else if((m = norm(s).match(/^(um|uma|dois|duas|tres|quatro|cinco|seis|meio|meia)\b/))){ qty = NUM_WORDS[m[1]]; s = s.slice(m[0].length); }
  s = s.replace(/^\s*(e\s+)?(meia|meio)\b/i, () => { qty = (qty || 0) + 0.5; return ''; });
  return { qty, rest: s.trim() };
}
function parseIngLine(line){
  line = line.replace(/\(\s*(ch[aá]|sopa|caf[eé]|sobremesa)\s*\)/ig, '$1');
  let { qty, rest } = parseQtyPrefix(line);
  let unit = null, gPerUnit = null, n = norm(rest);
  for(const [re, u, gpu, fixedQty] of UNIT_PATTERNS){
    const m = n.match(re);
    if(m){ unit = u; gPerUnit = gpu || null; rest = rest.slice(m[0].length); if(fixedQty) qty = (qty || 1) * fixedQty; break; }
  }
  rest = rest.replace(/^\s*(\(.*?\)\s*)?(de|da|do)\s+/i, '').replace(/\s+/g, ' ').trim();
  const aGosto = /a gosto|q\.?b\.?|quanto baste/i.test(rest);
  let name = rest.replace(/\(.*?\)/g, '').replace(/\b(a gosto|q\.?b\.?|quanto baste)\b/ig, '').split(/\s+(?:para|pra)\s+/i)[0].replace(/[,;.\-–]+\s*$/, '').trim();
  if(!unit) unit = qty === null ? 'g' : 'un';
  if(qty === null) qty = aGosto ? 0 : (unit === 'un' ? 1 : 0);
  if(unit === 'un' && gPerUnit === 395 && /creme de leite/i.test(norm(name))) gPerUnit = 300;
  if(unit === 'un' && !gPerUnit) gPerUnit = defaultUnitWeight(name);
  if(['xic','cs','cc'].includes(unit) && !gPerUnit) gPerUnit = measureGrams(name, unit);
  return { name: cap(name), qty: round3(qty), unit, gPerUnit };
}

/* acha o alimento da tabela que mais combina com o nome do ingrediente */
function learnedFoods(){
  const m = new Map();
  liveRecipes().forEach(r => r.ingredients.forEach(i => { if(i.foodId && i.srcName) m.set(norm(i.srcName), i.foodId); }));
  return m;
}
function matchFood(name, learned){
  const key = norm(name);
  if(learned && learned.has(key)){ const f = findFood(learned.get(key)); if(f) return f; }
  const mineExact = liveFoods().find(f => norm(f.name) === key); if(mineExact) return mineExact;
  const keyCore = key.split(/\s+/).filter(w => !ING_STOP.has(w)).join(' ');
  const aliasKey = Object.keys(ING_ALIAS).find(a => key === a || keyCore === a);
  let words = (aliasKey ? ING_ALIAS[aliasKey] : key).replace(/[,()/]/g, ' ').split(/\s+/).filter(w => w && !ING_STOP.has(w) && !/^\d/.test(w));
  if(!words.length || !TACO) return null;
  const sing = w => w.length > 4 && w.endsWith('s') ? w.slice(0, -1) : w;
  const pool = [...liveFoods().map(f => ({ ...f, n: norm(f.name), mine: true })), ...TACO];
  let best = null, bestScore = 0;
  for(const f of pool){
    const fw = f.n.replace(/[,()/]/g, ' ').split(/\s+/).filter(Boolean);
    const has = w => fw.some(x => sing(x) === sing(w) || (sing(w).length >= 4 && x.startsWith(sing(w))));
    if(!has(words[0])) continue;
    let score = 10;
    words.slice(1).forEach(w => { if(has(w)) score += 3; });
    score -= fw.length * 0.25;
    if(/\bcru|crua\b/.test(f.n)) score += 1.5;
    if(/sem pele/.test(f.n)) score += 0.5;
    if(/\b(cozid|frit|assad|grelhad|refogad|ensopad|doce|pudim|mingau|bolo|torta)/.test(f.n) && !words.some(w => /cozid|frit|assad|grelhad|refogad/.test(w))) score -= 2.5;
    score += Math.max(0, 3 - popRank(f.n) * 0.2);
    if(f.mine) score += 2;
    if(score > bestScore){ bestScore = score; best = f; }
  }
  return best;
}

/* separa título, rendimento, ingredientes e modo de preparo */
const HDR_ING = /^\s*(ingredientes?|lista de ingredientes|vai precisar|voce vai precisar)\b\s*:?/;
const HDR_PREP = /^\s*(modo de (preparo|fazer)|preparo|como fazer|instrucoes|passo a passo|montagem|cobertura|calda|recheio|massa)\b\s*:?/;
function looksLikeIngredient(line){
  const n = norm(line);
  if(/^\d+\s*[.)º°-]\s+[a-z]/.test(n) && n.split(' ').length > 7) return false; // passo numerado
  return /^([\d½¼¾⅓⅔⅛]|(um|uma|dois|duas|tres|meia|meio)\s)/.test(n) || /\b(xicaras?|colher(es)?|gramas?|kg|ml|litros?|latas?|a gosto|pitada|dentes?|caixinha)\b/.test(n);
}
function parseRecipeText(text){
  const raw = String(text || '').split(/\r?\n/).map(l => l.replace(/^\s*(?:[-–—•*·>+»«°]|\[\s*[xX]?\s*\]|[☐☑✓✔□■●○]|[eoa©®](?=\s+[\d½¼¾]))\s*/i, '').trim());
  const lines = raw.filter(Boolean);
  let title = '', portions = null, mode = 'auto';
  const ings = [], prep = [];
  lines.forEach((l, idx) => {
    const n = norm(l);
    const pm = n.match(/\b(rende|serve|rendimento|porcoes|porcao|pedacos|fatias)\b\D{0,20}(\d+)/) || n.match(/(\d+)\s*(porcoes|pessoas|pedacos|fatias|unidades)\b/);
    if(pm && n.length < 60){ portions = Number(pm[2] && /\d/.test(pm[2]) ? pm[2] : pm[1]); return; }
    if(HDR_ING.test(n)){ mode = 'ing'; const rest = l.replace(/^[^:]*:\s*/, ''); if(rest && rest !== l && looksLikeIngredient(rest)) ings.push(rest); return; }
    if(HDR_PREP.test(n) && n.length < 40){ mode = 'prep'; return; }
    if(!title && idx === 0 && !looksLikeIngredient(l) && l.length < 70){ title = l.replace(/[:.]$/, ''); return; }
    if(mode === 'ing') { if(looksLikeIngredient(l) || l.split(' ').length <= 6) ings.push(l); else { mode = 'prep'; prep.push(l); } }
    else if(mode === 'prep') prep.push(l);
    else (looksLikeIngredient(l) ? ings : prep).push(l);
  });
  return { title: cap(title), portions, ings: ings.map(parseIngLine).filter(i => i.name && (i.name.match(/[a-zà-ÿ]/gi) || []).length >= 2), prep: prep.join('\n') };
}

/* =========================================================
   NOTA DO MERCADO (cupom fiscal / NFC-e) → lista já comprada
   ========================================================= */
const RC_SKIP = /\b(total|subtotal|sub-total|desconto|acrescimo|troco|dinheiro|cartao|credito|debito|pix|valor|pago|pagar|tributos|imposto|icms|cnpj|cpf|ie:|i\.e\.|inscricao|lei\s*\d|consumidor|protocolo|chave|serie|emissao|autorizacao|nfc-?e|danfe|documento|qtd\.?\s*total|itens|forma de pagamento|operador|caixa:|via\s|consulte|www\.|http|sefaz|fone|tel[:.]|cep|rua|av\.|avenida)\b/;
const RC_UNIT = { un: 'un', und: 'un', unid: 'un', pc: 'un', pç: 'un', kg: 'kg', g: 'g', gr: 'g', l: 'L', lt: 'L', ml: 'ml', pct: 'pct', pt: 'pct', cx: 'cx', fd: 'cx', dz: 'dz' };
const rcNum = s => parseNum(String(s).replace(/\s/g, ''));
function rcUnit(u){ return RC_UNIT[norm(u || '').replace('.', '')] || 'un'; }
function rcCleanName(s){
  return String(s || '')
    .replace(/^\s*\d{1,3}\s+/, '')            // nº do item
    .replace(/^\s*\d{4,14}\s+/, '')           // código / EAN
    .replace(/\(\s*c[óo]digo:?[^)]*\)/ig, '')
    .replace(/\s+\d{4,14}\s*$/, '')
    .replace(/(\d)O(ML|G|KG|L)\b/g, '$1$2').replace(/[|_*#]+/g, ' ').replace(/\s+(kg|un|und|unid)\.?\s*$/i, '').replace(/\s+/g, ' ').trim();
}

/* formato do site da Sefaz (ao abrir o QR code): "NOME (Código: 123) Qtde.:1 UN: UN Vl. Unit.: 5,49 Vl. Total 5,49" */
function parsePortalItems(text){
  const flat = text.replace(/[ \t]+/g, ' ');
  const re = /\(\s*C[óo]d(?:igo)?\.?:?\s*[\w.-]*\s*\)\s*Qtde\.?\s*:?\s*([\d.,]+)\s*UN\s*:?\s*([A-Za-z.]+)\s*Vl\.?\s*Unit\.?\s*:?\s*([\d.,]+)\s*Vl\.?\s*Total\s*:?\s*([\d.,]+)/gi;
  const out = []; let m, last = 0;
  while((m = re.exec(flat))){
    let name = flat.slice(last, m.index).trim();
    const cut = name.split(/(?:Vl\.?\s*Total\s*[\d.,]+|Descri[çc][ãa]o|Valor)\s*/i); name = cut[cut.length - 1];
    const nl = name.split(/\n/).map(x => x.trim()).filter(Boolean); name = nl.length ? nl[nl.length - 1] : name;
    out.push({ name: rcCleanName(name.replace(/\s+/g, ' ')), qty: rcNum(m[1]), unit: rcUnit(m[2]), unitPrice: rcNum(m[3]), total: rcNum(m[4]) });
    last = m.index + m[0].length;
  }
  return out;
}

/* formato do cupom impresso: "001 789... ARROZ TIO JOAO 5KG 1 UN X 24,90 24,90" (às vezes em 2 linhas) */
const RC_QTY = /(\d+(?:[.,]\d{1,3})?)\s*(UN|UND|UNID|PC|PÇ|KG|G|GR|L|LT|ML|PCT|PT|CX|FD|DZ)?\.?\s*[xX×*]\s*(?:R\$\s*)?(\d+[.,]\s?\d{2,3})(?:\s*=)?\s*(?:[A-Z]{1,2}\d{0,2}\s+)?(?:R\$\s*)?(\d+[.,]\s?\d{2})?\s*[A-Z]?\d{0,2}\s*$/i;
function parseCupomItems(text){
  const raw = text.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean), lines = [];
  raw.forEach(l => {
    const prev = lines[lines.length - 1];
    const onlyPrices = /^(?:R\$\s*)?\d+[.,]\s?\d{2,3}(?:\s+(?:R\$\s*)?\d+[.,]\s?\d{2})?\s*[A-Z]?\d{0,2}$/i.test(l);
    if(prev && (onlyPrices && /\d/.test(prev) && /[xX×*]\s*(?:R\$\s*)?(\d+[.,]\s?\d{2,3})?\s*$/.test(prev) || /\b[xX×*]$/.test(prev))) lines[lines.length - 1] = prev + ' ' + l;
    else lines.push(l);
  });
  const out = []; let pending = '';
  for(const line of lines){
    const n = norm(line);
    if(/^(desconto|desc\.?)\b/.test(n)){
      const v = (line.match(/(\d+[.,]\d{2})/) || [])[1];
      if(v && out.length) out[out.length - 1].discount = (out[out.length - 1].discount || 0) + rcNum(v);
      continue;
    }
    const m = line.match(RC_QTY);
    if(m){
      let desc = rcCleanName(line.slice(0, m.index));
      if((desc.match(/[A-Za-zÀ-ÿ]/g) || []).length < 3) desc = pending;
      pending = '';
      if((desc.match(/[A-Za-zÀ-ÿ]/g) || []).length < 3 || RC_SKIP.test(norm(desc))) continue;
      const qty = rcNum(m[1]), unitPrice = rcNum(m[3]);
      const total = m[4] ? rcNum(m[4]) : round2(qty * unitPrice);
      out.push({ name: desc, qty, unit: rcUnit(m[2]), unitPrice, total });
      continue;
    }
    // linha só com descrição (o preço vem na linha de baixo)
    const letters = (line.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if(letters >= 3 && !RC_SKIP.test(n) && /^\d{1,3}\s+\S/.test(line)) { pending = rcCleanName(line); continue; }
    // "ARROZ 5KG ..... 24,90" (sem quantidade)
    const s = line.match(/^(?:\d{1,3}\s+)?(?:\d{4,14}\s+)?(.*[A-Za-zÀ-ÿ].*?)\s+(?:R\$\s*)?(\d+[.,]\d{2})\s*[A-Z]?\d{0,2}$/);
    if(s && letters >= 4 && !RC_SKIP.test(n) && pending === '' && /^\d{1,3}\s/.test(line)){
      out.push({ name: rcCleanName(s[1]), qty: 1, unit: 'un', unitPrice: rcNum(s[2]), total: rcNum(s[2]) });
      continue;
    }
    if(letters >= 3 && !RC_SKIP.test(n) && !/\d{2}\/\d{2}\/\d{2,4}/.test(line)) pending = rcCleanName(line); else pending = '';
  }
  return out;
}

function parseReceipt(text){
  const t = String(text || '');
  let items = parsePortalItems(t);
  const portal = items.length > 0;
  if(!portal) items = parseCupomItems(t);
  items = items.filter(i => i.name && i.qty > 0 && (i.unitPrice > 0 || i.total > 0)).map(i => {
    if(!(i.unitPrice > 0)) i.unitPrice = round2(i.total / i.qty);
    if(!(i.total > 0)) i.total = round2(i.qty * i.unitPrice);
    if(i.discount) i.total = round2(i.total - i.discount);
    return i;
  });
  const flat = t.replace(/\s+/g, ' ');
  let total = null, m;
  const tre = /(valor\s+a\s+pagar|valor\s+total|total\s+r\$|total\s+a\s+pagar|total)\s*(?:r\$)?\s*:?\s*(\d{1,5}[.,]\d{2})/gi;
  while((m = tre.exec(flat))){ if(/vl\.?\s*$/i.test(flat.slice(Math.max(0, m.index - 5), m.index))) continue; if(!/tributos|desconto|imposto/i.test(flat.slice(Math.max(0, m.index - 14), m.index + m[1].length))) { total = rcNum(m[2]); if(/pagar|valor total/i.test(m[1])) break; } }
  const dm = flat.match(/(\d{2})\/(\d{2})\/(\d{4})/) || flat.match(/(\d{2})\/(\d{2})\/(\d{2})\b/);
  let date = null;
  if(dm){ const y = dm[3].length === 2 ? '20' + dm[3] : dm[3]; const cand = `${y}-${dm[2]}-${dm[1]}`; if(/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(cand) && cand <= todayStr()) date = cand; }
  const firstLines = t.split(/\r?\n/).map(l => l.trim()).filter(Boolean).slice(0, 6);
  const marketLine = firstLines.find(l => (l.match(/[A-Za-zÀ-ÿ]/g) || []).length >= 5 && !/cnpj|cpf|documento|danfe|nfc|consulta|auxiliar|sefaz|fazenda|secretaria|governo/i.test(norm(l)));
  const market = marketLine ? cap(marketLine.replace(/\b(ltda|me|epp|eireli|s\.?\/?a\.?)\b\.?/ig, '').replace(/[-–,.]+\s*$/, '').trim().toLowerCase()).replace(/(^|\s)(\S)/g, (a, b, c) => b + c.toUpperCase()).slice(0, 40) : '';
  return { items, total, date, market, portal };
}

function receiptItemToListItem(i){
  const sp = splitBrandAndPack(i.name, knownBrandsFromHistory());
  const nm = sp.name || cap(i.name.toLowerCase());
  const h = buildHistory().get(norm(nm));
  const unit = UNITS.includes(i.unit) ? i.unit : 'un';
  const qty = round3(i.qty), unitPrice = i.discount ? round2(i.total / i.qty) : round2(i.unitPrice);
  return { id: uid('i'), name: h ? h.name : nm, brand: sp.brand || '', pack: sp.pack || '', category: h ? h.category : guessCategory(nm),
    qty, unit, unitPrice, bought: true, priority: h ? (h.priority || 'normal') : 'normal' };
}

/* --- QR code da nota (NFC-e) --- */
function loadJsQR(){
  return new Promise((res, rej) => {
    if(window.jsQR) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('jsqr'));
    document.head.appendChild(s);
  });
}
async function findQrUrl(src){
  try{
    if('BarcodeDetector' in window){
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      const r = await det.detect(src);
      const v = r.map(x => x.rawValue).find(v => /^https?:\/\//i.test(v)); if(v) return v;
    }
  }catch(e){}
  try{
    await loadJsQR();
    for(const max of [1400, 900, 2200]){
      const s = Math.min(1, max / Math.max(src.width, src.height));
      const c = document.createElement('canvas'); c.width = Math.round(src.width * s); c.height = Math.round(src.height * s);
      const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0, c.width, c.height);
      const img = ctx.getImageData(0, 0, c.width, c.height);
      const code = window.jsQR(img.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if(code && /^https?:\/\//i.test(code.data)) return code.data;
    }
  }catch(e){}
  return null;
}
