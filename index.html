/* =========================================================
   SINCRONIZAÇÃO (mescla por lista — um celular não apaga o outro)
   ========================================================= */
function mergeLists(local, cloud){
  const m = new Map();
  cloud.forEach(l => m.set(l.id, l));
  local.forEach(l => {
    const c = m.get(l.id);
    if(!c || (l.updatedAt||0) > (c.updatedAt||0)) m.set(l.id, l);
  });
  const cutoff = Date.now() - 30*864e5; // lixeira some depois de 30 dias
  return [...m.values()].filter(l => !(l.deleted && (l.updatedAt||0) < cutoff));
}
const sig = lists => JSON.stringify(lists.slice().sort((a,b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0));

async function ensureCloudBackup(client, cloudRaw){
  try{ if(localStorage.getItem(LS_CLOUD_BACKUP_DONE)) return; }catch(e){ return; }
  try{
    if(Array.isArray(cloudRaw) && cloudRaw.length){
      const { data, error } = await client.from(TABLE).select('chave').eq('chave', CLOUD_BACKUP_KEY).maybeSingle();
      if(error) throw error;
      if(!data){
        const r = await client.from(TABLE).insert({ chave: CLOUD_BACKUP_KEY, dados: cloudRaw, updated_at: new Date().toISOString() });
        if(r.error) throw r.error;
      }
    }
    localStorage.setItem(LS_CLOUD_BACKUP_DONE, '1');
  }catch(e){ console.warn('Backup na nuvem não foi feito:', e); }
}

let syncing = false, syncAgain = false;
async function syncNow(){
  const client = getSb();
  if(!client || !navigator.onLine && navigator.onLine !== undefined){ setSync('off'); return; }
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  setSync('syncing');
  const startEdits = editCount;
  let failed = false, changed = false;
  try{
    const { data, error } = await client.from(TABLE).select('chave,dados').in('chave', COLLS.map(c => c.key));
    if(error) throw error;
    const rows = {}; (data || []).forEach(r => { rows[r.chave] = r.dados; });
    const dirty = isDirty();
    for(const c of COLLS){
      try{
        const cloudRaw = rows[c.key] === undefined ? null : rows[c.key];
        if(c.key === CLOUD_KEY) await ensureCloudBackup(client, cloudRaw);
        const merged = mergeLists(state[c.field], c.normalize(cloudRaw));
        const differs = sig(merged) !== sig(Array.isArray(cloudRaw) ? cloudRaw : []);
        if((differs || dirty) && !(merged.length === 0 && cloudRaw === null)){
          const r = await client.from(TABLE).upsert({ chave: c.key, dados: merged, updated_at: new Date().toISOString() });
          if(r.error) throw r.error;
        }
        const before = sig(state[c.field]);
        state[c.field] = mergeLists(state[c.field], merged); // não perde o que foi digitado durante o envio
        if(sig(state[c.field]) !== before) changed = true;
      }catch(e){ console.warn('Sync falhou em', c.key, e); failed = true; }
    }
    saveLocal();
    if(editCount === startEdits && !failed) setDirty(false); else if(editCount !== startEdits) syncAgain = true;
    setSync(failed ? 'off' : 'ok');
    if(changed) safeRender();
  }catch(e){
    console.warn('Sync falhou:', e);
    setSync('off');
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; setTimeout(syncNow, 300); }
  }
}

  return `<div class="sync-badge ${s}" id="sync-badge">${txt}</div>`;

/* =========================================================

   ========================================================= */
function buildHistory(){
  const map = new Map();
  const lists = liveLists().slice().sort((a,b) => -byRecent(a,b)); // da mais antiga pra mais nova
  for(const l of lists){
    const seen = new Set();
    for(const it of l.items){
      const k = norm(it.name); if(!k) continue;
      let h = map.get(k);
      if(!h){ h = { key:k, count:0, unitPrice:null }; map.set(k, h); }
      h.name = it.name; h.category = it.category; h.unit = it.unit; h.priority = it.priority; h.brand = it.brand || ''; h.pack = it.pack || '';
      if(it.unitPrice !== null) h.unitPrice = it.unitPrice;
      if(!seen.has(k)){ h.count++; seen.add(k); }
    }
  }
  return map;
}

function openList(id){
  state.activeId = id; state.screen = 'list'; state.quick = ''; state.listSearch = '';
  render(); window.scrollTo(0,0);
}
function goHome(){
  const l = active();
  if(l && !l.items.length && !l.name && !l.market && !parseNum(l.meta)){ l.deleted = true; touch(l); } // lista vazia esquecida some
  state.screen = 'home'; state.activeId = null; state.quick = '';
  render(); window.scrollTo(0,0);
}
function createNewList(items){
  const l = { id: uid('l'), date: todayStr(), name: '', market: '', meta: '', status: 'open', updatedAt: 0, deleted: false, items };
  state.lists.push(l);
  touch(l);
  openList(l.id);
}
function deleteList(id){
  const l = getList(id); if(!l) return;
  l.deleted = true; touch(l);
  if(state.activeId === id){ state.screen = 'home'; state.activeId = null; }
  render();
  toast(`"${listTitle(l)}" apagada`, 'Desfazer', () => { l.deleted = false; touch(l); render(); });
}

function buildItemFromName(name, qty, unit){
  const h = buildHistory().get(norm(name));
  return {
    id: uid('i'),
    name: h ? h.name : cap(name),
    category: h ? h.category : guessCategory(name),
    qty: qty > 0 ? qty : 1,
    unit: unit || (h ? h.unit : 'un'),
    unitPrice: h ? h.unitPrice : null,
    bought: false,
    priority: h ? (h.priority || 'normal') : 'normal',
    brand: h ? (h.brand || '') : '',
    pack: h ? (h.pack || '') : '',
  };
}
function addItemToActive(item, quiet){ return addItemToList(active(), item, quiet); }
function addItemToList(l, item, quiet){
  if(!l) return;
  const ex = l.items.find(i => !i.bought && norm(i.name) === norm(item.name) && i.unit === item.unit && norm(i.brand) === norm(item.brand));
  if(ex){
    ex.qty = round3((Number(ex.qty)||0) + (Number(item.qty)||1));
    touch(l); refreshListParts();
    if(!quiet) toast(`Somei ao "${ex.name}" (agora ${fmtQty(ex.qty)} ${ex.unit})`);
    return;
  }
  l.items.push(item);
  if(l.status !== 'open') l.status = 'open';
  touch(l); refreshListParts();
  if(!quiet) toast(`"${item.name}" adicionado`, 'Desfazer', () => removeItem(item.id, true), 3000);
}
function addQuick(){
  const raw = state.quick.trim(); if(!raw) return;
  const p = parseQuick(raw); if(!p.name) return;
  addItemToActive(buildItemFromName(p.name, p.qty, p.unit));
  state.quick = '';
  const inp = document.getElementById('quick-input');
  if(inp){ inp.value = ''; inp.focus(); }
  renderSugg();
}
function addFromHistory(key){
  const h = buildHistory().get(key); if(!h) return;
  const p = parseQuick(state.quick);
  const item = buildItemFromName(h.name, p.qty, p.unit);
  addItemToActive(item);
  if(state.quick){
    state.quick = '';
    const inp = document.getElementById('quick-input'); if(inp){ inp.value = ''; inp.focus(); }
    renderSugg();
  }
}
function removeItem(id, silent){
  const l = active(); if(!l) return;
  const idx = l.items.findIndex(i => i.id === id); if(idx < 0) return;
  const [it] = l.items.splice(idx, 1);
  touch(l); refreshListParts();
  if(!silent) toast(`"${it.name}" removido`, 'Desfazer', () => { l.items.splice(idx, 0, it); touch(l); refreshListParts(); });
}
function toggleItem(id){
  const l = active(); const it = l && l.items.find(i => i.id === id); if(!it) return;
  it.bought = !it.bought;
  touch(l); refreshListParts();
  if(it.bought && it.unitPrice === null) openPriceSheet(id, true);
}
function finishList(){
  const l = active(); if(!l) return;
  const left = l.items.filter(i=>!i.bought).length;
  l.status = 'done'; touch(l);
  state.screen = 'home'; state.activeId = null; render(); window.scrollTo(0,0);
  toast(left ? `Compra concluída 🎉 ${left} ${left>1?'itens ficaram':'item ficou'} de fora` : 'Compra concluída 🎉', null, null, 4000);
}

/* --- importar lista do papel (texto copiado da foto ou digitado) --- */
function parseImport(text){
  let lines = String(text||'').split(/\r?\n/);
  if(lines.filter(l => l.trim()).length === 1) lines = lines[0].split(/[,;]/);
  const out = [];
  lines.forEach(line => {
    let t = line.replace(/^\s*(?:[-–—•*·>+]|\[\s*[xX]?\s*\]|[☐☑✓✔□■●○]|\d{1,2}\s*[.)-](?=\s))\s*/, '').replace(/\s+/g,' ').trim();
    if((t.match(/[A-Za-zÀ-ÿ]/g) || []).length < 2) return;
    if(/^(lista( de compras)?|compras|mercado|feira|supermercado)\s*:?$/.test(norm(t))) return;
    const p = parseQuick(t);
    if(!p.name || (p.name.match(/[A-Za-zÀ-ÿ]/g) || []).length < 2) return;
    out.push(buildItemFromName(p.name, p.qty, p.unit));
  });
  return out;
}

   LEITURA DE ETIQUETA (foto → texto, no próprio celular)
   ========================================================= */
function loadTesseract(){
  return new Promise((res, rej) => {
    if(window.Tesseract) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function loadBitmap(file){
  try{ return await createImageBitmap(file); }
  catch(e){ return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
}
function boxBlurGray(g, w, h, r){
  if(r < 1) return g;
  const tmp = new Float32Array(w*h), out = new Float32Array(w*h), k = 2*r+1;
  for(let y=0; y<h; y++){ let acc = 0; const row = y*w;
    for(let x=-r; x<=r; x++) acc += g[row + Math.min(w-1, Math.max(0, x))];
    for(let x=0; x<w; x++){ tmp[row+x] = acc/k; acc += g[row + Math.min(w-1, x+r+1)] - g[row + Math.max(0, x-r)]; } }
  for(let x=0; x<w; x++){ let acc = 0;
    for(let y=-r; y<=r; y++) acc += tmp[Math.min(h-1, Math.max(0, y))*w + x];
    for(let y=0; y<h; y++){ out[y*w+x] = acc/k; acc += tmp[Math.min(h-1, y+r+1)*w + x] - tmp[Math.max(0, y-r)*w + x]; } }
  return out;
}
async function prepImage(src, blur, tall, keep){
  const w0 = src.width, h0 = src.height, big = Math.max(w0, h0);
  // nota fiscal é comprida: escala pela largura pra letra não ficar pequena demais
  const s = keep ? 1 : tall && h0 > w0 * 1.6 ? Math.min(1400 / w0, 4200 / h0) : (big < 1000 ? 1000/big : Math.min(1, 1700/big));
  const w = Math.round(w0*s), h = Math.round(h0*s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(src, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  let g = new Float32Array(w*h);
  for(let i=0, j=0; i<d.length; i+=4, j++) g[j] = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
  if(blur) g = boxBlurGray(g, w, h, Math.max(1, Math.round(Math.max(w, h) / 1100)));
  const hist = new Uint32Array(256); for(let j=0; j<g.length; j++) hist[g[j] | 0]++;
  const total = w*h; let acc = 0, lo = 0, hi = 255;
  for(let v=0; v<256; v++){ acc += hist[v]; if(acc > total*0.02){ lo = v; break; } }
  acc = 0; for(let v=255; v>=0; v--){ acc += hist[v]; if(acc > total*0.02){ hi = v; break; } }
  const range = Math.max(1, hi - lo);
  for(let i=0, j=0; i<d.length; i+=4, j++){ let y = (g[j]-lo)*255/range; y = y<0 ? 0 : y>255 ? 255 : y; d[i] = d[i+1] = d[i+2] = y; }
  ctx.putImageData(img, 0, 0);
  return c;
}
function extractPrices(text){
  const found = [];
  const t = text.replace(/[Oo](?=\d)/g,'0');
  let m;
  const re = /(R\s?\$\s*)?(\d{1,4})\s?[.,]\s?(\d{2})(?!\d)/g;
  while((m = re.exec(t))){ const v = parseFloat(m[2]+'.'+m[3]); if(v > 0 && v < 10000) found.push({ v, rs: !!m[1] }); }
  const re2 = /R\s?\$\s*(\d{1,3})\s+(\d{2})(?!\d)/g;   // "R$ 9 99" (centavos pequenos)
  while((m = re2.exec(t))){ found.push({ v: parseFloat(m[1]+'.'+m[2]), rs: true }); }
  const uniq = [];
  found.sort((a,b) => (b.rs - a.rs) || b.v - a.v).forEach(f => { if(!uniq.includes(f.v)) uniq.push(f.v); });
  return uniq.slice(0, 4);
}
function extractNames(text){
  const STOP = /\b(preco|precos|oferta|promocao|promo|codigo|cod|validade|ean|unitario|total|valido|ate|de:|por:|cada|leve|pague|r\$)\b/;
  const out = [];
  text.split('\n').forEach(line => {
    let l = line.replace(/R\s?\$\s*[\d.,\s]+/g,' ').replace(/\d{4,}/g,' ').replace(/[^A-Za-zÀ-ÿ0-9\s.,/-]/g,' ').replace(/\s+/g,' ').trim();
    const letters = (l.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    if(letters < 3 || letters / Math.max(1, l.length) < 0.55) return;
    if(STOP.test(norm(l)) && letters < 12) return;
    l = cap(l.toLowerCase()).slice(0, 40);
    if(!out.some(o => norm(o) === norm(l))) out.push(l);
  });
  return out.sort((a,b) => b.length - a.length).slice(0, 4);
}
/* --- leitor de produtos: acha preço, nome, marca e peso pela posição das palavras --- */
const KNOWN_BRANDS = ['Friato','Avenorte','Sadia','Perdigão','Seara','Aurora','Swift','Friboi','Copacol','Frimesa','Italac','Piracanjuba','Parmalat','Nestlé','Ninho','Itambé','Elegê','Tirolez','Vigor','Danone','Batavo','Président','Polenghi','Qualy','Doriana','Tio João','Camil','Kicaldo','Prato Fino','Namorado','Broto Legal','União','Caravelas','Da Barra','Liza','Soya','Salada','Gallo','Andorinha','Pilão','Melitta','3 Corações','Santa Clara','Café do Ponto','Toddy','Nescau','Dona Benta','Renata','Adria','Barilla','Galo','Vitarella','Piraquê','Marilan','Bauducco','Mabel','Fortaleza','Heinz','Hellmann\'s','Quero','Elefante','Fugini','Knorr','Maggi','Sazón','Kitano','Gomes da Costa','Coqueiro','Pomarola','Coca-Cola','Guaraná Antarctica','Pepsi','Fanta','Sprite','Del Valle','Maguary','Skol','Brahma','Heineken','Ypê','Omo','Brilhante','Ariel','Tixan','Comfort','Downy','Minuano','Limpol','Veja','Pinho Sol','Qboa','Bombril','Scott','Neve','Personal','Dove','Lux','Palmolive','Protex','Colgate','Oral-B','Sorriso','Close Up','Rexona','Nivea','Seda','Pantene','Elseve','Pampers','Huggies','MamyPoko','Always','Intimus','Kotex','Wickbold','Pullman','Plus Vita','Visconti','Lacta','Garoto','Arcor','Trakinas','Oreo','Bis','Kinder','Sadia Hot Pocket','Mezzani','Yoki','Kodilar','Qualitá','Great Value'];

function wordsToLines(words){
  const ws = words.slice().sort((a,b) => (a.b.y0+a.b.y1)/2 - (b.b.y0+b.b.y1)/2);
  const lines = [];
  ws.forEach(w => {
    const cy = (w.b.y0+w.b.y1)/2, h = w.b.y1 - w.b.y0;
    const ln = lines.find(l => Math.abs(l.cy - cy) < Math.max(h, l.h) * 0.6);
    if(ln){ ln.words.push(w); ln.y0 = Math.min(ln.y0, w.b.y0); ln.y1 = Math.max(ln.y1, w.b.y1); ln.h = ln.y1 - ln.y0; ln.cy = (ln.y0+ln.y1)/2; }
    else lines.push({ words:[w], y0:w.b.y0, y1:w.b.y1, h, cy });
  });
  lines.forEach(l => { l.words.sort((a,b) => a.b.x0 - b.b.x0); l.text = l.words.map(w => w.t).join(' ').replace(/\s+/g,' ').trim(); l.conf = l.words.reduce((s,w)=>s+w.c,0)/l.words.length; });
  return lines.sort((a,b) => a.y0 - b.y0);
}
const PRICE_WORD = /(\d{1,4})[.,](\d{2})(?!\d)/;
const STOP_LINE = /(adicionar|carrinho|limitado|comprar|ver mais|frete|entrega|favorit|desconto|economize|sem juros|cupom|parcel|estoque|avalia)/i;
const letters = s => (String(s).match(/[A-Za-zÀ-ÿ]/g) || []).length;

function editDistance(a, b){
  if(Math.abs(a.length - b.length) > 1) return 9;
  const dp = Array.from({length: a.length+1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1; j<=b.length; j++) dp[0][j] = j;
  for(let i=1; i<=a.length; i++) for(let j=1; j<=b.length; j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}
function splitBrandAndPack(full, knownBrands){
  let name = ' ' + full.replace(/\s+/g,' ').trim() + ' ';
  let pack = '';
  const pm = name.match(/\s(?:aprox\.?\s*)?(\d+(?:[.,]\d+)?)\s?(kg|g|gr|ml|l|lt)\b\.?/i);
  if(pm){
    const u = pm[2].toLowerCase(); const unit = u==='gr' ? 'g' : (u==='l'||u==='lt') ? 'L' : u;
    pack = `${pm[1].replace('.',',')} ${unit}`;
    name = name.replace(pm[0], ' ');
  }
  name = name.replace(/\baprox\.?/ig,' ').replace(/\bIQF\b/g,' ');
  // marca: compara palavra por palavra, aceitando 1 letra lida errada (ex: "Fhiato" = Friato)
  let brand = '';
  const parts = name.trim().split(/\s+/);
  const all = [...new Set([...(knownBrands||[]), ...KNOWN_BRANDS])].filter(Boolean).sort((a,b) => b.length - a.length);
  outer: for(const br of all){
    const bparts = norm(br).split(' ');
    const total = bparts.join('').length; if(total < 2) continue;
    for(let i=0; i<=parts.length-bparts.length; i++){
      const cand = parts.slice(i, i+bparts.length).map(norm).join(' ');
      const dist = editDistance(cand, bparts.join(' '));
      if(dist === 0 || (dist === 1 && total >= 5)){ brand = br; parts.splice(i, bparts.length); break outer; }
    }
  }
  name = ' ' + parts.join(' ') + ' ';
  name = name.replace(/\s+/g,' ').replace(/^[\s\-–,.:]+|[\s\-–,.:]+$/g,'').trim();
  return { name: cap(name.toLowerCase()), brand, pack };
}

/* recebe as palavras lidas (com posição) e devolve produtos {nome, marca, pack, preco, porKg} */
function productsFromWords(words, imgW, knownBrands){
  const good = words.filter(w => w.t && w.t.trim());
  // 1. achar os preços
  const anchors = [];
  good.forEach((w, i) => {
    const m = w.t.match(PRICE_WORD); if(!m) return;
    const v = parseFloat(m[1]+'.'+m[2]); if(!(v > 0 && v < 10000)) return;
    const next = good[i+1];
    const perKg = /\/\s*(kg|l)\b/i.test(w.t) || (next && /^\/?\s*(kg|l)\b/i.test(next.t) && Math.abs(next.b.y0 - w.b.y0) < 30);
    anchors.push({ v, perKg, b: w.b, cx: (w.b.x0+w.b.x1)/2 });
  });
  const mains = anchors.filter(a => !a.perKg);
  if(!mains.length) return [];
  // 2. cada preço define uma coluna (meio do caminho até o vizinho da mesma altura)
  const products = [];
  mains.forEach(a => {
    const row = mains.filter(o => Math.abs((o.b.y0+o.b.y1)/2 - (a.b.y0+a.b.y1)/2) < (a.b.y1-a.b.y0)*1.5).sort((x,y)=>x.cx-y.cx);
    const idx = row.indexOf(a);
    const left = idx > 0 ? (row[idx-1].cx + a.cx)/2 : 0;
    const right = idx < row.length-1 ? (row[idx+1].cx + a.cx)/2 : (imgW || 1e9);
    const top = Math.max(0, ...mains.filter(o => o !== a && o.b.y1 < a.b.y0 && o.cx > left && o.cx < right).map(o => o.b.y1));
    const colWords = good.filter(w => { const cx = (w.b.x0+w.b.x1)/2; return cx > left && cx < right && w.b.y1 <= a.b.y0 + 2 && w.b.y0 >= top; });
    // linhas acima do preço; pega o bloco de texto mais perto (título)
    const lines = wordsToLines(colWords).filter(l => l.conf >= 55 && letters(l.text) >= 3 && letters(l.text)/l.text.length > 0.45 && !STOP_LINE.test(l.text) && !PRICE_WORD.test(l.text.replace(/\d+[.,]?\d*\s?(kg|g|ml|l)\b/ig,'')));
    if(!lines.length) return;
    const block = [lines[lines.length-1]];
    for(let i = lines.length-2; i >= 0 && block.length < 3; i--){
      const below = block[0], cur = lines[i];
      if(below.y0 - cur.y1 < Math.max(cur.h, below.h) * 0.9) block.unshift(cur); else break;
    }
    // preço por kg logo abaixo, na mesma coluna
    const kg = anchors.find(o => o.perKg && o.cx > left && o.cx < right && o.b.y0 > a.b.y0 && o.b.y0 - a.b.y1 < (a.b.y1-a.b.y0)*6);
    const sp = splitBrandAndPack(block.map(l => l.text).join(' '), knownBrands);
    if(letters(sp.name) < 3) return;
    products.push({ ...sp, preco: a.v, porKg: kg ? kg.v : null, y: a.b.y0, x: a.cx });
  });
  return products.sort((p,q) => (Math.abs(p.y-q.y) < 90 ? p.x-q.x : p.y-q.y));
}

function productToItem(p){
  if(!p.name) return null;
  const h = buildHistory().get(norm(p.name));
  const kgOnly = p.preco === null && p.porKg !== null;
  return {
    id: uid('i'), name: p.name, brand: p.brand || (h ? h.brand || '' : ''), pack: kgOnly ? '' : (p.pack || ''),
    qty: 1, unit: kgOnly ? 'kg' : 'un', unitPrice: kgOnly ? round2(p.porKg) : (p.preco === null ? null : round2(p.preco)),
    category: h ? h.category : guessCategory(p.name), priority: h ? (h.priority || 'normal') : 'normal', bought: false,
  };
}

async function handlePhoto(file){
  toast('🔎 Lendo a foto… (leva uns segundos)', null, null, 90000);
  try{
    await loadTesseract();
    const src = await loadBitmap(file);
    const brands = knownBrandsFromHistory();
    let lastText = '';
    // 1ª leitura com desfoque leve (bom para foto de tela e foto tremida); 2ª sem desfoque (print e etiqueta nítida)
    for(const blur of [true, false]){
      const canvas = await prepImage(src, blur);
      const res = await Tesseract.recognize(canvas, 'por');
      const data = (res && res.data) || {};
      lastText = data.text || lastText;
      const words = (data.words || []).map(w => ({ t: w.text, c: w.confidence, b: w.bbox }));
      const items = productsFromWords(words, canvas.width, brands).map(productToItem).filter(Boolean).slice(0, 12);
      if(items.length){
        hideToast();
        if(items.length === 1) openItemSheet(null, items[0]); else openMultiSheet(items);
        return;
      }
    }
    // não achou preço junto de nome: mostra o que conseguiu ler pra você escolher
    hideToast();
    const prices = extractPrices(lastText), names = extractNames(lastText);
    const sp = names[0] ? splitBrandAndPack(names[0], brands) : { name:'', brand:'', pack:'' };
    openItemSheet(null, { name: sp.name, brand: sp.brand, pack: sp.pack, qty: 1, unit: 'un', unitPrice: prices.length ? prices[0] : null, category: sp.name ? guessCategory(sp.name) : 'mercearia', priority: 'normal' }, { names, prices });
  }catch(e){
    console.warn(e);
    hideToast();
    toast('Não consegui ler a foto agora. Precisa de internet na 1ª vez.', null, null, 4000);
  }
}

document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.swipe-card'); if(!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
  if(e.target.closest('.hist-del')) return;
  swp = { wrap: card.parentElement, card, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dir: null };
});
document.addEventListener('pointermove', e => {
  if(!swp || e.pointerId !== swp.id) return;
  const dx = e.clientX - swp.x, dy = e.clientY - swp.y;
  if(!swp.dir){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    swp.dir = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    if(swp.dir === 'h'){ try{ swp.card.setPointerCapture(e.pointerId); }catch(_){} }
  }
  if(swp.dir !== 'h') return;
  swp.dx = Math.min(0, dx);
  swp.card.style.transition = 'none';
  swp.card.style.transform = `translateX(${swp.dx}px)`;
  swp.wrap.classList.toggle('armed', swp.dx < -Math.min(140, swp.wrap.offsetWidth * 0.35));
});
function endSwipe(e){
  if(!swp || (e && e.pointerId !== swp.id)) return;
  const s = swp; swp = null;
  if(s.dir !== 'h') return;
  swipeEndAt = Date.now();
  s.card.style.transition = '';
  if(s.wrap.classList.contains('armed')){
    s.card.style.transform = 'translateX(-110%)';
    s.wrap.style.transition = 'opacity .2s'; s.wrap.style.opacity = '.4';
    const act = s.wrap.dataset.swipe, id = s.wrap.dataset.id;

    case 'import-recipe': openRecipeImport(); break;
    case 'receipt': openReceiptSheet(); break;
    case 'rc-photo': document.getElementById('receipt-photo-input').click(); break;
    case 'rc-paste': {
      const ta = document.getElementById('d-rctext');
      const fail = () => { ta.focus(); toast('Toque e segure na caixa de texto e escolha "Colar".', null, null, 3500); };
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(t => {
          if(!t){ toast('Nada copiado ainda.', null, null, 3000); return; }
          state.sheet.draft.text = t; ta.value = t; readReceiptText();
        }).catch(fail);
      } else fail();
      break;
    }
    case 'rc-read': readReceiptText(); break;
    case 'rcv-toggle': {
      const i = Number(el.dataset.idx), off = state.sheet.off; off.has(i) ? off.delete(i) : off.add(i);
      const box = document.getElementById('sheet-box'), top = box.scrollTop; renderReceiptReview(); box.scrollTop = top; break;
    }
    case 'rcv-save': saveReceipt(); break;
    case 'rcv-back': { const t = state.sheet.text, qr = state.sheet.qr; openReceiptSheet(); state.sheet.draft.text = t; state.sheet.qr = qr; document.getElementById('d-rctext').value = t; break; }
    case 'ri-photo': document.getElementById('recipe-photo-input').click(); break;
    case 'ri-paste': {
      const ta = document.getElementById('d-rtext');
      const fail = () => { ta.focus(); toast('Toque e segure na caixa de texto e escolha "Colar".', null, null, 3500); };
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(t => {
          if(!t){ toast('Nada copiado ainda — copie o texto da foto primeiro.', null, null, 3500); return; }
          state.sheet.draft.text = (ta.value ? ta.value + '\n' : '') + t; ta.value = state.sheet.draft.text;
        }).catch(fail);
      } else fail();
      break;
    }
    case 'ri-read': readRecipeText(); break;
    case 'rv-toggle': {
      const i = Number(el.dataset.idx), off = state.sheet.off; off.has(i) ? off.delete(i) : off.add(i);
      const box = document.getElementById('sheet-box'), top = box.scrollTop; renderRecipeReview(); box.scrollTop = top; break;
    }
    case 'rv-save': saveImportedRecipe(); break;
    case 'rv-back': { const t = state.sheet.text; openRecipeImport(); state.sheet.draft.text = t; document.getElementById('d-rtext').value = t; break; }
    case 'open-recipe': state.recipeId = id; state.screen = 'recipe'; render(); window.scrollTo(0,0); ensureTaco(); break;
    case 'recipes-back': {
      const r = activeRecipe();
      if(r && !r.ingredients.length && r.name === 'Nova receita'){ r.deleted = true; touch(r); }
      state.screen = 'recipes'; state.recipeId = null; render(); window.scrollTo(0,0); break;
    }
    case 'recipe-settings': openRecipeSheet(false); break;
    case 'recipe-save': saveRecipeSheet(); break;
    case 'recipe-del': { const rid = state.recipeId; closeSheet(); deleteRecipe(rid); break; }
    case 'recipe-dup': duplicateRecipe(); break;
    case 'por-inc': changePortions(1); break;
    case 'por-dec': changePortions(-1); break;
    case 'ing-new': openIngSheet(null); break;
    case 'ing-edit': openIngSheet(id); break;
    case 'ing-pick': pickFood(el.dataset.food); break;
    case 'ing-change': state.sheet.food = null; renderIngSheet(); break;
    case 'ing-unit': {
      pick(); const prev = d.unit; d.unit = val;
      const presets = { g: 100, kg: 1, ml: 100, L: 1, un: 1, cs: 1, cc: 1, xic: 1 };
      if(prev !== val){ d.qty = numToInput(presets[val]); document.getElementById('d-iqty').value = d.qty; }
      document.getElementById('gpu-box').style.display = val === 'un' ? '' : 'none';
      updateIngPreview(); break;
    }
    case 'ing-inc': case 'ing-dec': {
      const stepMap = { g: 10, ml: 10, kg: 0.1, L: 0.1, un: 1, cs: 1, cc: 1, xic: 0.5 };
      const st = stepMap[d.unit] || 1; let q = parseNum(d.qty) || 0;
      q = act === 'ing-inc' ? q + st : Math.max(st, q - st);
      d.qty = numToInput(round3(q)); document.getElementById('d-iqty').value = d.qty; updateIngPreview(); break;
    }
    case 'ing-save': saveIngSheet(); break;
    case 'ing-del': { const sh = state.sheet; closeSheet(); if(sh.target && sh.target.kind === 'meal') removeMealEntry(sh.target.date, sh.target.meal, sh.ingId); else removeIng(sh.ingId); break; }
    case 'food-new': openFoodSheet(state.sheet.draft.q, null, { kind: 'new', target: state.sheet.target, ingId: state.sheet.ingId, q: state.sheet.draft.q }); break;
    case 'food-edit': {
      const sh = state.sheet;
      const ret = sh.type === 'mealadd' ? { kind: 'mealadd', meal: sh.meal, q: sh.draft.q } : { kind: 'search', target: sh.target, ingId: sh.ingId, q: sh.draft.q };
      openFoodSheet('', el.dataset.food, ret); break;
    }
    case 'food-edit-picked': {
      const sh = state.sheet;
      openFoodSheet('', sh.food.id, { kind: 'picked', target: sh.target, ingId: sh.ingId, foodId: sh.food.id, draft: { ...sh.draft } }); break;
    }
    case 'food-del': deleteFood(); break;
    case 'food-cancel': { const sh = state.sheet; closeSheet(); if(sh.ret) returnFromFood(sh.ret.kind === 'new' ? { ...sh.ret, kind: 'search' } : sh.ret, sh.ret.foodId || null); break; }
    case 'food-save': saveFoodSheet(); break;
    case 'fl-mode': { const sh = state.sheet; sh.draft.mode = val; const box = document.getElementById('sheet-box'), top = box.scrollTop; renderFoodSheet(val === 'por' ? '#d-fporG' : null); box.scrollTop = top; break; }
    case 'fl-more': { const sh = state.sheet; sh.draft.more = !sh.draft.more; const box = document.getElementById('sheet-box'), top = box.scrollTop; renderFoodSheet(sh.draft.more ? '#d-fp' : null); box.scrollTop = top; break; }
    case 'fl-photo': document.getElementById('label-photo-input').click(); break;
    case 'recipe-to-list': openToListSheet({ kind: 'recipe', id: state.recipeId }); break;
    case 'times-inc': case 'times-dec': {
      let t = parseNum(d.times) || 1; t = act === 'times-inc' ? t + 1 : Math.max(1, t - 1);
      d.times = String(t); document.getElementById('d-times').value = d.times; break;
    }
    case 'tolist-go': sendToList(id); break;
    case 'open': openList(id); break;
    case 'back': goHome(); break;
    case 'new-list':
      if(liveLists().length) document.getElementById('newlist-overlay').classList.add('show');
      else createNewList([]);
      break;
    case 'newlist': {
      document.getElementById('newlist-overlay').classList.remove('show');
      const last = liveLists().sort(byRecent)[0];
      const mode = el.dataset.mode;
      if(mode === 'empty' || !last) createNewList([]);
      else createNewList(last.items.filter(it => mode === 'all' || !it.bought).map(it => ({ ...it, id: uid('i'), bought: false })));
      break;
    }
    case 'del-list': e.stopPropagation(); deleteList(id); break;
    case 'show-all-history': state.showAllHistory = true; render(); break;
    case 'list-settings': openListSheet(); break;
    case 'calc': document.getElementById('calc-overlay').classList.add('show'); break;
    case 'close-overlays': closeOverlays(); break;
    case 'quick-add': addQuick(); break;
    case 'sugg': addFromHistory(el.dataset.key); break;
    case 'photo': openPhotoChooser(); break;
    case 'photo-camera': closeSheet(); document.getElementById('photo-input').click(); break;
    case 'photo-gallery': closeSheet(); document.getElementById('gallery-input').click(); break;
    case 'multi-toggle': {
      const i = Number(el.dataset.idx), off = state.sheet.off;
      off.has(i) ? off.delete(i) : off.add(i);
      el.classList.toggle('on', !off.has(i)); el.textContent = off.has(i) ? '' : '✓';
      const n = state.sheet.items.length - off.size, btn = document.getElementById('multi-add-btn');
      btn.disabled = !n; btn.style.opacity = n ? '1' : '.5'; btn.textContent = n ? `Adicionar ${n} ${n>1?'produtos':'produto'}` : 'Adicionar';
      break;
    }
    case 'multi-add': addMultiProducts(); break;
    case 'multi-edit': { const it = state.sheet.items[Number(el.dataset.idx)]; closeSheet(); openItemSheet(null, it); break; }
    case 'import': openImportSheet(); break;
    case 'imp-paste': {
      const ta = document.getElementById('d-imp');
      if(navigator.clipboard && navigator.clipboard.readText){
        navigator.clipboard.readText().then(t => {
          if(!t) { toast('Nada copiado ainda — copie o texto da foto primeiro.', null, null, 3500); return; }
          state.sheet.draft.text = (ta.value ? ta.value + '\n' : '') + t; ta.value = state.sheet.draft.text; updateImportPreview();
        }).catch(() => { ta.focus(); toast('Toque e segure na caixa abaixo e escolha "Colar".', null, null, 3500); });
      } else { ta.focus(); toast('Toque e segure na caixa abaixo e escolha "Colar".', null, null, 3500); }
      break;
    }
    case 'imp-toggle': {
      const i = Number(el.dataset.idx), off = state.sheet.off;
      off.has(i) ? off.delete(i) : off.add(i);
      updateImportPreview();
      break;
    }
    case 'imp-add': addImported(); break;
    case 'new-detailed': {
      const p = parseQuick(state.quick);
      const preset = p.name ? buildItemFromName(p.name, p.qty, p.unit) : null;
      state.quick = ''; const inp = document.getElementById('quick-input'); if(inp) inp.value = '';
      openItemSheet(null, preset);
      break;
    }
    case 'toggle': toggleItem(id); break;
    case 'edit': openItemSheet(id); break;
    case 'price': openPriceSheet(id, false); break;
    case 'list-search-clear': { state.listSearch = ''; const i = document.getElementById('list-search'); if(i){ i.value = ''; } el.classList.add('hide'); renderItems(); break; }
    case 'search-add': {
      const name = state.listSearch.trim(); if(!name) break;
      const p = parseQuick(name); addItemToActive(buildItemFromName(p.name, p.qty, p.unit));
      state.listSearch = ''; const i = document.getElementById('list-search'); if(i) i.value = '';
      const c = document.querySelector('[data-act="list-search-clear"]'); if(c) c.classList.add('hide');
      renderItems(); break;
    }
    case 'toggle-cart': state.cartOpen = !state.cartOpen; renderItems(); break;
    case 'finish': finishList(); break;
    case 'reopen': { const l = active(); if(l){ l.status = 'open'; touch(l); render(); } break; }

    /* dentro das janelas */
    case 'sheet-close': closeSheet(); break;
    case 'unit-pick': {
      pick(); d.unit = val;
      const lbl = document.getElementById('unit-lbl'); if(lbl) lbl.textContent = val === 'un' ? 'de cada' : 'por '+val;
      break;
    }
    case 'cat-pick': pick(); d.category = val; break;
    case 'prio-pick': pick(); d.priority = val; break;
    case 'qty-inc': case 'qty-dec': {
      const step = unitStep(d.unit); let q = parseNum(d.qty) || 0;
      q = act === 'qty-inc' ? q + step : Math.max(step, q - step);
      d.qty = numToInput(round3(q)); document.getElementById('d-qty').value = d.qty; updatePreview();
      break;
    }
    case 'ocr-name': {
      pick(); d.name = val; document.getElementById('d-name').value = val;
      const h = buildHistory().get(norm(val));
      const cat = h ? h.category : guessCategory(val);
      d.category = cat;
      document.querySelectorAll('[data-act="cat-pick"]').forEach(x => x.classList.toggle('sel', x.dataset.val === cat));
      break;
    }
    case 'ocr-price': pick(); d.price = numToInput(Number(val)); document.getElementById('d-price').value = d.price; updatePreview(); break;
    case 'item-save': saveItemSheet(); break;
    case 'item-del': { const sid = state.sheet.id; closeSheet(); removeItem(sid); break; }
    case 'price-save': savePriceSheet(); break;
    case 'list-save': saveListSheet(); break;
    case 'list-delete': { const lid = state.activeId; closeSheet(); deleteList(lid); break; }
    case 'toast-action': { const fn = toastFn; hideToast(); if(fn) fn(); break; }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'quick-input'){ state.quick = t.value; renderSugg(); return; }
  if(t.id === 'list-search'){
    state.listSearch = t.value; renderItems();
    const c = document.querySelector('[data-act="list-search-clear"]'); if(c) c.classList.toggle('hide', !t.value); return;
  }
  if(t.id === 'recipe-search'){
    state.recipeSearch = t.value;
    const tmp = document.createElement('div'); tmp.innerHTML = renderRecipes();
    document.getElementById('recipe-cards').innerHTML = tmp.querySelector('#recipe-cards').innerHTML; return;
  }
  if(t.id === 'rec-notes'){
    const r = activeRecipe(); if(r){ r.notes = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => touch(r), 600); } return;
  }
  if(t.dataset && t.dataset.draft && state.sheet){
    state.sheet.draft[t.dataset.draft] = t.value;
    t.style.borderColor = '';
    if(state.sheet.type === 'import'){ state.sheet.off.clear(); updateImportPreview(); }
    else if(state.sheet.type === 'ing'){ if(t.id === 'ing-q') renderIngResults(); else updateIngPreview(); }
    else if(state.sheet.type === 'mealadd') renderMealResults();
    else if(state.sheet.type === 'mealrec') updateMrPreview();
    else if(state.sheet.type === 'profile') updateProfilePreview();
    else if(state.sheet.type === 'food') updateFoodPreview();
    else updatePreview();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeOverlays(); return; }
  if(e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  if(e.target.id === 'quick-input'){ e.preventDefault(); addQuick(); return; }
  if(e.target.dataset && e.target.dataset.draft && state.sheet){
    e.preventDefault();
    if(state.sheet.type === 'price') savePriceSheet();
    else if(state.sheet.type === 'item') saveItemSheet();
    else if(state.sheet.type === 'list') saveListSheet();
    else if(state.sheet.type === 'recipe') saveRecipeSheet();
    else if(state.sheet.type === 'ing' && state.sheet.food) saveIngSheet();
    else if(state.sheet.type === 'ing'){ const first = document.querySelector('#ing-results .res-row'); if(first) first.click(); }
    else if(state.sheet.type === 'food') saveFoodSheet();
    else if(state.sheet.type === 'mealadd'){ const first = document.querySelector('#meal-results .res-row'); if(first) first.click(); }
    else if(state.sheet.type === 'mealrec') saveMealRecipe();
    else if(state.sheet.type === 'profile') saveProfile();
  }
});
document.getElementById('label-photo-input').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file && state.sheet && state.sheet.type === 'food') foodLabelPhoto(file);
});
document.getElementById('receipt-photo-input').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file && state.sheet && state.sheet.type === 'receipt') receiptPhoto(file);
});
document.getElementById('recipe-photo-input').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file && state.sheet && state.sheet.type === 'recimport') recipePhotoToText(file);
});
['photo-input','gallery-input'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file) handlePhoto(file);
}));

/* =========================================================
   CALCULADORA (não mexe na lista)
   ========================================================= */
const calcKeys = ['C','⌫','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0',',','='];
const calcGrid = document.getElementById('calc-grid');
calcGrid.innerHTML = calcKeys.map(k => {
  let cls = 'calc-btn';
  if(['÷','×','-','+'].includes(k)) cls += ' op';
  if(k === '=') cls += ' eq';
  if(k === 'C') cls += ' clear';
  return `<button class="${cls}" style="${k==='0' ? 'grid-column:span 2;' : ''}" data-key="${k}">${k}</button>`;
}).join('');
let calcExpr = '';
const calcDisplay = document.getElementById('calc-display');
function calcRefresh(){ calcDisplay.textContent = calcExpr === '' ? '0' : calcExpr; }
calcGrid.addEventListener('click', e => {
  const btn = e.target.closest('[data-key]'); if(!btn) return;
  const k = btn.dataset.key;
  if(k === 'C'){ calcExpr = ''; }
  else if(k === '⌫'){ calcExpr = calcExpr.slice(0, -1); }
  else if(k === '='){
    try{
      const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100').replace(/,/g,'.');
      if(!/^[0-9+\-*/.() ]+$/.test(safe)) return;
      const result = Function('"use strict"; return (' + safe + ')')();
      calcExpr = String(round2(result)).replace('.', ',');
    }catch(err){ calcExpr = 'Erro'; }
  }
  else { if(calcExpr === 'Erro') calcExpr = ''; calcExpr += k; }
  calcRefresh();
});

/* =========================================================
   INÍCIO
   ========================================================= */
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', syncNow);
window.addEventListener('offline', () => setSync('off'));

render();
syncNow();

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
